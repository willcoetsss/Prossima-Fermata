<title>Prossima Fermata</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&display=swap">
<style>/* Concepto: un viaje en tren por Italia de norte a sur. Seis rutas regionales numeradas, cada parada una ciudad real.
   Señalética ferroviaria: paneles de salidas oscuros, carteles de estación azules, tipografía condensada. */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#E9EBE6; --ink:#15181B; --muted:#5B6168; --line:#D6D9D2;
  --m1:#D52B1E; --m2:#00843D; --m3:#E9A500; --m5:#8E4F9E;
  --r1:#C8322A; --r2:#1F6FB2; --r3:#B86B0C; --r4:#2E8540; --r5:#7A4FA0; --r6:#0B8794;
  --sea:#D7E5EC; --land:#FBFAF6; --land-line:#CDC9BE; --neigh:#ECEAE3; --plate:#173E8C; --plate-fg:#FFFFFF;
  --ok:#1C8A4C; --ok-bg:#E3F3E9; --bad:#C2352B; --bad-bg:#FBE7E4; --warn:#9A6A00;
  --sign:#16191C; --sign-fg:#F4F5F2; --sign-muted:#A9AFB5;
  --f-ui:"Archivo",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-it:"Newsreader",Georgia,"Times New Roman",serif;
  --r:12px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1113; --surface:#181B1E; --sunk:#202428; --ink:#ECEEEA; --muted:#9BA1A8; --line:#2C3136;
  --m1:#F0574B; --m2:#2EB36B; --m3:#F3BC2F; --m5:#B583C6;
  --r1:#F0574B; --r2:#5AA2E6; --r3:#EDA03A; --r4:#4CC36B; --r5:#B38AD9; --r6:#35C2CE;
  --sea:#0F1B23; --land:#1E2226; --land-line:#3A4046; --neigh:#16191C; --plate:#1D4AA6; --plate-fg:#FFFFFF;
  --ok:#4CC37F; --ok-bg:#16301F; --bad:#F06A5F; --bad-bg:#3A1A17; --warn:#E3B341;
  --sign:#050607; --sign-fg:#F4F5F2; --sign-muted:#9BA1A8; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1113; --surface:#181B1E; --sunk:#202428; --ink:#ECEEEA; --muted:#9BA1A8; --line:#2C3136;
  --m1:#F0574B; --m2:#2EB36B; --m3:#F3BC2F; --m5:#B583C6;
  --r1:#F0574B; --r2:#5AA2E6; --r3:#EDA03A; --r4:#4CC36B; --r5:#B38AD9; --r6:#35C2CE;
  --sea:#0F1B23; --land:#1E2226; --land-line:#3A4046; --neigh:#16191C; --plate:#1D4AA6; --plate-fg:#FFFFFF;
  --ok:#4CC37F; --ok-bg:#16301F; --bad:#F06A5F; --bad-bg:#3A1A17; --warn:#E3B341;
  --sign:#050607; --sign-fg:#F4F5F2; --sign-muted:#9BA1A8; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
html{font-size:calc(16px * var(--fs,1));-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:1rem;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--m3);outline-offset:2px}
.it{font-family:var(--f-it);font-optical-sizing:auto}
h1,h2,h3{font-stretch:78%;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:2rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.35rem;font-weight:750}
h3{font-size:1.08rem;font-weight:700;font-stretch:90%}
p{margin:0}
.label{font-size:.72rem;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-stretch:100%}
.muted{color:var(--muted)}
.small{font-size:.87rem}
.num{font-variant-numeric:tabular-nums}

/* Layout */
#app{min-height:100%}
#main{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--nav-h) + 32px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:4px}

/* Navegación */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;min-width:58px;color:var(--muted);font-size:.7rem;font-weight:600;letter-spacing:.02em;border-radius:10px}
.nav button svg{width:24px;height:24px}
.nav button[aria-current="page"]{color:var(--ink)}
.nav button[aria-current="page"] .dot{background:var(--m1)}
.nav .dot{width:5px;height:5px;border-radius:50%;background:transparent;margin-top:1px}
.nav .brand{display:none}
body[data-mode="session"] .nav{display:none}
body[data-mode="session"] #main{padding-bottom:calc(32px + env(safe-area-inset-bottom,0px))}
@media (min-width:900px){
  .nav{top:0;right:auto;width:220px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--line);padding:24px 14px}
  .nav button{flex-direction:row;gap:12px;font-size:.95rem;padding:10px 12px;min-width:0;justify-content:flex-start}
  .nav button[aria-current="page"]{background:var(--sunk)}
  .nav .dot{display:none}
  .nav .brand{display:block;padding:0 12px 18px}
  #main{margin-left:max(220px,calc(50% - 390px + 110px));padding-bottom:48px}
  body[data-mode="session"] #main{margin-left:auto}
}

/* Superficies */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel.tight{padding:12px 14px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>*+*{border-top:1px solid var(--line)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;background:none;border:0;text-align:left}
button.li:hover{background:var(--sunk)}
.sign{background:var(--sign);color:var(--sign-fg);border-radius:var(--r);padding:18px 18px 20px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.sign .label{color:var(--sign-muted)}
.sign h1{font-size:2.3rem;font-stretch:70%;font-weight:800;margin-top:6px}
.sign .bar{position:absolute;left:0;right:0;top:0;height:6px}

/* Chapas de línea */
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:999px;font-size:.74rem;font-weight:750;letter-spacing:.04em;color:#fff;font-stretch:90%;white-space:nowrap}
.pill.M1{background:var(--m1)} .pill.M2{background:var(--m2)} .pill.M3{background:var(--m3);color:#1A1405} .pill.M5{background:var(--m5)}
.chip{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:6px;font-size:.72rem;font-weight:650;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{color:var(--warn)}

/* Botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:650;text-decoration:none}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{opacity:.9}
.btn.full{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.icon-btn{width:40px;height:40px;display:inline-grid;place-items:center;border-radius:10px;border:1px solid var(--line);background:var(--surface);flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn.ghost{border-color:transparent;background:none}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:650;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0/.08)}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* Barra de progreso */
.prog{height:6px;background:var(--sunk);border-radius:99px;overflow:hidden}
.prog>i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}

/* Hoy */
.goal{display:flex;align-items:center;gap:16px}
.goal svg{flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.stat b{display:block;font-size:1.45rem;font-stretch:80%;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.78rem;color:var(--muted)}

/* Ruta (mapa de metro) */
/* Mapa de Italia */
.chips-row{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;margin-inline:-2px}
.chips-row::-webkit-scrollbar{display:none}
.rchip{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 13px 0 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface);white-space:nowrap;font-weight:650;font-size:.88rem;flex:none}
.rchip.all{padding-left:13px}
.rchip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.rbadge{width:26px;height:26px;border-radius:50%;display:inline-grid;place-items:center;background:var(--rc,var(--ink));color:#fff;font-weight:800;font-size:.86rem;flex:none;font-stretch:90%;line-height:1}
.rbadge.lg{width:42px;height:42px;font-size:1.3rem}
.map-wrap{position:relative;height:clamp(330px,52vh,620px);border-radius:var(--r);overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.map-wrap svg{width:100%;height:100%;display:block;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.m-neigh{fill:var(--neigh);stroke:var(--land-line)}
.m-reg{fill:var(--land);stroke:var(--land-line)}
.m-reg.hl{fill:color-mix(in srgb,var(--rc) 11%,var(--land))}
.m-sea{fill:color-mix(in srgb,var(--muted) 55%,var(--sea));font-family:var(--f-it);font-style:italic;letter-spacing:.06em;text-anchor:middle}
.m-regl{fill:var(--muted);font-family:var(--f-ui);font-weight:650;letter-spacing:.14em;text-transform:uppercase;text-anchor:middle;opacity:.7}
.m-tr{fill:none;stroke:var(--muted);stroke-dasharray:1 6;stroke-linecap:round;opacity:.85}
.m-case{fill:none;stroke:var(--land);stroke-linejoin:round;stroke-linecap:round}
.m-leg{fill:none;stroke:var(--rc);stroke-linejoin:round;stroke-linecap:round}
.m-leg.todo{opacity:.4}
.m-leg.sea{stroke-dasharray:5 6;stroke-linecap:butt}
.m-route{cursor:pointer}
.m-route.dim,.m-stg.dim,.m-badge.dim{opacity:.3}
.m-st{fill:var(--surface);stroke:var(--rc);stroke-width:2.6}
.m-st.done{fill:var(--rc);stroke:var(--land)}
.m-halo{fill:var(--rc);opacity:.28}
@media (prefers-reduced-motion:no-preference){.m-halo{animation:halo 2.2s ease-in-out infinite}}
@keyframes halo{50%{opacity:.06}}
.m-hit{fill:transparent}
.m-stg,.m-badge{cursor:pointer}
.m-lbl{fill:var(--ink);font-family:var(--f-ui);font-weight:750;font-stretch:88%;paint-order:stroke;stroke:var(--land);stroke-width:3.5px;stroke-linejoin:round}
.m-badge circle{fill:var(--rc);stroke:var(--land);stroke-width:2.5}
.m-badge text{fill:#fff;font-family:var(--f-ui);font-weight:800;font-size:12.5px;text-anchor:middle;dominant-baseline:central}
.map-hint{position:absolute;left:10px;bottom:10px;background:color-mix(in srgb,var(--surface) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.75rem;color:var(--muted);pointer-events:none}
.plate{background:var(--plate);color:var(--plate-fg);border-radius:10px;padding:6px}
.plate-in{border:2px solid color-mix(in srgb,var(--plate-fg) 80%,transparent);border-radius:6px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:4px}
.plate h1{font-size:2.5rem;font-stretch:70%;font-weight:800;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.plate .label{color:color-mix(in srgb,var(--plate-fg) 72%,transparent)}
.plate-sub{color:color-mix(in srgb,var(--plate-fg) 82%,transparent);font-size:.92rem}
.city-fact{font-family:var(--f-it);font-size:1.08rem;line-height:1.5}
.leg-info{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--muted)}
.leg-info svg{width:18px;height:18px;flex:none;margin-top:2px}
.stat b small{font-size:.85rem;color:var(--muted);font-weight:650;margin-left:2px}

.plate-main{display:flex;align-items:center;gap:14px}
.plate .art{border:2px solid color-mix(in srgb,var(--plate-fg) 80%,transparent)}
.route-tools{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.line-head{display:flex;align-items:center;gap:10px;margin:8px 0 4px}
.stations{position:relative;padding-left:4px}
.station{position:relative;display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;text-align:left;padding:10px 6px 10px 0;border-radius:10px}
.station:hover .st-name{text-decoration:underline;text-underline-offset:3px}
.st-track{position:relative;width:34px;align-self:stretch;flex:none;display:grid;place-items:center}
.st-track::before{content:"";position:absolute;top:-12px;bottom:-12px;left:50%;width:8px;transform:translateX(-50%);background:var(--lc)}
.station:first-child .st-track::before{top:50%}
.station:last-child .st-track::before{bottom:50%}
.station.locked .st-track::before{background:color-mix(in srgb,var(--lc) 30%,var(--line))}
.st-dot{position:relative;z-index:1;width:26px;height:26px;border-radius:50%;background:var(--surface);border:5px solid var(--lc);display:grid;place-items:center}
.station.done .st-dot{background:var(--lc);border-color:var(--lc)}
.station.done .st-dot svg{width:14px;height:14px;color:#fff}
.station.locked .st-dot{border-color:color-mix(in srgb,var(--lc) 30%,var(--line))}
.station.current .st-dot{width:32px;height:32px;border-width:6px;box-shadow:0 0 0 5px color-mix(in srgb,var(--lc) 25%,transparent)}
@media (prefers-reduced-motion:no-preference){.station.current .st-dot{animation:pulse 2.2s ease-in-out infinite}}
@keyframes pulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--lc) 12%,transparent)}}
.st-name{font-weight:780;font-stretch:78%;font-size:1.15rem;line-height:1.15}
.station.locked .st-name{color:var(--muted)}
.st-sub{font-size:.84rem;color:var(--muted)}
.steps{display:flex;flex-direction:column;gap:8px}
.step{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%;text-align:left}
.step:disabled{opacity:.5}
.step .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:750;font-size:.85rem;background:var(--sunk);flex:none}
.step.ok .n{background:var(--ok);color:#fff}

/* Logo: pizza «Boh» */
.logo{display:block;flex:none;width:44px;height:44px;filter:drop-shadow(0 1px 1.5px rgb(0 0 0/.18))}
.brand-row{display:flex;align-items:center;gap:12px;min-width:0}
@media (min-width:900px){.nav .brand{display:flex!important;align-items:center;gap:10px}.nav .brand .logo{width:50px;height:50px}.today-logo{display:none}}

/* Palabras */
.word{display:flex;align-items:center;gap:12px;padding:10px 14px}
.word .it{font-size:1.12rem;line-height:1.25}
.word .es{font-size:.88rem;color:var(--muted)}
.mdot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.mdot.l1{background:var(--m3)} .mdot.l2{background:var(--ok)}
.blocks{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.block{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left}
.block b{font-weight:750;font-stretch:85%;font-variant-numeric:tabular-nums}
.search{width:100%;min-height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.field{display:flex;flex-direction:column;gap:6px}
.field input,.field select,.field textarea{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.field textarea{min-height:120px;font-family:ui-monospace,monospace;font-size:1rem}

/* Gramática */
.doc{display:flex;flex-direction:column;gap:14px;max-width:68ch}
.doc .it{font-size:1.06em}
.doc em.it{font-style:italic}
.doc ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tbl table{border-collapse:collapse;width:100%;font-size:.95rem}
.tbl th,.tbl td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
.tbl td:first-child{color:var(--muted)}
.note{border-left:4px solid var(--m3);background:var(--surface);padding:10px 14px;border-radius:0 10px 10px 0}
.errs{background:var(--bad-bg);border-radius:var(--r);padding:14px 16px}
.errs h3{color:var(--bad);margin-bottom:6px}

/* Sesión */
.ses-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.ses-top .prog{flex:1;height:10px}
.ses-top .prog>i{background:var(--lc,var(--ink))}
.q{display:flex;flex-direction:column;gap:18px;min-height:46vh}
.q .prompt{font-size:1.65rem;line-height:1.25}
.q .ask{font-weight:700;font-stretch:90%;font-size:1.05rem}
.opts{display:grid;gap:10px}
.opt{min-height:54px;padding:12px 16px;border:2px solid var(--line);border-radius:12px;background:var(--surface);text-align:left;font-size:1.05rem}
.opt:hover{border-color:var(--muted)}
.opt.sel{border-color:var(--ink)}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.tin{width:100%;min-height:52px;padding:10px 14px;font-size:1.1rem;border:2px solid var(--line);border-radius:12px;background:var(--surface);font-family:var(--f-it)}
.tin:focus{border-color:var(--ink);outline:none}
.gap-line{font-size:1.25rem;line-height:2.4;font-family:var(--f-it)}
.gin{display:inline-block;border:0;border-bottom:2px solid var(--ink);background:var(--sunk);border-radius:6px 6px 0 0;padding:2px 6px;margin:0 2px;font-family:var(--f-it);font-size:1.1rem;min-width:3ch;text-align:center}
.gin.right{border-color:var(--ok);background:var(--ok-bg)} .gin.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ttable input{width:100%;min-width:90px;border:0;border-bottom:2px solid var(--line);background:transparent;padding:4px 2px;font-family:var(--f-it);font-size:1rem}
.ttable input:focus{border-color:var(--ink);outline:none}
.ttable input.right{border-color:var(--ok);background:var(--ok-bg)} .ttable input.wrong{border-color:var(--bad);background:var(--bad-bg)}
.ttable td{white-space:normal}
.tokens{display:flex;flex-wrap:wrap;gap:8px}
.tok{padding:8px 12px;border-radius:10px;border:1px solid var(--line);border-bottom-width:3px;background:var(--surface);font-family:var(--f-it);font-size:1.1rem}
.tok.used{visibility:hidden}
.answer-line{min-height:58px;border-bottom:2px solid var(--line);padding:6px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:28px 22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;min-height:240px;justify-content:center}
.card .big{font-size:2.1rem;line-height:1.15}
.card .ex{border-top:1px dashed var(--line);padding-top:12px;width:100%}
