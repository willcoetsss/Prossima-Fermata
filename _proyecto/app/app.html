    document.querySelectorAll(".sent.on").forEach(e => e.classList.remove("on")); const n = $("#sent-" + el.dataset.v); if (n) n.classList.add("on"); },
  storyQuiz: el => { const s = STORIES.find(x => x.id === el.dataset.v); try { speechSynthesis.cancel(); } catch {} if (READ) READ.tok = (READ.tok || 0) + 1;
    const qs = s.q.map(q => { const order = shuffle(q.o.map((_, j) => j)); return {type:"sq", stat:"story", title:s.title, q:q.q, o:order.map(j => q.o[j]), a:order.indexOf(q.a)}; });
    startSession("Comprensión · " + s.title, qs, {requeue:false, color:LV[s.lvl].c, onDone: pct => { const r = S.storie[s.id] || (S.storie[s.id] = {}); const first = r.best == null; r.best = Math.max(r.best || 0, pct); if (first) addXP(10);
      return {headline: pct >= .99 ? "Capito tutto!" : pct >= .6 ? "Bene!" : "Rileggi la storia", msg: pct >= .99 ? "Has entendido el relato entero." : "Vuelve a leerlo con la traducción y escucha las frases que no entendiste."}; }}); },
  plcIntro: () => go("plcIntro"),
  plcStart: () => startPlacement(),
  placeGo: el => { const p = +el.dataset.v; UNITS.slice(0, p).forEach(u => { if (!unitDone(u)) completeUnit(u, 0); }); S.onboarded = true; save(); STACK.length = 0; VIEW = {name:"route"}; NAV = "fade"; render(); toast(`Empiezas en ${UNITS[p].name}`); },
  tab: el => { if (el.dataset.v === "route") { MAPSEL = currentUnit().route.id; MAPVB = null; } tab(el.dataset.v); },
  mapSel: el => { MAPSEL = el.dataset.v || null; render(); },
  mapCity: el => citySheet(UNITS.find(x => x.id === el.dataset.v)),
  geoQuiz: startGeoQuiz,
  geoPick: el => pickAnswer(+el.dataset.v),
  back: () => { if (VIEW.name === "dialog") D = null; if (VIEW.name === "story" && READ) { READ.tok = (READ.tok || 0) + 1; try { speechSynthesis.cancel(); } catch {} } back(); },
  say: el => say(el.dataset.t),
  settings: openSettings,
  closeSheet,
  onboard: el => {
    S.settings.name = ($("#ob-name").value || "").trim().slice(0, 30); S.settings.gender = $("#ob-g").value;
    const lvl = el.dataset.v;
    if (lvl !== "A1") { const stop = LEVELS.indexOf(lvl); UNITS.filter(u => LEVELS.indexOf(u.lvl) < stop).forEach(u => completeUnit(u, 0)); }
    S.onboarded = true; save(); render(); toast(lvl === "A1" ? "¡Buen viaje! Primera parada: Turín" : `Te subes al tren en ${cityOf(currentUnit()).n}`);
  },
  stats: () => go("stats"),
  onboardTest: () => { S.settings.name = ($("#ob-name").value || "").trim().slice(0, 30); S.settings.gender = $("#ob-g").value; S.onboarded = true; save(); go("plcIntro"); },
  hday: el => toast(el.dataset.v),
  review: startReview,
  errors: startErrors,
  unit: el => { closeSheet(); go("unit", {id:el.dataset.v}); },
  ustep: el => { const u = UNITS.find(x => x.id === el.dataset.v); startUnitStep(u, el.dataset.k); },
  theoryDone: el => { const u = UNITS.find(x => x.id === el.dataset.v); markStep(u, "theory"); VIEW = STACK.pop() || {name:"unit", id:u.id}; startGrammar(u.tid, false, u); },
  vseg: el => { VIEW = {name:"vocab", seg:el.dataset.v}; render(); },
  deck: el => go("deck", {id:el.dataset.v}),
  block: el => go("block", {id:el.dataset.v}),
  study: el => startStudy(el.dataset.kind, el.dataset.v, el.dataset.m),
  addCustom: () => { const it = $("#cu-it").value.trim(), es = $("#cu-es").value.trim(); if (!it || !es) return toast("Escribe la palabra y su traducción"); S.custom.push({it, es}); save(); render(); toast("Tarjeta añadida"); },
  delCustom: el => {
    const i = +el.dataset.v;
    const re = {}; for (const [k, v] of Object.entries(S.srs)) { if (!k.startsWith("u:")) { re[k] = v; continue; } const j = +k.slice(2); if (j < i) re[k] = v; else if (j > i) re["u:" + (j - 1)] = v; }
    S.srs = re; S.custom.splice(i, 1); save(); render();
  },
  topic: el => go("topic", {id:el.dataset.v}),
  gpractice: el => startGrammar(el.dataset.v, false),
  gtest: el => startGrammar(el.dataset.v, true),
  dialog: el => { if (VIEW.name === "dialog") STACK.length && (VIEW = STACK.pop()); openDialog(el.dataset.v, D && D.d.id === el.dataset.v ? D.unitId : null); },
  opt: el => chooseOption(+el.dataset.v),
  own: ownAnswer,
  toggleEs: () => { D.showEs = !D.showEs; render(); },
  dlgAddVocab: () => { let n = 0; D.d.vocab.concat(D.d.frasi).forEach(([it, es]) => { if (!S.custom.some(c => c.it === it)) { S.custom.push({it, es}); n++; } }); save(); toast(n ? `${n} tarjetas añadidas a «Mis tarjetas»` : "Ya estaban en tus tarjetas"); },
  lookup: el => {
    const w = el.dataset.w.replace(/&#39;/g, "'").replace(/[.,!?;:«»"()]/g, "").replace(/^'+|'+$/g, ""); const tr = lookup(w);
    const story = READ && VIEW.name === "story" ? STORIES.find(x => x.id === READ.id) : null;
    const sent = story && el.dataset.s != null ? story.s[+el.dataset.s] : null;
    LOOK = {w, ex:sent ? sent[0] : "", exEs:sent ? sent[1] : ""};
    const has = S.custom.some(c => norm(c.it) === norm(w));
    sheet(`<div class="between"><div class="row">${speakBtn(w, "icon-btn")}<h2 class="it" style="font-family:var(--f-it);font-stretch:100%">${esc(w)}</h2></div><button class="icon-btn" data-a="closeSheet" aria-label="Cerrar">${IC.close}</button></div>
      ${tr ? `<p style="font-size:1.15rem">${esc(tr)}</p>` : `<p class="muted">No está en el diccionario de la app (puede ser una forma conjugada).</p>`}
      ${sent ? `<p class="small muted it">«${esc(sent[0])}»</p>` : ""}
      ${has ? `<p class="chip ok" style="align-self:flex-start">Ya está en tus tarjetas</p>` : tr ? `<button class="btn primary" data-a="addLookup" data-quick="1">${IC.plus} Añadir a mis tarjetas</button>
        <details><summary class="small muted">Cambiar la traducción</summary><div class="field" style="margin-top:8px"><input id="lk-es" value="${esc(tr)}" aria-label="Traducción"></div></details>`
      : `<div class="field"><label for="lk-es">Traducción para tu tarjeta</label><input id="lk-es" value="" placeholder="Escribe la traducción"></div>
        ${SAMPLE ? `<button class="btn" data-a="askWord" data-w="${esc(w)}">Preguntar a Claude</button>` : ""}
        <button class="btn primary" data-a="addLookup">Añadir a mis tarjetas</button>`}`);
    say(w);
  },
  askWord: async el => {
    const w = el.dataset.w; const ctx = D ? D.log.filter(m => m.who === "npc").slice(-1)[0] : AI && AI.log.slice(-1)[0];
    el.disabled = true; el.textContent = "Preguntando…";
    try { const r = await SAMPLE(`Traduce al español la palabra italiana «${w}» tal y como se usa en esta frase: «${ctx ? ctx.it : w}». Responde solo con la traducción y, si es una forma verbal, el infinitivo entre paréntesis. Máximo 8 palabras.`, {modelTier:"quick"});
      const inp = $("#lk-es"); if (inp) inp.value = r.text.trim().slice(0, 80); el.remove(); }
    catch { el.textContent = "No disponible"; }
  },
  addLookup: () => {
    const es = (($("#lk-es") || {}).value || "").trim(); if (!es || !LOOK) return toast("Añade una traducción");
    const c = {it:LOOK.w, es}; if (LOOK.ex) { c.ex = LOOK.ex; c.exEs = LOOK.exEs; }
    S.custom.push(c); save(); closeSheet(); toast("Añadida a «Mis tarjetas»");
  },
  aiSetup: () => { AI = null; go("ai"); },
  aiSetupGoal: () => { AI = null; go("ai", {mode:"goal"}); },
  aiLastRep: () => go("aiReportView", {i:S.aiReports.length - 1}),
  aiSit: el => { $("#ai-s").value = el.dataset.v; },
  aiStart: () => {
    const p = PERSONAS.find(x => x.id === $("#ai-p").value); const sit = ($("#ai-s").value || SITS[0]).trim(); const lvl = $("#ai-l").value;
    AI = {started:true, p, sit, lvl, log:[], busy:false, showEs:false, sug:[]}; render(); aiTurn("");
  },
  aiSend: () => { const inp = $("#ai-in"); const v = (inp && inp.value || "").trim(); if (!v || AI.busy) return; aiTurn(v); },
  aiSug: el => { const inp = $("#ai-in"); if (inp) { inp.value = el.dataset.v; inp.focus(); } },
  toggleAiEs: () => { AI.showEs = !AI.showEs; render(); },
  // sesión
  next: () => { if (SES) nextQ(); },
  check: () => checkCurrent(false),
  skip: () => checkCurrent(true),
  quit: () => { SES.quitArm = !SES.quitArm; render(); },
  quitYes: () => { const s = SES; for (const [gk, arr] of Object.entries(s.gk)) { if (S.srs[gk]) grade(gk, arr.reduce((a, b) => a + b, 0) / arr.length >= .7 ? 2 : 0); } if (s.xp) addXP(s.xp); save(); SES = null; back(); },
  mcPick: el => { const q = SES.qs[SES.i]; const i = +el.dataset.v; SES.state = {pick:i}; finishQ(q.opts[i] === q.key ? 1 : 0, esc(q.dir === "it-es" ? item(q.key).es : item(q.key).it), ""); },
  gmcPick: el => { const e = SES.qs[SES.i].ex; const i = +el.dataset.v; SES.state = {pick:i}; finishQ(i === e.a ? 1 : 0, esc(e.o[e.a]), e.x); },
  tokIn: el => { const st = SES.state || (SES.state = {}); st.sel.push(+el.dataset.v); render(); },
  tokOut: el => { SES.state.sel.splice(+el.dataset.v, 1); render(); },
  flipShow: () => { SES.state = {shown:true}; render(); },
  flipGrade: el => { const q = SES.qs[SES.i]; const g = +el.dataset.v; grade(q.key, g); if (!q.retry) logStat("flip", g >= 2 ? 1 : 0); if (g === 0) { SES.qs.push({type:"flip", key:q.key, retry:true}); } SES.xp += 1; saveLocal(); nextQ(); },
  resultDone: () => { const v = VIEW; VIEW = STACK.pop() || {name:"today"}; if (v.extra && v.extra.cta === "Ver el mapa") { STACK.length = 0; VIEW = {name:"route"}; MAPVB = null; } NAV = "back"; render(); window.scrollTo(0, 0); },
  // ajustes
  saveSettings: () => {
    const s = S.settings; s.name = $("#st-name").value.trim().slice(0, 30); s.gender = $("#st-g").value; s.newPerDay = +$("#st-new").value; s.goal = +$("#st-goal").value;
    s.rate = +$("#st-rate").value; s.autoSpeak = $("#st-auto").checked; s.unlockAll = $("#st-unlock").checked;
    s.sound = $("#st-sound").checked; s.textSize = +$("#st-size").value; s.theme = $("#st-theme").value;
    applyPrefs(); save(); closeSheet(); render(); toast("Ajustes guardados");
  },
  exportState: async () => { const t = JSON.stringify(S); try { await navigator.clipboard.writeText(t); toast("Progreso copiado al portapapeles"); } catch { $("#imp").hidden = false; const ta = $("#imp-t"); ta.value = t; ta.select(); toast("Selecciona y copia el texto"); } },
  importOpen: () => { $("#imp").hidden = false; $("#imp-t").focus(); },
  importDo: () => { try { const s = JSON.parse($("#imp-t").value); if (!s || !s.srs) throw 0; S = migrate(s); applyPrefs(); save(); closeSheet(); render(); toast("Progreso importado"); } catch { toast("El texto no es un progreso válido"); } },
  resetArm: el => { if (el.dataset.armed) { S = fresh(); save(); closeSheet(); tab("today"); toast("Progreso borrado"); } else { el.dataset.armed = "1"; el.textContent = "Toca otra vez para confirmar"; el.style.color = "var(--bad)"; } },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  if (el.classList.contains("scrim") && e.target !== el) return;
  const fn = A[el.dataset.a]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.shiftKey) return;
  const t = e.target;
  if (t.dataset && t.dataset.enter) { e.preventDefault(); const fn = A[t.dataset.enter] || (t.dataset.enter === "check" ? A.check : null); fn && fn(t); return; }
  if (VIEW.name === "session" && SES && SES.state && SES.state.done) { e.preventDefault(); nextQ(); }
  if (VIEW.name === "session" && SES && t.tagName === "TEXTAREA") { e.preventDefault(); A.check(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "dy-t") { S.diaryDraft = e.target.value.slice(0, 2000); const n = $("#dy-n"); if (n) n.textContent = S.diaryDraft.trim().split(/\s+/).filter(Boolean).length + " palabras"; clearTimeout(A.dT); A.dT = setTimeout(saveLocal, 800); return; }
  if (e.target.id === "wsearch") { VIEW.q = e.target.value; const pos = e.target.selectionStart; render(); const s = $("#wsearch"); s.focus(); try { s.setSelectionRange(pos, pos); } catch {} }
});

/* ---------- Arranque ---------- */
let THEME_SET = false;
function applyPrefs() {
  const r = document.documentElement; const s = S.settings;
  r.style.setProperty("--fs", s.textSize || 1);
  if (s.theme === "light" || s.theme === "dark") { r.dataset.theme = s.theme; THEME_SET = true; }
  else if (THEME_SET) { delete r.dataset.theme; THEME_SET = false; }
}
let rzT; window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (VIEW.name === "route" && $("#map")) mapApply(mapTarget()); }, 150); });
applyPrefs();
render();
initCapabilities();
if (window.__PWA__ && "serviceWorker" in navigator && location.protocol === "https:") {
  // Al llegar una versión nueva de la app, recarga sola (salvo en mitad de un ejercicio)
  const hadCtrl = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadCtrl && !reloaded && !SES) { reloaded = true; location.reload(); } });
  navigator.serviceWorker.register("sw.js").then(r => r.update()).catch(() => {});
}
</script>
