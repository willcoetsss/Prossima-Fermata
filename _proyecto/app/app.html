","lvl":"B2","title":"La riunione di condominio","who":"L'amministratore","role":"administrador de la finca","reg":"Lei","desc":"En la junta de vecinos se discute quién paga la reparación del ascensor.","nodes":{"n1":{"it":"Passiamo al secondo punto: l'ascensore. Il preventivo è di dodicimila euro. Qualcuno vuole intervenire?","es":"Pasamos al segundo punto: el ascensor. El presupuesto es de doce mil euros. ¿Alguien quiere intervenir?","o":[{"it":"Sì, vorrei chiedere se sono stati richiesti altri preventivi.","es":"Sí, querría preguntar si se han pedido otros presupuestos.","next":"n2"},{"it":"Io vorrei capire come verrebbe divisa la spesa tra i condomini.","es":"Yo querría entender cómo se repartiría el gasto entre los vecinos.","next":"n3"}]},"n2":{"it":"Ne abbiamo chiesti tre: questo è il più economico, anche se la ditta è un po' lenta.","es":"Hemos pedido tres: este es el más barato, aunque la empresa es un poco lenta.","o":[{"it":"Sarebbe utile vedere anche gli altri due prima di votare, così decidiamo con cognizione di causa.","es":"Sería útil ver también los otros dos antes de votar, así decidimos con conocimiento de causa.","next":"n3"},{"it":"Se è il più economico, per me va bene, purché i lavori finiscano entro l'estate.","es":"Si es el más barato, por mí bien, siempre que las obras terminen antes del verano.","next":"n3"}]},"n3":{"it":"La spesa si divide in base ai millesimi e al piano: chi abita più in alto paga di più.","es":"El gasto se reparte según la cuota de participación y la planta: quien vive más arriba paga más.","o":[{"it":"Mi sembra giusto, anche se io abito al quinto piano e mi tocca la quota più alta.","es":"Me parece justo, aunque yo vivo en el quinto y me toca la cuota más alta.","next":"n4"},{"it":"Capisco, ma i negozi al piano terra non pagano niente? Anche loro usano l'ascensore per il magazzino.","es":"Entiendo, pero ¿los locales de la planta baja no pagan nada? Ellos también usan el ascensor para el almacén.","next":"n4"},{"it":"Non sono d'accordo, è ingiusto che io pago così tanto.","es":"(No estoy de acuerdo, es injusto que yo «pago» tanto.)","bad":"Tras «è ingiusto che» va subjuntivo: «è ingiusto che io paghi così tanto»."}]},"n4":{"it":"La signora Galli del terzo piano dice che lei l'ascensore non lo usa mai e non vuole pagare.","es":"La señora Galli, del tercero, dice que ella nunca usa el ascensor y no quiere pagar.","o":[{"it":"Capisco il suo punto di vista, però l'ascensore aumenta il valore di tutti gli appartamenti, anche del suo.","es":"Entiendo su punto de vista, pero el ascensor aumenta el valor de todos los pisos, también del suyo.","next":"n5"},{"it":"Purtroppo la legge è chiara: le spese comuni le pagano tutti, che usino l'ascensore o no.","es":"Por desgracia la ley es clara: los gastos comunes los pagan todos, usen el ascensor o no.","next":"n5"}]},"n5":{"it":"Bene, mettiamo ai voti. Chi è favorevole al preventivo?","es":"Bien, lo sometemos a votación. ¿Quién está a favor del presupuesto?","o":[{"it":"Io sono favorevole, a condizione che si possa pagare in tre rate.","es":"Yo estoy a favor, con la condición de que se pueda pagar en tres plazos.","next":"n6"},{"it":"Mi astengo finché non avremo visto gli altri preventivi.","es":"Me abstengo hasta que hayamos visto los otros presupuestos.","next":"n6"}]},"n6":{"it":"Perfetto, metto a verbale. La delibera passa a maggioranza, con pagamento in tre rate. Passiamo al punto successivo.","es":"Perfecto, lo hago constar en el acta. El acuerdo se aprueba por mayoría, con pago en tres plazos. Pasamos al punto siguiente.","o":[]}},"vocab":[["il condominio","la comunidad de vecinos"],["l'amministratore","el administrador de fincas"],["il preventivo","el presupuesto"],["i millesimi","la cuota de participación"],["la rata","el plazo (de pago)"],["astenersi","abstenerse"],["il verbale","el acta"],["la delibera","el acuerdo / la resolución"]],"frasi":[["Vorrei intervenire.","Querría intervenir."],["Con cognizione di causa.","Con conocimiento de causa."],["Capisco il suo punto di vista, però...","Entiendo su punto de vista, pero..."],["Mettiamo ai voti.","Lo sometemos a votación."]],"start":"n1"},{"id":"stipendio","lvl":"B2","title":"Chiedere un aumento","who":"Il dottor Riva","role":"tu jefe","reg":"Lei","desc":"Llevas dos años en la empresa y pides una reunión con tu jefe para hablar de tu sueldo.","nodes":{"n1":{"it":"Prego, si sieda. Mi ha chiesto un colloquio: di cosa voleva parlarmi?","es":"Adelante, siéntese. Me ha pedido una reunión: ¿de qué quería hablarme?","o":[{"it":"Grazie per avermi ricevut{o}. Vorrei parlare della mia posizione e della mia retribuzione.","es":"Gracias por recibirme. Querría hablar de mi puesto y de mi retribución.","next":"n2"},{"it":"La ringrazio. Lavoro qui da due anni e vorrei fare il punto sul mio percorso.","es":"Se lo agradezco. Llevo dos años aquí y querría hacer balance de mi trayectoria.","next":"n2"},{"it":"Voglio più soldi, perché lavoro molto.","es":"(Quiero más dinero, porque trabajo mucho.)","bad":"Demasiado directo. Mejor presentarlo con argumentos y en condicional: «Vorrei parlare della mia retribuzione»."}]},"n2":{"it":"Certo. Mi dica pure.","es":"Claro. Usted dirá.","o":[{"it":"Nell'ultimo anno ho seguito tre progetti importanti e il cliente tedesco ha rinnovato il contratto anche grazie al mio lavoro.","es":"En el último año he llevado tres proyectos importantes y el cliente alemán ha renovado el contrato también gracias a mi trabajo.","next":"n3"},{"it":"Da quando è andato via Marini, mi occupo anche del suo team, ma il mio stipendio è rimasto lo stesso.","es":"Desde que se fue Marini, me encargo también de su equipo, pero mi sueldo sigue siendo el mismo.","next":"n3"}]},"n3":{"it":"Riconosco il suo impegno. Però, come sa, quest'anno il budget è molto limitato.","es":"Reconozco su esfuerzo. Pero, como sabe, este año el presupuesto es muy limitado.","o":[{"it":"Lo capisco. Tuttavia ritengo che un adeguamento del dieci per cento sia in linea con il mercato.","es":"Lo entiendo. Sin embargo, considero que un ajuste del diez por ciento está en línea con el mercado.","next":"n4"},{"it":"Capisco, ma ho ricevuto un'offerta da un'altra azienda e preferirei restare qui, se ci fossero le condizioni.","es":"Entiendo, pero he recibido una oferta de otra empresa y preferiría quedarme aquí, si se dieran las condiciones.","next":"n4"},{"it":"Capisco, però penso che merito un aumento.","es":"(Entiendo, pero creo que «merezco» un aumento.)","bad":"Tras «penso che» va subjuntivo: «penso di meritare» o «penso che mi spetti un aumento»."}]},"n4":{"it":"Il dieci per cento adesso è impossibile. Potrei proporle un cinque per cento subito e una revisione a giugno.","es":"El diez por ciento ahora es imposible. Podría proponerle un cinco por ciento ya y una revisión en junio.","o":[{"it":"Potrebbe andare, a patto che la revisione di giugno sia messa per iscritto.","es":"Podría valer, con la condición de que la revisión de junio se ponga por escrito.","next":"n5"},{"it":"Apprezzo la proposta. Sarebbe possibile aggiungere un giorno di smart working a settimana?","es":"Valoro la propuesta. ¿Sería posible añadir un día de teletrabajo a la semana?","next":"n5"}]},"n5":{"it":"Mi sembra ragionevole. Ne parlo con le risorse umane e le faccio avere una proposta scritta entro venerdì.","es":"Me parece razonable. Lo hablo con recursos humanos y le hago llegar una propuesta por escrito antes del viernes.","o":[{"it":"La ringrazio molto. Sono convint{o} che possiamo crescere ancora insieme.","es":"Se lo agradezco mucho. Estoy convencido/a de que todavía podemos crecer juntos.","next":"n6"},{"it":"Perfetto, resto in attesa. Grazie per la disponibilità.","es":"Perfecto, quedo a la espera. Gracias por su disponibilidad.","next":"n6"}]},"n6":{"it":"Grazie a lei. Apprezzo chi sa farsi valere con educazione.","es":"Gracias a usted. Valoro a quien sabe hacerse valer con educación.","o":[]}},"vocab":[["la retribuzione","la retribución"],["l'aumento","el aumento"],["l'impegno","el esfuerzo / el compromiso"],["l'adeguamento","el ajuste"],["mettere per iscritto","poner por escrito"],["lo smart working","el teletrabajo"],["le risorse umane","recursos humanos"],["farsi valere","hacerse valer"]],"frasi":[["Vorrei fare il punto su...","Querría hacer balance de..."],["Ritengo che... sia...","Considero que... es..."],["A patto che...","Con la condición de que..."],["Resto in attesa.","Quedo a la espera."]],"start":"n1"},{"id":"assistenza","lvl":"B2","title":"Il servizio clienti","who":"Operatrice","role":"atención al cliente","reg":"Lei","desc":"Llevas tres semanas sin internet y llamas por tercera vez a tu compañía.","nodes":{"n1":{"it":"Buongiorno, sono Chiara. In che cosa posso esserle utile?","es":"Buenos días, soy Chiara. ¿En qué puedo ayudarle?","o":[{"it":"Buongiorno. È la terza volta che chiamo: sono senza connessione da tre settimane.","es":"Buenos días. Es la tercera vez que llamo: llevo tres semanas sin conexión.","next":"n2"},{"it":"Buongiorno, Chiara. Ho un guasto alla linea che nessuno ha ancora risolto.","es":"Buenos días, Chiara. Tengo una avería en la línea que nadie ha resuelto todavía.","next":"n2"}]},"n2":{"it":"Mi dispiace molto. Mi può dare il codice cliente?","es":"Lo siento mucho. ¿Me puede dar el código de cliente?","o":[{"it":"Sì, è il 4471-2290. Mi avevano detto che un tecnico sarebbe passato lunedì, ma non è venuto nessuno.","es":"Sí, es el 4471-2290. Me habían dicho que un técnico pasaría el lunes, pero no vino nadie.","next":"n3"},{"it":"Eccolo: 4471-2290. Lavoro da casa, quindi per me è un problema serio.","es":"Aquí tiene: 4471-2290. Trabajo desde casa, así que para mí es un problema serio.","next":"n3"}]},"n3":{"it":"Vedo la segnalazione. Risulta che il tecnico non ha trovato nessuno in casa.","es":"Veo el aviso. Consta que el técnico no encontró a nadie en casa.","o":[{"it":"Non è possibile: sono stat{o} in casa tutto il giorno e nessuno ha suonato.","es":"No es posible: estuve en casa todo el día y nadie llamó al timbre.","next":"n4"},{"it":"Mi sembra strano. Se fosse passato, avrebbe almeno potuto lasciare un avviso.","es":"Me parece raro. Si hubiera pasado, al menos podría haber dejado un aviso.","next":"n4"},{"it":"Non è vero! Se il tecnico sarebbe venuto, l'avrei visto.","es":"(¡No es verdad! Si el técnico «habría venido», lo habría visto.)","bad":"Periodo hipotético del pasado: «se il tecnico fosse venuto, l'avrei visto»."}]},"n4":{"it":"Ha ragione, mi scuso a nome dell'azienda. Posso fissare un nuovo intervento per giovedì, dalle otto alle tredici.","es":"Tiene razón, le pido disculpas en nombre de la empresa. Puedo programar una nueva intervención para el jueves, de ocho a una.","o":[{"it":"Va bene giovedì, ma vorrei che il tecnico mi chiamasse mezz'ora prima.","es":"El jueves me va bien, pero me gustaría que el técnico me llamara media hora antes.","next":"n5"},{"it":"D'accordo. E per le tre settimane senza servizio è previsto un indennizzo?","es":"De acuerdo. ¿Y por las tres semanas sin servicio está prevista una indemnización?","next":"n5"}]},"n5":{"it":"Certamente. Le applico uno sconto pari a un mese di canone sulla prossima bolletta, e il tecnico la avviserà prima di arrivare.","es":"Por supuesto. Le aplico un descuento equivalente a un mes de cuota en la próxima factura, y el técnico le avisará antes de llegar.","o":[{"it":"La ringrazio, è la prima persona che mi dà una risposta concreta.","es":"Se lo agradezco, es la primera persona que me da una respuesta concreta.","next":"n6"},{"it":"Bene. Mi può mandare una conferma scritta per email, per sicurezza?","es":"Bien. ¿Me puede enviar una confirmación por escrito por correo, por si acaso?","next":"n6"}]},"n6":{"it":"Senz'altro, le arriverà tra pochi minuti. Le auguro una buona giornata e mi scusi ancora.","es":"Por supuesto, le llegará dentro de unos minutos. Que tenga un buen día y discúlpenos otra vez.","o":[]}},"vocab":[["il guasto","la avería"],["la segnalazione","el aviso / la incidencia"],["l'intervento","la intervención / la visita técnica"],["l'indennizzo","la indemnización"],["il canone","la cuota mensual"],["la bolletta","la factura (luz, gas, teléfono)"],["senz'altro","por supuesto"]],"frasi":[["È la terza volta che chiamo.","Es la tercera vez que llamo."],["Risulta che...","Consta que..."],["Vorrei che mi chiamasse...","Me gustaría que me llamara..."],["Per sicurezza.","Por si acaso."]],"start":"n1"},{"id":"suoceri","lvl":"B2","title":"A cena dai suoceri","who":"La signora Lucia","role":"la madre de tu pareja","reg":"Lei","desc":"Cenas por primera vez en casa de los padres de tu pareja, en Nápoles.","nodes":{"n1":{"it":"Benvenut{o}! Accomodati... anzi, si accomodi! Scusi, non so se darle del tu o del lei.","es":"¡Bienvenido/a! Ponte cómodo... ¡digo, póngase cómodo! Perdone, no sé si tratarle de tú o de usted.","o":[{"it":"Mi dia pure del tu, signora, mi farebbe piacere.","es":"Puede tutearme, señora, me gustaría.","next":"n2"},{"it":"Grazie, signora. Ho portato una bottiglia di vino e dei fiori per lei.","es":"Gracias, señora. He traído una botella de vino y unas flores para usted.","next":"n2"}]},"n2":{"it":"Che pensiero gentile! Allora, ti piace la cucina napoletana? Ho fatto la genovese.","es":"¡Qué detalle tan amable! Bueno, ¿te gusta la cocina napolitana? He hecho genovese.","o":[{"it":"La adoro! Ma la genovese non è di Genova?","es":"¡Me encanta! Pero la genovese, ¿no es de Génova?","next":"n3"},{"it":"Moltissimo. Mi hanno detto che la sua genovese è leggendaria.","es":"Muchísimo. Me han dicho que su genovese es legendaria.","next":"n3"}]},"n3":{"it":"Eh no, è napoletanissima: pasta con un sugo di cipolle e carne che cuoce per ore. Assaggia e poi mi dici.","es":"Ah no, es napolitanísima: pasta con una salsa de cebollas y carne que se cuece durante horas. Prueba y luego me dices.","o":[{"it":"È squisita! Non avevo mai mangiato niente del genere.","es":"¡Está exquisita! Nunca había comido nada parecido.","next":"n4"},{"it":"Buonissima! Me ne "Medicina","Italiano"],"a":0},{"q":"Perché Ana suona alla porta di Marco?","o":["Perché cerca una camera","Perché non ha il sale","Perché vuole un caffè"],"a":1}]},{"id":"s3","lvl":"A1","title":"Sabato al mercato","es":"Sábado en el mercado","s":[["Ogni sabato mattina Giulia va al mercato con sua nonna.","Cada sábado por la mañana Giulia va al mercado con su abuela."],["Il mercato è in piazza ed è pieno di colori.","El mercado está en la plaza y está lleno de colores."],["La nonna conosce tutti i venditori.","La abuela conoce a todos los vendedores."],["«Buongiorno, signora Pina! Cosa le do oggi?»","«¡Buenos días, señora Pina! ¿Qué le pongo hoy?»"],["«Un chilo di pomodori e mezzo chilo di zucchine, per favore.»","«Un kilo de tomates y medio kilo de calabacines, por favor.»"],["«Sono belli i pomodori, sono di Pachino.»","«Los tomates son buenos, son de Pachino.»"],["Giulia vuole anche le fragole, ma sono care.","Giulia también quiere fresas, pero son caras."],["Il venditore sorride e regala una fragola a Giulia.","El vendedor sonríe y le regala una fresa a Giulia."],["Alla fine la nonna compra anche il formaggio e il pane.","Al final la abuela también compra queso y pan."],["Le borse sono pesanti, ma Giulia è contenta.","Las bolsas pesan, pero Giulia está contenta."]],"g":{"le do":"le doy / le pongo","zucchine":"calabacines","fragole":"fresas","fragola":"fresa","regala":"regala (regalare)","pesanti":"pesadas","venditori":"vendedores","venditore":"vendedor"},"q":[{"q":"Con chi va al mercato Giulia?","o":["Con sua madre","Con sua nonna","Da sola"],"a":1},{"q":"Quanti pomodori compra la nonna?","o":["Mezzo chilo","Due chili","Un chilo"],"a":2},{"q":"Perché Giulia è contenta alla fine?","o":["Il venditore le regala una fragola","Il mercato è chiuso","Le borse sono leggere"],"a":0}]},{"id":"s4","lvl":"A1","title":"Un giorno a Milano","es":"Un día en Milán","s":[["Pablo è in vacanza a Milano per tre giorni.","Pablo está de vacaciones en Milán tres días."],["Il suo albergo è vicino alla Stazione Centrale.","Su hotel está cerca de la Estación Central."],["La mattina prende la metropolitana, la linea gialla.","Por la mañana coge el metro, la línea amarilla."],["Scende alla fermata Duomo ed esce in piazza.","Se baja en la parada Duomo y sale a la plaza."],["Il Duomo è bianco, enorme e bellissimo.","El Duomo es blanco, enorme y precioso."],["Pablo fa molte foto e poi sale sulla terrazza.","Pablo hace muchas fotos y luego sube a la terraza."],["Da lassù vede tutta la città e, lontano, le montagne.","Desde allí arriba ve toda la ciudad y, a lo lejos, las montañas."],["A pranzo mangia un panino in Galleria, ma è carissimo.","Para comer se toma un bocadillo en la Galería, pero es carísimo."],["La sera cammina sui Navigli e beve uno spritz con degli amici.","Por la noche pasea por los Navigli y se toma un spritz con unos amigos."],["«Milano è più bella di quello che pensavo!», scrive a sua madre.","«¡Milán es más bonita de lo que pensaba!», le escribe a su madre."]],"g":{"scende":"se baja (scendere)","sale":"sube (salire)","lassù":"allí arriba","vede":"ve (vedere)","cammina":"camina / pasea","pensavo":"pensaba","scrive":"escribe (scrivere)","Navigli":"canales de Milán"},"q":[{"q":"Dov'è l'albergo di Pablo?","o":["Vicino al Duomo","Vicino alla Stazione Centrale","Sui Navigli"],"a":1},{"q":"Che cosa vede Pablo dalla terrazza?","o":["Il mare","La città e le montagne","Lo stadio"],"a":1},{"q":"Com'è il panino in Galleria?","o":["Molto caro","Gratis","Economico"],"a":0}]},{"id":"s5","lvl":"A2","title":"Il weekend al lago","es":"El fin de semana en el lago","s":[["Venerdì sera Chiara e Luca sono partiti per il lago di Garda.","El viernes por la noche Chiara y Luca se fueron al lago de Garda."],["Hanno preso il treno da Milano e sono arrivati a Desenzano in un'ora.","Cogieron el tren desde Milán y llegaron a Desenzano en una hora."],["Sabato mattina si sono svegliati presto e hanno fatto colazione in terrazza.","El sábado por la mañana se despertaron temprano y desayunaron en la terraza."],["Poi hanno noleggiato due biciclette e hanno fatto il giro del lago.","Luego alquilaron dos bicicletas y dieron la vuelta al lago."],["A pranzo si sono fermati in una trattoria e hanno mangiato il pesce di lago.","A mediodía pararon en una trattoria y comieron pescado del lago."],["Il pomeriggio, purtroppo, è cominciato a piovere.","Por la tarde, por desgracia, empezó a llover."],["Sono tornati in albergo completamente bagnati, ma ridevano come due bambini.","Volvieron al hotel completamente empapados, pero se reían como dos niños."],["Domenica il tempo è stato perfetto: hanno preso il battello fino a Sirmione.","El domingo hizo un tiempo perfecto: cogieron el barco hasta Sirmione."],["Hanno visitato il castello e hanno mangiato un gelato enorme.","Visitaron el castillo y se comieron un helado enorme."],["La sera sono rientrati a Milano stanchi ma felici.","Por la noche volvieron a Milán cansados pero felices."]],"g":{"partiti":"se fueron (partire)","preso":"cogido (prendere)","noleggiato":"alquilado","fermati":"parado (fermarsi)","bagnati":"mojados / empapados","ridevano":"se reían","battello":"barco (de lago)","rientrati":"vuelto (rientrare)"},"q":[{"q":"Come sono arrivati al lago Chiara e Luca?","o":["In macchina","In treno","In aereo"],"a":1},{"q":"Che cosa è successo sabato pomeriggio?","o":["È cominciato a piovere","Hanno perso il treno","Hanno visitato Sirmione"],"a":0},{"q":"Dove sono andati domenica?","o":["A Venezia","A Sirmione","A Verona"],"a":1},{"q":"Come si sentivano la domenica sera?","o":["Arrabbiati","Annoiati","Stanchi ma felici"],"a":2}]},{"id":"s6","lvl":"A2","title":"Quando ero bambino","es":"Cuando era niño","s":[["Quando ero bambino, passavo tutte le estati dai nonni in Puglia.","Cuando era niño, pasaba todos los veranos en casa de mis abuelos en Apulia."],["La loro casa era bianca, piccola e vicinissima al mare.","Su casa era blanca, pequeña y muy cerca del mar."],["Ogni mattina il nonno mi svegliava alle sette per andare a pescare.","Cada mañana el abuelo me despertaba a las siete para ir a pescar."],["Io non prendevo mai niente, ma ero felicissimo.","Yo nunca pescaba nada, pero era felicísimo."],["La nonna invece preparava le orecchiette a mano, sul tavolo della cucina.","La abuela, en cambio, preparaba las orecchiette a mano, en la mesa de la cocina."],["Io la aiutavo, ma le mie orecchiette erano tutte storte.","Yo la ayudaba, pero mis orecchiette salían todas torcidas."],["Il pomeriggio faceva troppo caldo e tutti dormivano.","Por la tarde hacía demasiado calor y todo el mundo dormía."],["La sera, invece, il paese si riempiva di gente.","Por la noche, en cambio, el pueblo se llenaba de gente."],["Gli anziani giocavano a carte in piazza e i bambini correvano dappertutto.","Los mayores jugaban a las cartas en la plaza y los niños corrían por todas partes."],["Oggi i nonni non ci sono più, ma quando sento l'odore del mare penso sempre a loro.","Hoy los abuelos ya no están, pero cuando huelo el mar siempre pienso en ellos."]],"g":{"ero":"era (essere)","passavo":"pasaba","svegliava":"despertaba","pescare":"pescar","prendevo":"cogía / pescaba","preparava":"preparaba","aiutavo":"ayudaba","storte":"torcidas","faceva":"hacía","dormivano":"dormían","si riempiva":"se llenaba","anziani":"mayores / ancianos","correvano":"corrían","dappertutto":"por todas partes"},"q":[{"q":"Dove passava l'estate il narratore?","o":["In montagna","Dai nonni in Puglia","A Milano"],"a":1},{"q":"Che cosa faceva con il nonno?","o":["Andava a pescare","Giocava a carte","Cucinava"],"a":0},{"q":"Com'erano le orecchiette del bambino?","o":["Perfette","Storte","Troppo grandi"],"a":1},{"q":"Che cosa succedeva la sera in paese?","o":["Tutti dormivano","Il paese era vuoto","Il paese si riempiva di gente"],"a":2}]},{"id":"s7","lvl":"A2","title":"Sciopero!","es":"¡Huelga!","s":[["Martedì mattina Sofia doveva prendere il treno per Firenze alle nove.","El martes por la mañana Sofia tenía que coger el tren a Florencia a las nueve."],["Aveva un appuntamento importante con un cliente.","Tenía una cita importante con un cliente."],["Quando è arrivata in stazione, però, ha visto il tabellone: «Cancellato».","Pero cuando llegó a la estación, vio el panel: «Cancelado»."],["C'era uno sciopero dei treni di ventiquattro ore.","Había una huelga de trenes de veinticuatro horas."],["Sofia ha chiesto informazioni a un ferroviere.","Sofia pidió información a un empleado del ferrocarril."],["«Mi dispiace, signora, oggi partono solo i treni garantiti.»","«Lo siento, señora, hoy solo salen los trenes de servicios mínimos.»"],["Allora ha chiamato il cliente per spostare l'appuntamento.","Entonces llamó al cliente para cambiar la cita."],["Il cliente è stato gentilissimo: «Non si preoccupi, facciamo una videochiamata.»","El cliente fue amabilísimo: «No se preocupe, hagamos una videollamada.»"],["Sofia è entrata in un bar, ha ordinato un caffè e ha acceso il computer.","Sofia entró en un bar, pidió un café y encendió el ordenador."],["Alla fine la riunione è andata benissimo, anche senza treno.","Al final la reunión salió muy bien, incluso sin tren."]],"g":{"doveva":"tenía que","aveva":"tenía","arrivata":"llegado (arrivare)","tabellone":"panel de horarios","cancellato":"cancelado","sciopero":"huelga","ferroviere":"empleado del ferrocarril","garantiti":"garantizados (servicios mínimos)","spostare":"aplazar / cambiar de hora","acceso":"encendido (accendere)","andata":"ido (andare)"},"q":[{"q":"Perché Sofia non ha preso il treno?","o":["Si è svegliata tardi","C'era uno sciopero","Ha perso il biglietto"],"a":1},{"q":"Che cosa ha proposto il cliente?","o":["Una videochiamata","Un altro giorno","Una cena"],"a":0},{"q":"Come è andata la riunione?","o":["Male","Non c'è stata","Benissimo"],"a":2}]},{"id":"s8","lvl":"A2","title":"La cena di compleanno","es":"La cena de cumpleaños","s":[["Sabato era il compleanno di Elena e i suoi amici hanno organizzato una sorpresa.","El sábado era el cumpleaños de Elena y sus amigos organizaron una sorpresa."],["Hanno prenotato un tavolo per dodici in una pizzeria napoletana.","Reservaron una mesa para doce en una pizzería napolitana."],["Il ragazzo di Elena le ha detto: «Andiamo a cena da soli, solo io e te.»","El novio de Elena le dijo: «Vamos a cenar solos, solo tú y yo.»"],["Quando sono entrati, tutti hanno gridato: «Sorpresa!»","Cuando entraron, todos gritaron: «¡Sorpresa!»"],["Elena si è emozionata e ha quasi pianto.","Elena se emocionó y casi lloró."],["Hanno ordinato pizze, fritti e tanta birra.","Pidieron pizzas, fritos y mucha cerveza."],["Alla fine il cameriere ha portato una torta con trenta candeline.","Al final el camarero trajo una tarta con treinta velitas."],["Tutti hanno cantato «Tanti auguri a te» e Elena ha spento le candeline in un colpo solo.","Todos cantaron «Cumpleaños feliz» y Elena apagó las velas de un soplido."],["Poi hanno diviso il conto: ventidue euro a testa.","Luego dividieron la cuenta: veintidós euros por cabeza."],["Elena non ha pagato niente, naturalmente: era la festeggiata!","Elena no pagó nada, naturalmente: ¡era la homenajeada!"]],"g":{"detto":"dicho (dire)","gridato":"gritado","emozionata":"emocionada","pianto":"llorado (piangere)","fritti":"fritos","candeline":"velitas","spento":"apagado (spegnere)","diviso":"dividido","a testa":"por cabeza","festeggiata":"la homenajeada"},"q":[{"q":"Dove hanno festeggiato il compleanno?","o":["A casa di Elena","In una pizzeria","In un bar"],"a":1},{"q":"Quanti anni compie Elena?","o":["Venti","Venticinque","Trenta"],"a":2},{"q":"Quanto ha pagato Elena?","o":["Niente","Ventidue euro","Tutto il conto"],"a":0}]},{"id":"s9","lvl":"B1","title":"Una nuova vita a Bologna","es":"Una nueva vida en Bolonia","s":[["Quando Javier ha ricevuto l'offerta di lavoro a Bologna, non ci ha pensato due volte.","Cuando Javier recibió la oferta de trabajo en Bolonia, no se lo pensó dos veces."],["Il problema più grande è stato trovare casa: gli affitti erano altissimi e gli annunci sparivano in poche ore.","El mayor problema fue encontrar casa: los alquileres eran altísimos y los anuncios desaparecían en pocas horas."],["Dopo tre settimane in un ostello, ha trovato una stanza in un appartamento condiviso con due studenti.","Tras tres semanas en un albergue, encontró una habitación en un piso compartido con dos estudiantes."],["I primi giorni in ufficio sono stati faticosi, perché i colleghi parlavano velocissimo e usavano molte espressioni dialettali.","Los primeros días en la oficina fueron agotadores, porque los compañeros hablaban rapidísimo y usaban muchas expresiones dialectales."],["Javier annuiva e sorrideva, ma spesso non capiva quasi niente.","Javier asentía y sonreía, pero a menudo no entendía casi nada."],["Un giorno la sua collega Francesca gli ha proposto di fare uno scambio linguistico: un'ora di italiano e un'ora di spagnolo.","Un día su compañera Francesca le propuso hacer un intercambio de idiomas: una hora de italiano y una hora de español."],["Si vedevano il giovedì dopo il lavoro, in un'osteria sotto i portici.","Quedaban los jueves después del trabajo, en una osteria bajo los soportales."],["Grazie a quelle serate, Javier ha imparato non solo la lingua, ma anche le abitudini della città.","Gracias a esas tardes, Javier aprendió no solo el idioma, sino también las costumbres de la ciudad."],["Ha scoperto che a Bologna i tortellini si mangiano in brodo e che guai a chiamare «spaghetti alla bolognese» il ragù!","Descubrió que en Bolonia los tortellini se comen en caldo y que ¡ay de quien llame «espaguetis a la boloñesa» al ragú!"],["Dopo sei mesi, Javier si sente finalmente a casa.","Seis meses después, Javier se siente por fin en casa."]],"g":{"pensato":"pensado","sparivano":"desaparecían","ostello":"albergue","condiviso":"compartido","faticosi":"agotadores","dialettali":"dialectales","annuiva":"asentía","proposto":"propuesto (proporre)","scambio linguistico":"intercambio de idiomas","portici":"soportales","scoperto":"descubierto (scoprire)","guai a":"¡ay de...!","brodo":"caldo"},"q":[{"q":"Qual è stato il problema più grande per Javier?","o":["Imparare a guidare","Trovare casa","Trovare lavoro"],"a":1},{"q":"Perché i primi giorni in ufficio erano difficili?","o":["I colleghi parlavano veloce e in dialetto","Il capo era antipatico","Lavorava di notte"],"a":0},{"q":"Che cosa gli ha proposto Francesca?","o":["Un viaggio a Roma","Un nuovo lavoro","Uno scambio linguistico"],"a":2},{"q":"Come si mangiano i tortellini a Bologna, secondo il testo?","o":["Con il ragù","In brodo","Con la panna"],"a":1}]},{"id":"s10","lvl":"B1","title":"Il portafoglio","es":"La cartera","s":[["Era un lunedì qualunque e Marta stava tornando a casa in autobus.","Era un lunes cualquiera y Marta volvía a casa en autobús."],["Arrivata davanti al portone, si è accorta che non aveva più il portafoglio.","Al llegar delante del portal, se dio cuenta de que ya no tenía la cartera."],["Dentro c'erano i documenti, le carte di credito e duecento euro.","Dentro estaban los documentos, las tarjetas de crédito y doscientos euros."],["Ha subito bloccato le carte e poi è andata dai carabinieri a fare la denuncia.","Enseguida bloqueó las tarjetas y luego fue a los carabinieri a poner la denuncia."],["«Purtroppo succede spesso», le ha detto il maresciallo, «ma non perda la speranza.»","«Por desgracia pasa a menudo», le dijo el suboficial, «pero no pierda la esperanza.»"],["Due giorni dopo, ha ricevuto una telefonata da un numero sconosciuto.","Dos días después, recibió una llamada de un número desconocido."],["Era un signore anziano che aveva trovato il portafoglio sotto un sedile dell'autobus.","Era un señor mayor que había encontrado la cartera debajo de un asiento del autobús."],["Si sono dati appuntamento al bar della piazza: il signore le ha restituito tutto, anche i soldi.","Quedaron en el bar de la plaza: el señor se lo devolvió todo, incluso el dinero."],["Marta voleva dargli una ricompensa, ma lui ha rifiutato.","Marta quería darle una recompensa, pero él la rechazó."],["«Mi basta un caffè», ha detto sorridendo. «E la prossima volta stia più attenta!»","«Me basta con un café», dijo sonriendo. «¡Y la próxima vez tenga más cuidado!»"]],"g":{"qualunque":"cualquiera","portone":"portal","accorta":"dado cuenta (accorgersi)","bloccato":"bloqueado","denuncia":"denuncia","maresciallo":"suboficial (de carabinieri)","perda":"pierda (perdere, subj.)","sconosciuto":"desconocido","sedile":"asiento","restituito":"devuelto","ricompensa":"recompensa","stia":"esté (stare, usted)"},"q":[{"q":"Dove ha perso il portafoglio Marta?","o":["In un bar","Sull'autobus","In ufficio"],"a":1},{"q":"Che cosa ha fatto subito dopo?","o":["Ha bloccato le carte","Ha chiamato sua madre","È tornata sull'autobus"],"a":0},{"q":"Che cosa ha chiesto il signore come ricompensa?","o":["Cento euro","Niente, solo un caffè","Un regalo"],"a":1}]},{"id":"s11","lvl":"B1","title":"Il ragù della nonna","es":"El ragú de la abuela","s":[["Mia nonna diceva sempre che il ragù non si cucina: si aspetta.","Mi abuela siempre decía que el ragú no se cocina: se espera."],["La domenica si alzava alle sei per cominciare a prepararlo.","Los domingos se levantaba a las seis para empezar a prepararlo."],["Prima tritava la cipolla, la carota e il sedano, e li faceva soffriggere piano nell'olio.","Primero picaba la cebolla, la zanahoria y el apio, y los sofreía a fuego lento en aceite."],["Poi aggiungeva la carne e un bicchiere di vino rosso.","Luego añadía la carne y un vaso de vino tinto."],["«Non avere fretta», mi ripeteva, «e non mettere mai l'aglio, che copre tutto.»","«No tengas prisa», me repetía, «y no pongas nunca ajo, que lo tapa todo.»"],["Alla fine metteva la passata di pomodoro e lasciava cuocere il sugo per quattro ore.","Al final echaba el tomate triturado y dejaba cocer la salsa cuatro horas."],["Ogni tanto lo girava con un cucchiaio di legno e lo assaggiava.","De vez en cuando lo removía con una cuchara de madera y lo probaba."],["Io ho provato a rifarlo molte volte, ma secondo mia madre non è mai come quello della nonna.","Yo he intentado repetirlo muchas veces, pero según mi madre nunca es como el de la abuela."],["Forse manca un ingrediente segreto, o forse manca solo la pazienza.","Quizás falta un ingrediente secreto, o quizás solo falta la paciencia."],["Io penso che manchi lei, seduta in cucina a raccontare storie mentre il sugo borbotta.","Yo creo que falta ella, sentada en la cocina contando historias mientras la salsa borbotea."]],"g":{"tritava":"picaba","sedano":"apio","soffriggere":"sofreír","aggiungeva":"añadía","fretta":"prisa","copre":"tapa / cubre","passata":"tomate triturado","cuocere":"cocer","sugo":"salsa","girava":"removía","assaggiava":"probaba (comida)","rifarlo":"volver a hacerlo","manchi":"falte (mancare, subj.)","borbotta":"borbotea"},"q":[{"q":"Secondo la nonna, qual è il segreto del ragù?","o":["L'aglio","Il tempo e la pazienza","Il vino bianco"],"a":1},{"q":"Per quanto tempo cuoceva il sugo?","o":["Quattro ore","Un'ora","Tutta la notte"],"a":0},{"q":"Che cosa non metteva mai la nonna?","o":["La cipolla","Il vino","L'aglio"],"a":2},{"q":"Secondo il narratore, che cosa manca al suo ragù?","o":["Il sale","La nonna","La carne"],"a":1}]},{"id":"s12","lvl":"B1","title":"Lettera a Paolo","es":"Carta a Paolo","s":[["Caro Paolo, scusami se non ti ho scritto prima, ma sono stati mesi intensi.","Querido Paolo, perdona que no te haya escrito antes, pero han sido meses intensos."],["Come sai, a settembre ho cambiato lavoro: adesso lavoro per una casa editrice a Roma.","Como sabes, en septiembre cambié de trabajo: ahora trabajo para una editorial en Roma."],["Mi piace moltissimo, anche se guadagno meno e i ritmi sono pazzeschi.","Me gusta muchísimo, aunque gano menos y el ritmo es una locura."],["Roma è caotica, ma non riuscirei più a vivere da un'altra parte.","Roma es caótica, pero ya no sería capaz de vivir en otro sitio."],["Ti scrivo anche per farti una proposta: perché non vieni a trovarmi a Pasqua?","También te escribo para hacerte una propuesta: ¿por qué no vienes a verme en Semana Santa?"],["Potresti dormire da me: il divano è comodo, te lo giuro!","Podrías dormir en mi casa: el sofá es cómodo, ¡te lo juro!"],["Ti porterei a mangiare la carbonara in un posto che conoscono solo i romani.","Te llevaría a comer carbonara a un sitio que solo conocen los romanos."],["E poi vorrei presentarti Giorgia, la ragazza di cui ti ho parlato.","Y además me gustaría presentarte a Giorgia, la chica de la que te hablé."],["Fammi sapere entro la fine del mese, così prenoto il ristorante.","Dime algo antes de final de mes, así reservo el restaurante."],["Un abbraccio forte, e salutami tutti a Genova. Tuo, Davide.","Un abrazo fuerte, y saluda a todos en Génova de mi parte. Tuyo, Davide."]],"g":{"scusami":"perdóname","casa editrice":"editorial","guadagno":"gano (dinero)","pazzeschi":"de locos","riuscirei":"conseguiría / sería capaz","potresti":"podrías","giuro":"juro","porterei":"llevaría","vorrei":"me gustaría / querría","di cui":"de la que","fammi sapere":"dime algo / avísame","entro":"antes de / dentro de","salutami":"saluda de mi parte"},"q":[{"q":"Dove lavora adesso Davide?","o":["In una banca a Genova","In una casa editrice a Roma","In un ristorante"],"a":1},{"q":"Che cosa propone a Paolo?","o":["Di andare a trovarlo a Pasqua","Di lavorare con lui","Di trasferirsi a Roma"],"a":0},{"q":"Chi è Giorgia?","o":["Sua sorella","La sua capa","La ragazza di cui ha parlato"],"a":2}]},{"id":"s13","lvl":"B2","title":"La casa al mare","es":"La casa de la playa","s":[["Da anni i fratelli Ferri discutevano su cosa fare della vecchia casa al mare dei genitori.","Desde hacía años, los hermanos Ferri discutían sobre qué hacer con la vieja casa de la playa de sus padres."],["Roberto voleva venderla: «È inutile che la teniamo, se nessuno ci va mai.»","Roberto quería venderla: «No tiene sentido que la mantengamos si nadie va nunca.»"],["Anna, invece, sosteneva che fosse l'unico posto in cui si sentivano ancora una famiglia.","Anna, en cambio, sostenía que era el único lugar en el que todavía se sentían una familia."],["Ogni estate la discussione ricominciava, e ogni estate finiva senza una decisione.","Cada verano la discusión volvía a empezar, y cada verano terminaba sin una decisión."],["Finché un giorno arrivò una lettera del Comune: il tetto andava rifatto, e alla svelta.","Hasta que un día llegó una carta del ayuntamiento: había que rehacer el tejado, y deprisa."],["«Se avessimo deciso prima, avremmo risparmiato un sacco di soldi», si lamentò Roberto.","«Si lo hubiéramos decidido antes, habríamos ahorrado un montón de dinero», se quejó Roberto."],["Anna propose una soluzione: affittare la casa d'estate ai turisti e usare i guadagni per i lavori.","Anna propuso una solución: alquilar la casa en verano a los turistas y usar las ganancias para las obras."],["A patto che ognuno si occupasse di qualcosa, Roberto accettò di provarci per un anno.","Con la condición de que cada uno se encargara de algo, Roberto aceptó intentarlo durante un año."],["Contro ogni previsione, la casa fu prenotata per tutta l'estate.","Contra todo pronóstico, la casa se reservó para todo el verano."],["E a settembre, quando i turisti se ne furono andati, i due fratelli ci passarono un weekend insieme, come non succedeva da vent'anni.","Y en septiembre, cuando los turistas se hubieron marchado, los dos hermanos pasaron allí un fin de semana juntos, como no ocurría desde hacía veinte años."]],"g":{"teniamo":"mantengamos (subj.)","sosteneva":"sostenía","fosse":"fuera / era (essere, subj.)","finché":"hasta que","andava rifatto":"había que rehacerlo","alla svelta":"deprisa","avessimo deciso":"hubiéramos decidido","avremmo risparmiato":"habríamos ahorrado","un sacco di":"un montón de","propose":"propuso (proporre)","a patto che":"con la condición de que","occupasse":"encargara (subj.)","previsione":"pronóstico / previsión","fu":"fue (essere)","se ne furono andati":"se hubieron marchado"},"q":[{"q":"Perché Roberto voleva vendere la casa?","o":["Perché aveva bisogno di soldi","Perché nessuno ci andava mai","Perché era troppo lontana"],"a":1},{"q":"Che cosa diceva la lettera del Comune?","o":["Che bisognava rifare il tetto","Che la casa era stata venduta","Che c'erano nuove tasse"],"a":0},{"q":"Qual è stata la soluzione di Anna?","o":["Venderla subito","Viverci tutto l'anno","Affittarla ai turisti d'estate"],"a":2},{"q":"Che cosa è successo a settembre?","o":["Hanno venduto la casa","I fratelli ci hanno passato un weekend insieme","Hanno litigato di nuovo"],"a":1}]},{"id":"s14","lvl":"B2","title":"Un malinteso imbarazzante","es":"Un malentendido embarazoso","s":[["Il primo mese a Firenze, Lucía era convinta che l'italiano fosse facilissimo per uno spagnolo.","El primer mes en Florencia, Lucía estaba convencida de que el italiano era facilísimo para un español."],["Bastava, pensava, aggiungere una «o» qua e là e parlare con le mani.","Bastaba, pensaba, con añadir una «o» aquí y allá y hablar con las manos."],["La sua sicurezza crollò durante una cena a casa dei genitori del suo ragazzo.","Su seguridad se vino abajo durante una cena en casa de los padres de su novio."],["Dopo aver rovesciato un bicchiere d'acqua, disse ad alta voce: «Che vergogna, sono imbarazzata!»","Después de volcar un vaso de agua, dijo en voz alta: «¡Qué vergüenza, estoy embarazada!»"],["Calò un silenzio di tomba e la madre del ragazzo quasi svenne dalla gioia.","Se hizo un silencio sepulcral y la madre del chico casi se desmayó de alegría."],["Ci vollero dieci minuti buoni per spiegare che non aspettava nessun bambino, ma che si sentiva solo in imbarazzo.","Hicieron falta diez minutos largos para explicar que no esperaba ningún bebé, sino que solo se sentía avergonzada."],["Da quel giorno Lucía cominciò a tenere un quaderno di «falsi amici».","Desde aquel día Lucía empezó a llevar un cuaderno de «falsos amigos»."],["Ci scrisse che il «burro» non è un asino ma quello che si spalma sul pane, che «salire» vuol dire «subir» e non «salir», e che una «cantina» non è un bar ma il posto dove si tiene il vino.","Escribió en él que el «burro» no es un asno sino lo que se unta en el pan, que «salire» quiere decir «subir» y no «salir», y que una «cantina» no es un bar sino el sitio donde se guarda el vino."],["Oggi Lucía insegna spagnolo agli italiani e racconta sempre questa storia alla prima lezione.","Hoy Lucía enseña español a italianos y siempre cuenta esta historia en la primera clase."],["Dice che non c'è modo migliore per ricordare una parola che fare una figuraccia.","Dice que no hay mejor manera de recordar una palabra que hacer el ridículo."]],"g":{"convinta":"convencida","crollò":"se derrumbó","rovesciato":"volcado / derramado","imbarazzata":"avergonzada (¡falso amigo!)","calò":"cayó / se hizo","di tomba":"sepulcral","svenne":"se desmayó (svenire)","ci vollero":"hicieron falta","in imbarazzo":"avergonzada / incómoda","quaderno":"cuaderno","asino":"asno","figuraccia":"ridículo / mal papel","spalma":"se unta (spalmare)"},"q":[{"q":"Che cosa pensava Lucía dell'italiano all'inizio?","o":["Che fosse facilissimo","Che fosse impossibile","Che fosse come il francese"],"a":0},{"q":"Perché la madre del ragazzo era così felice?","o":["Perché Lucía aveva cucinato","Perché aveva capito che Lucía era incinta","Perché Lucía parlava benissimo"],"a":1},{"q":"Che significa «burro» in italiano?","o":["Asino","Mantequilla","Pane"],"a":1},{"q":"Che lavoro fa oggi Lucía?","o":["Traduttrice","Cuoca","Insegnante di spagnolo"],"a":2}]},{"id":"s15","lvl":"B2","title":"Restaurare il tempo","es":"Restaurar el tiempo","s":[["Abbiamo incontrato Silvia Morandi, restauratrice che da quindici anni lavora sugli affreschi delle chiese umbre.","Hemos conocido a Silvia Morandi, restauradora que lleva quince años trabajando en los frescos de las iglesias de Umbría."],["Ci ha spiegato che il suo mestiere richiede soprattutto umiltà.","Nos explicó que su oficio requiere sobre todo humildad."],["«Il restauratore non deve mai sostituirsi all'artista», ha detto. «Il nostro compito è far parlare l'opera, non noi stessi.»","«El restaurador nunca debe ocupar el lugar del artista», dijo. «Nuestra tarea es hacer hablar a la obra, no a nosotros mismos.»"],["Ha raccontato che, dopo il terremoto del 2016, aveva passato mesi a ricomporre frammenti grandi come un'unghia.","Contó que, después del terremoto de 2016, había pasado meses recomponiendo fragmentos del tamaño de una uña."],["Ci ha confessato che più di una volta aveva pensato di mollare tutto.","Nos confesó que más de una vez había pensado en dejarlo todo."],["Le abbiamo chiesto che cosa l'avesse convinta a continuare.","Le preguntamos qué la había convencido para seguir."],["Ha risposto che un giorno un'anziana del paese era entrata in chiesa e si era messa a piangere davanti al volto della Madonna, finalmente riconoscibile.","Respondió que un día una anciana del pueblo había entrado en la iglesia y se había echado a llorar delante del rostro de la Virgen, por fin reconocible."],["«In quel momento ho capito che non restauriamo solo dipinti, ma la memoria di una comunità.»","«En ese momento entendí que no restauramos solo pinturas, sino la memoria de una comunidad.»"],["Alla fine dell'intervista ci ha detto che sperava che i giovani si avvicinassero di più a questo lavoro.","Al final de la entrevista nos dijo que esperaba que los jóvenes se acercaran más a este trabajo."],["«Serve pazienza, certo, ma vi assicuro che non esiste soddisfazione più grande.»","«Hace falta paciencia, claro, pero os aseguro que no existe satisfacción más grande.»"]],"g":{"restauratrice":"restauradora","affreschi":"frescos","umbre":"de Umbría","umiltà":"humildad","sostituirsi":"ocupar el lugar de","opera":"obra","terremoto":"terremoto","ricomporre":"recomponer","unghia":"uña","mollare":"dejar / abandonar (coloquial)","avesse convinta":"hubiera convencido","volto":"rostro","dipinti":"pinturas","avvicinassero":"acercaran (subj.)","soddisfazione":"satisfacción"},"q":[{"q":"Secondo Silvia, che cosa richiede soprattutto il suo mestiere?","o":["Velocità","Umiltà","Creatività"],"a":1},{"q":"Che cosa è successo nel 2016?","o":["Un terremoto","Un incendio","Un'alluvione"],"a":0},{"q":"Che cosa l'ha convinta a continuare?","o":["Un aumento di stipendio","Un premio","La reazione di un'anziana del paese"],"a":2},{"q":"Che cosa sperava Silvia?","o":["Di andare in pensione","Che i giovani si avvicinassero a questo lavoro","Di lavorare all'estero"],"a":1}]},{"id":"s16","lvl":"B2","title":"Se non avessi perso quel treno","es":"Si no hubiera perdido aquel tren","s":[["Se dieci anni fa non avessi perso il treno delle 7.42 per Padova, oggi la mia vita sarebbe completamente diversa.","Si hace diez años no hubiera perdido el tren de las 7.42 a Padua, hoy mi vida sería completamente distinta."],["Quella mattina pioveva a dirotto e io ero arrivato in stazione di corsa, con l'ombrello rotto.","Aquella mañana llovía a cántaros y yo había llegado a la estación corriendo, con el paraguas roto."],["Vidi il treno partire proprio mentre scendevo le scale del sottopassaggio.","Vi salir el tren justo mientras bajaba las escaleras del paso subterráneo."],["Furioso, entrai nel bar della stazione e ordinai un caffè che non avevo nessuna voglia di bere.","Furioso, entré en el bar de la estación y pedí un café que no tenía ninguna gana de tomar."],["Accanto a me c'era una ragazza che rideva della mia faccia disperata.","A mi lado había una chica que se reía de mi cara de desesperación."],["«Se fossi in te, prenderei il regionale delle otto: arriva solo dieci minuti dopo», mi disse.","«Yo que tú cogería el regional de las ocho: llega solo diez minutos más tarde», me dijo."],["Prendemmo quel treno insieme e parlammo per tutto il viaggio.","Cogimos ese tren juntos y hablamos durante todo el viaje."],["Se il mio ombrello non si fosse rotto, sarei arrivato in tempo e non l'avrei mai conosciuta.","Si mi paraguas no se hubiera roto, habría llegado a tiempo y nunca la habría conocido."],["Oggi siamo sposati e abbiamo due figli, che hanno sentito questa storia mille volte.","Hoy estamos casados y tenemos dos hijos, que han oído esta historia mil veces."],["Ogni volta che un treno è in ritardo, mia moglie mi guarda e dice: «Chissà chi stai per conoscere.»","Cada vez que un tren va con retraso, mi mujer me mira y dice: «A saber a quién estás a punto de conocer.»"]],"g":{"avessi perso":"hubiera perdido","sarebbe":"sería","a dirotto":"a cántaros","di corsa":"corriendo","vidi":"vi (vedere, passato remoto)","sottopassaggio":"paso subterráneo","entrai":"entré","ordinai":"pedí","se fossi in te":"yo que tú","prenderei":"cogería","prendemmo":"cogimos","parlammo":"hablamos","si fosse rotto":"se hubiera roto","sarei arrivato":"habría llegado","avrei conosciuta":"habría conocido","chissà":"a saber / quién sabe","stai per":"estás a punto de"},"q":[{"q":"Perché il narratore ha perso il treno?","o":["Si è svegliato tardi","Pioveva e aveva l'ombrello rotto","Ha sbagliato binario"],"a":1},{"q":"Che cosa gli ha consigliato la ragazza?","o":["Di prendere un taxi","Di tornare a casa","Di prendere il regionale delle otto"],"a":2},{"q":"Chi è oggi quella ragazza?","o":["Sua moglie","Sua sorella","Una collega"],"a":0},{"q":"Che cosa dice la moglie quando un treno è in ritardo?","o":["Che bisogna lamentarsi","Chissà chi stai per conoscere","Che è meglio prendere la macchina"],"a":1}]}]}</script>

ue":"Tiene una ciudad alta amurallada y una ciudad baja unidas por funicular.","xy":[258.2,160.9]},"brescia":{"n":"Brescia","es":"Brescia","reg":"Lombardia","ll":[10.212,45.533],"lbl":"b","fact":"De aquí sale y aquí llega la Mille Miglia, la mítica carrera de coches. Conserva un templo romano y el monasterio lombardo de Santa Giulia, Patrimonio de la UNESCO.","clue":"Es la salida y la meta de la carrera de coches Mille Miglia.","xy":[298.1,176.7]},"verona":{"n":"Verona","es":"Verona","reg":"Veneto","ll":[10.982,45.429],"lbl":"b","fact":"La ciudad de Romeo y Julieta, a orillas del Adige. Cada verano su anfiteatro romano, la Arena, acoge una temporada de ópera al aire libre.","clue":"Es la ciudad de Romeo y Julieta y tiene una Arena romana donde se canta ópera.","xy":[355.4,187.1]},"vicenza":{"n":"Vicenza","es":"Vicenza","reg":"Veneto","ll":[11.541,45.541],"lbl":"t","fact":"La ciudad de Palladio, el arquitecto que inspiró medio mundo. Su Teatro Olimpico es el teatro cubierto más antiguo que se conserva.","clue":"Es la ciudad del arquitecto Palladio y tiene el teatro cubierto más antiguo conservado.","xy":[396.9,175.9]},"padova":{"n":"Padova","es":"Padua","reg":"Veneto","ll":[11.88,45.418],"lbl":"b","fact":"Su universidad, fundada en 1222, es una de las más antiguas del mundo y en ella enseñó Galileo. La Capilla de los Scrovegni guarda los frescos de Giotto.","clue":"En su universidad, de 1222, enseñó Galileo.","xy":[422.1,188.2]},"venezia":{"n":"Venezia","es":"Venecia","reg":"Veneto","ll":[12.321,45.441],"lbl":"r","fact":"Unas 118 islas y más de 400 puentes, sin coches. El tren llega a la estación de Santa Lucia por un puente de casi 4 km sobre la laguna.","clue":"Se llega en tren por un puente sobre la laguna y no tiene coches.","xy":[454.9,185.9]},"trieste":{"n":"Trieste","es":"Trieste","reg":"Friuli-Venezia Giulia","ll":[13.77,45.658],"lbl":"b","fact":"Fue el gran puerto del Imperio austrohúngaro y es la capital italiana del café. Su Piazza Unità d'Italia es la mayor plaza de Europa abierta al mar; aquí sopla la bora.","clue":"Fue el puerto del Imperio austrohúngaro; es la ciudad del café y del viento bora.","xy":[562.6,164.2]},"bologna":{"n":"Bologna","es":"Bolonia","reg":"Emilia-Romagna","ll":[11.343,44.506],"lbl":"b","fact":"«La dotta, la grassa, la rossa»: tiene la universidad más antigua del mundo occidental (1088), la cuna del ragù y los tejados rojos. Sus kilómetros de soportales son Patrimonio de la UNESCO.","clue":"La llaman «la dotta, la grassa, la rossa»; tiene la universidad más antigua de Occidente.","xy":[382.2,279.4]},"modena":{"n":"Modena","es":"Módena","reg":"Emilia-Romagna","ll":[10.926,44.647],"lbl":"t","fact":"Patria del vinagre balsámico tradicional y de Luciano Pavarotti. En su provincia, en Maranello, se fabrican los Ferrari.","clue":"Patria del vinagre balsámico y de Pavarotti; los Ferrari se fabrican en su provincia.","xy":[351.2,265.3]},"reggio_e":{"n":"Reggio Emilia","es":"Reggio Emilia","reg":"Emilia-Romagna","ll":[10.631,44.698],"lbl":"b","fact":"Aquí nació en 1797 la bandera tricolor italiana. Y da nombre, junto con Parma, al Parmigiano Reggiano.","clue":"Aquí nació en 1797 la bandera tricolor italiana.","xy":[329.3,260.2]},"parma":{"n":"Parma","es":"Parma","reg":"Emilia-Romagna","ll":[10.328,44.809],"lbl":"t","fact":"La ciudad del prosciutto di Parma y del Parmigiano. Giuseppe Verdi nació en su provincia y su Teatro Regio es un templo de la ópera.","clue":"Famosa por su jamón y por Verdi, que nació en su provincia.","xy":[306.8,249.1]},"pisa":{"n":"Pisa","es":"Pisa","reg":"Toscana","ll":[10.399,43.708],"lbl":"l","fact":"Fue una poderosa república marinera. En la Piazza dei Miracoli está la torre inclinada, y aquí nació Galileo Galilei.","clue":"Fue república marinera y aquí nació Galileo.","xy":[312.0,359.2]},"firenze":{"n":"Firenze","es":"Florencia","reg":"Toscana","ll":[11.248,43.776],"lbl":"t","fact":"Cuna del Renacimiento y capital de Italia de 1865 a 1871. El italiano moderno nace del florentino de Dante, Petrarca y Boccaccio.","clue":"Cuna del Renacimiento: el italiano moderno nace de su dialecto.","xy":[375.1,352.4]},"arezzo":{"n":"Arezzo","es":"Arezzo","reg":"Toscana","ll":[11.873,43.463],"lbl":"r","fact":"Aquí nació Petrarca, y en la iglesia de San Francesco están los frescos de Piero della Francesca. Dos veces al año celebra la Giostra del Saracino.","clue":"Ciudad natal de Petrarca y de la Giostra del Saracino.","xy":[421.6,383.7]},"perugia":{"n":"Perugia","es":"Perugia","reg":"Umbria","ll":[12.388,43.11],"lbl":"r","fact":"Capital de Umbria, «el corazón verde de Italia». Tiene la Universidad para Extranjeros, donde miles de personas estudian italiano cada año, y aquí nacieron los bombones Baci.","clue":"Tiene una Universidad para Extranjeros donde miles de personas estudian italiano.","xy":[459.9,419.0]},"roma":{"n":"Roma","es":"Roma","reg":"Lazio","ll":[12.502,41.901],"lbl":"l","fact":"Capital de Italia desde 1871, a orillas del Tíber. Dentro de la ciudad hay otro país, el Vaticano, y su estación de Termini es la más grande de Italia.","clue":"Dentro de la ciudad hay otro país, y su estación es la más grande de Italia.","xy":[468.3,539.9]},"caserta":{"n":"Caserta","es":"Caserta","reg":"Campania","ll":[14.331,41.075],"lbl":"r","fact":"Su Reggia, el palacio de los Borbones, es una de las residencias reales más grandes del mundo y Patrimonio de la UNESCO. Es tierra de mozzarella di bufala.","clue":"Tiene un palacio real borbónico enorme, Patrimonio de la UNESCO.","xy":[604.3,622.5]},"napoli":{"n":"Napoli","es":"Nápoles","reg":"Campania","ll":[14.268,40.853],"lbl":"l","fact":"La patria de la pizza, frente al Vesubio y su golfo. Su centro histórico es Patrimonio de la UNESCO y el napolitano tiene su propia literatura y canción.","clue":"La patria de la pizza, frente al Vesubio.","xy":[599.6,644.7]},"salerno":{"n":"Salerno","es":"Salerno","reg":"Campania","ll":[14.765,40.676],"lbl":"b","fact":"Aquí funcionó la Escuela Médica Salernitana, la primera e /* ---------- Normalización y comparación ---------- */
const stripAcc = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "");
const norm = s => String(s).toLowerCase().replace(/[’`´‘]/g, "'").replace(/\(.*?\)/g, " ").replace(/[¿?¡!.,;:«»"…—–-]/g, " ").replace(/\s+/g, " ").trim();

function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  let p = Array.from({length:n + 1}, (_, i) => i);
  for (let i = 1; i <= m; i++) { const c = [i]; for (let j = 1; j <= n; j++) c[j] = Math.min(p[j] + 1, c[j - 1] + 1, p[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); p = c; }
  return p[n];
}
/* Devuelve "ok" | "accent" | "close" | "no" */
function compare(input, answers, {lenient = false, article = false} = {}) {
  const x = norm(input);
  if (!x) return "no";
  let best = "no";
  for (const raw of answers) {
    const forms = [norm(raw)];
    if (article) forms.push(norm(raw).replace(ART, ""));
    for (const a of forms) {
      if (x === a || (article && x.replace(ART, "") === a)) return "ok";
      if (stripAcc(x) === stripAcc(a) && a.length > 2) best = "accent";
      else if (lenient && best === "no") { const d = lev(stripAcc(x), stripAcc(a)); if (d <= Math.max(1, Math.floor(a.length * .08))) best = "close"; }
    }
  }

}

/* ---------- Diccionario para tocar palabras ---------- */
const DICT = new Map();
function addDict(it, es) {
  for (const f of it.split(" / ")) {
    const n = norm(f), m = n.replace(ART, "");
    if (n && !DICT.has(n)) DICT.set(n, es);
    if (m && !DICT.has(m)) DICT.set(m, es);
  }
}

let VFORMS = null;   // forma conjugada → "essere (ser / estar)"; se genera la primera vez que hace falta
function verbForm(n) {
  if (!VFORMS) {
    VFORMS = new Map();
    const T = {pres:"presente", imp:"imperfetto", fut:"futuro", cond:"condicional", cpres:"subjuntivo", cimp:"subj. imperfecto"};
    const words = DATA.words.filter(x => x[2] === "v");
    const all = VERBS.map(x => [x.v, x.es]).concat(words.map(x => [x[0], x[1]]).filter(([v]) => /(are|ere|ire|rsi)$/.test(v) && !VERB[v]));
    for (const [v, es] of all) {
      let forms = [];
      try { for (const t of Object.keys(T)) { const c = conjugate(v, t); c && c.forEach(a => a && forms.push([a[0].split(" ").pop(), T[t]])); }
        participio(v).forEach(p => forms.push([p, "participio"])); } catch { continue; }
      for (const [f, t] of forms) { const k = stripAcc(f); if (!VFORMS.has(k)) VFORMS.set(k, []); const arr = VFORMS.get(k); if (arr.length < 3 && !arr.some(x => x.startsWith(v + " "))) arr.push(`${v} (${es}), ${t}`); }
    }
  }
  const r = VFORMS.get(stripAcc(n)) || VFORMS.get(stripAcc(n).replace(/[aie]$/, "o"));
  return r ? r.join(" · ") : null;
}
function lookup(w) {
  let n = norm(w);
  if (READ && READ.gl) { for (const [k, v] of Object.entries(READ.gl)) if (norm(k) === n) return v; }
  const after = n.split("'").pop();
  const vf = verbForm(after);
  const d = DICT.get(n) || DICT.get(after);
  if (d && vf && !/^(il|lo|la|l'|i|gli|le)\s/.test(n)) return vf + " · también: " + d;
  if (d) return d;
  if (vf) return vf;
  // Formas flexionadas sencillas: plural y femenino (amici → amico, case → casa, belle → bello)
  const tries = [[/hi$/, "o"], [/he$/, "a"], [/i$/, "o"], [/i$/, "e"], [/e$/, "a"], [/a$/, "o"], [/e$/, "o"]];
  for (const [re, r] of tries) { const c = after.replace(re, r); if (c !== after && DICT.has(c)) return DICT.get(c); }
  return null;
}

/* ---------- Texto con formato ligero ---------- */
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, '<em class="it">$1</em>');
}
function renderBody(body) {
  const out = []; const lines = body.split("\n"); let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith("|")) {
      const rows = []; while (i < lines.length && lines[i].startsWith("|")) { rows.push(lines[i].slice(1).split("|")); i++; }
      out.push(`<div class="tbl"><table><thead><tr>${rows[0].map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map((c, j) => `<td${j ? ' class="it"' : ""}>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`);
      continue;
    }
    if (l.startsWith("- ")) {
      const items = []; while (i < lines.length && lines[i].startsWith("- ")) { items.push(lines[i].slice(2)); i++; }
      out.push(`<ul>${items.map(x => `<li>${inline(x)}</li>`).join("")}</ul>`); continue;
    }
    if (l.startsWith("> ")) { out.push(`<p class="note">${inline(l.slice(2))}</p>`); i++; continue; }
    const para = []; while (i < lines.length && lines[i].trim() && !/^[|>-] ?/.test(lines[i].slice(0, 2)) ) { para.push(lines[i]); i++; }
    if (para.length) out.push(`<p>${inline(para.join(" "))}</p>`); else i++;
  }
  return out.join("");
}

function dueSummary() {
  const t = dayNum(); let due = 0, gdue = 0;
  for (const [k, s] of Object.entries(S.srs)) if (s.d <= t) { if (k.startsWith("g:")) gdue++; else if (item(k)) due++; }
  const newLeft = Math.max(0, S.settings.newPerDay - (S.newToday && S.newToday.d === dayKey() ? S.newToday.n : 0));
  return {due, gdue, nw: Math.min(newLeft, DATA.words.length - Object.keys(S.srs).filter(k => k.startsWith("w:")).length)};

/* Panel de salidas: lo que toca hoy, con minutos estimados */
function stepMinutes(u, k) {
  if (k === "vocab") return Math.max(3, Math.round(unitKeys(u).length * 20 / 60));
  if (k === "theory") return 6;
  if (k === "practice") return Math.max(3, Math.round(TOPIC[u.tid].ex.length * 20 / 60));
  if (k === "talk") return 4;
  return 5;
}
function departures(u, next, ds) {
  const out = [];
  if (ds.due + ds.gdue + ds.nw) {
    const due = Math.min(ds.due, 20), g = Math.min(ds.gdue, 2);
    out.push({a:"review", t:"Repaso de hoy", min:Math.max(1, Math.round((due * 8 + g * 60 + ds.nw * 20) / 60)),
      d:[due && `${due} tarjeta${due > 1 ? "s" : ""}`, ds.nw && `${ds.nw} nueva${ds.nw > 1 ? "s" : ""}`, g && `${g} tema${g > 1 ? "s" : ""}`].filter(Boolean).join(" · ")});
  }
  if (!unitDone(u)) out.push({a:"ustep", v:u.id, k:next.k, t:`${cityOf(u).n}: ${next.t.toLowerCase()}`, d:next.d, min:stepMinutes(u, next.k)});
  const ne = Object.keys(S.errors).length;
  if (ne >= 3) out.push({a:"errors", t:"Mis errores", d:`${Math.min(ne, 15)} fallos para corregir`, min:Math.max(1, Math.round(Math.min(ne, 15) * 15 / 60))});
  return out;
}

/* Calendario de actividad (últimos 3 meses, semanas de lunes a domingo) */
const dayDate = n => new Date(n * 864e5);
function heatmap() {
  const today = dayNum(); const wd = (dayDate(today).getUTCDay() + 6) % 7;
  const start = today - wd - 12 * 7;             // 13 semanas completas
  const g = S.settings.goal || 60;
  let cols = "", months = "", lastM = -1, active = 0;
  for (let w = 0; w < 13; w++) {
    const first = dayDate(start + w * 7); const m = first.getUTCMonth();
    if (m !== lastM) months += `<span class="hm-m" style="grid-column:${w + 2}">${IT_MONTHS[m].slice(0, 3)}</span>`; lastM = m;
    for (let d = 0; d < 7; d++) {
      const n = start + w * 7 + d; const k = dayKey(n); const xp = S.days[k] || 0;
      if (n > today) { cols += `<i class="hm-c fut" style="grid-column:${w + 2};grid-row:${d + 2}"></i>`; continue; }
      if (xp) active++;
      const lvl = !xp ? 0 : xp < g * .5 ? 1 : xp < g ? 2 : xp < g * 1.5 ? 3 : 4;
      const dt = dayDate(n);
      cols += `<button class="hm-c l${lvl} ${n === today ? "today" : ""}" style="grid-column:${w + 2};grid-row:${d + 2}" data-a="hday" data-v="${dt.getUTCDate()} ${IT_MONTHS[dt.getUTCMonth()]}: ${xp} XP" aria-label="${dt.getUTCDate()} ${IT_MONTHS[dt.getUTCMonth()]}, ${xp} XP"></button>`;
    }
  }
  return `<div class="hm-wrap"><div class="between"><div class="label">Últimos 3 meses</div><span class="small muted num">${active} días activos</span></div>
    <div class="hm" role="group" aria-label="Calendario de actividad">${months}
      <span class="hm-d" style="grid-row:2">L</span><span class="hm-d" style="grid-row:4">X</span><span class="hm-d" style="grid-row:6">S</span>${cols}</div>
    <div class="hm-legend small muted"><span>Menos</span>${[0,1,2,3,4].map(l => `<i class="hm-c l${l}"></i>`).join("")}<span>Objetivo ×1,5</span></div></div>`;
}

/* ---------- Estadísticas ---------- */
const TYPE_LBL = {pron:"Pronunciación", plc:"Test de nivel", mc:"Opción múltiple (vocabulario)", type:"Escribir en italiano", flip:"Tarjetas (Bien o Fácil)", "g-gap":"Huecos de gramática", "g-table":"Tablas de conjugación",
  "g-mc":"Gramática: elegir opción", "g-order":"Ordenar frases", "g-tr":"Traducir frases", dict:"Dictado", hear:"¿Qué has oído?", conj:"Entrenador de verbos", story:"Comprensión lectora", geo:"Geografía", aiex:"Repaso con Claude"};
function bestStreak() {
  const ks = Object.keys(S.days).filter(k => S.days[k]).sort(); let best = 0, cur = 0, prev = null;
  for (const k of ks) { const n = Math.round(Date.parse(k) / 864e5); cur = prev !== null && n === prev + 1 ? cur + 1 : 1; best = Math.max(best, cur); prev = n; }
  return best;
}
function pace() {
  const now = Date.now(); const real = UNITS.filter(u => unitDone(u) && (S.units[u.id].best || 0) > 0);
  const stamped = real.filter(u => S.units[u.id].at).map(u => S.units[u.id].at);
  const firstDay = Object.keys(S.days).sort()[0];
  let span;
  if (stamped.length >= 2) span = (now - Math.min(...stamped)) / 864e5;
  else if (firstDay) span = (now - Date.parse(firstDay)) / 864e5;
  if (!real.length || !span) return null;
  const n = stamped.length >= 2 ? stamped.length : real.length;
  return n / Math.max(7, span);           // paradas por día
}
function weekBars() {
  const today = dayNum(); const wd = (dayDate(today).getUTCDay() + 6) % 7; const start = today - wd - 11 * 7;
  const weeks = Array.from({length:12}, (_, w) => { let n = 0; for (let d = 0; d < 7; d++) n += S.wl[dayKey(start + w * 7 + d)] || 0; return {n, d:dayDate(start + w * 7)}; });
  const max = Math.max(10, ...weeks.map(w => w.n)); const top = Math.ceil(max / 10) * 10;

const aiDeckKeys = id => { const d = S.aiDecks.find(x => x.id === id); return d ? d.cards.map((_, i) => `a:${id}:${i}`) : []; };
function vocabPool(key) {
  if (key.startsWith("c:")) return deckKeys(key.split(":")[1]);
  if (key.startsWith("a:")) { const ks = aiDeckKeys(key.split(":")[1]); return ks.length >= 4 ? ks : ks.concat(wordKeys(0, 200)); }
  if (key.startsWith("u:")) return S.custom.length >= 4 ? S.custom.map((_, i) => "u:" + i) : wordKeys(0, 200);
  const i = +key.split(":")[1]; const b = Math.floor(i / 50) * 50; return wordKeys(b, 50);
}
function mcOptions(key, dir) {
  const it = item(key); const pool = vocabPool(key).filter(k => k !== key && item(k));
  let same = it.pos ? pool.filter(k => item(k).pos === it.pos) : pool; if (same.length < 3) same = pool;
  const field = dir === "it-es" ? "es" : "it";
  const seen = new Set([it[field]]); const opts = [key];
  for (const k of shuffle(same)) { const v = item(k)[field]; if (!seen.has(v)) { seen.add(v); opts.push(k); } if (opts.length === 4) break; }
  return shuffle(opts);
}
const Q = {

function annotate(text, errs) {
  // Marca en el texto original los fragmentos con error (en orden de aparición, sin solapamientos)
  let html = ""; let pos = 0; const found = [];
  errs.forEach((e, i) => { const at = e.original ? text.indexOf(e.original, 0) : -1; if (at >= 0) found.push({at, len:e.original.length, i}); });
  found.sort((a, b) => a.at - b.at);
  for (const f of found) { if (f.at < pos) continue; html += esc(text.slice(pos, f.at)) + `<mark class="err" title="${esc(errs[f.i].correccion)}">${esc(text.slice(f.at, f.at + f.len))}<sup>${f.i + 1}</sup></mark>`; pos = f.at + f.len; }
  return (html + esc(text.slice(pos))).replace(/\n/g, "<br>");
}

/* ---------- Sincronización entre dispositivos ---------- */
const SYNC = {ref:null, status:"local", busy:false, pending:false};
let syncT;
function scheduleSync() { if (!SYNC.ref) return; clearTimeout(syncT); syncT = setTimeout(push, 2500); }
function updateSyncBadge() { const b = $("#sync"); if (b) b.outerHTML = syncBadge(); }
async function push() {
  if (!SYNC.ref) return;
  if (SYNC.busy) { SYNC.pending = true; return; }
  SYNC.busy = true;
  try { await SYNC.ref.set({json:JSON.stringify(S), updatedAt:S.updatedAt || Date.now(), v:1}); SYNC.status = "synced"; }
  catch (e) { SYNC.status = "error"; }
  SYNC.busy = false; updateSyncBadge();
  if (SYNC.pending) { SYNC.pending = false; push(); }
}
async function pull() {
  if (!SYNC.ref) return;
  try {
    const snap = await SYNC.ref.get();
    if (snap.exists) {
      const d = snap.data() || {}; const rAt = +d.updatedAt || 0;
      if (rAt > (S.updatedAt || 0)) {
        S = migrate(JSON.parse(d.json)); saveLocal(); applyPrefs();
        if (!SES && VIEW.name !== "dialog" && VIEW.name !== "ai") render();
      } else if (rAt < (S.updatedAt || 0)) push();
    } else if (S.updatedAt) push();
    SYNC.status = "synced";
  } catch (e) { SYNC.status = "error"; }
  updateSyncBadge();
}
async function initCapabilities() {
  if (!window.claude || typeof window.claude.use !== "function") return;
  claude.use("sample").then(s => { SAMPLE = s; AI_NONE = !s; if (!s && VIEW.name === "practice") render(); const c = $("#ai-card"); if (c && s) c.hidden = false;
    if (s && !SES && ["practice", "diary", "aiReview", "deckGen", "talk"].includes(VIEW.name)) render(); }).catch(() => {});
  try {
    const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    SYNC.ref = db.doc("data/users/" + id + "/progress");
    await pull();
    document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pull(); });
  } catch {}
}
