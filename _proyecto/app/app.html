es. Sí, para tres noches.","next":"n2"},{"it":"Sì, ho una riserva.","es":"Sí, tengo una reserva.","bad":"Falso amigo: «reserva» es «prenotazione». «Riserva» es una reserva natural o un suplente."}]},"n2":{"it":"Perfetto, ecco la prenotazione. Mi serve un documento, per favore.","es":"Perfecto, aquí está la reserva. Necesito un documento, por favor.","o":[{"it":"Certo, ecco la mia carta d'identità.","es":"Claro, aquí tiene mi DNI.","next":"n3"},{"it":"Ecco il passaporto.","es":"Aquí tiene el pasaporte.","next":"n3"}]},"n3":{"it":"Grazie. La colazione è dalle sette alle dieci, al primo piano.","es":"Gracias. El desayuno es de siete a diez, en la primera planta.","o":[{"it":"A che ora devo lasciare la camera l'ultimo giorno?","es":"¿A qué hora tengo que dejar la habitación el último día?","next":"n4"},{"it":"C'è il wi-fi in camera?","es":"¿Hay wifi en la habitación?","next":"n3b"}]},"n3b":{"it":"Sì, la password è sul biglietto con la chiave.","es":"Sí, la contraseña está en la tarjeta con la llave.","o":[{"it":"Grazie. E a che ora devo lasciare la camera?","es":"Gracias. ¿Y a qué hora tengo que dejar la habitación?","next":"n4"}]},"n4":{"it":"Il check-out è entro le undici. Se vuole, può lasciare i bagagli qui.","es":"La salida es antes de las once. Si quiere, puede dejar el equipaje aquí.","o":[{"it":"Perfetto, grazie mille.","es":"Perfecto, muchas gracias.","next":"n5"}]},"n5":{"it":"(Dieci minuti dopo, al telefono) Reception, mi dica.","es":"(Diez minutos después, al teléfono) Recepción, dígame.","o":[{"it":"Scusi, l'aria condizionata nella mia camera non funziona.","es":"Perdone, el aire acondicionado de mi habitación no funciona.","next":"n6"},{"it":"Buonasera, nella camera manca un asciugamano.","es":"Buenas tardes, en la habitación falta una toalla.","next":"n6"},{"it":"L'aria condizionata è rotto.","es":"El aire acondicionado está roto.","bad":"«Aria» es femenino: «è rotta». Más natural: «non funziona»."}]},"n6":{"it":"Mi scusi tanto! Mando subito qualcuno.","es":"¡Disculpe! Mando a alguien enseguida.","o":[{"it":"Grazie, è molto gentile.","es":"Gracias, es muy amable.","next":"n7"}]},"n7":{"it":"Si figuri. Buon soggiorno a Firenze!","es":"No hay de qué. ¡Buena estancia en Florencia!","o":[]}},"start":"n1","vocab":[["la prenotazione","la reserva"],["la camera doppia","la habitación doble"],["il piano","la planta"],["entro le undici","antes de las once"],["i bagagli","el equipaje"],["l'asciugamano","la toalla"]],"frasi":[["Mi serve un documento.","Necesito un documento."],["Non funziona.","No funciona."],["Si figuri.","No hay de qué (formal)."]]},{"id":"farmacia","lvl":"A2","title":"In farmacia","who":"La farmacista","role":"farmacéutica","reg":"Lei","desc":"Llevas dos días con dolor de garganta y entras en una farmacia.","nodes":{"n1":{"it":"Buongiorno, come posso aiutarla?","es":"Buenos días, ¿en qué puedo ayudarle?","o":[{"it":"Buongiorno, ho mal di gola da due giorni.","es":"Buenos días, me duele la garganta desde hace dos días.","next":"n2"},{"it":"Buongiorno, mi fa male la gola e ho un po' di tosse.","es":"Buenos días, me duele la garganta y tengo algo de tos.","next":"n2"},{"it":"Buongiorno, mi duole la gola.","es":"Buenos días, me duele la garganta.","bad":"Se entiende, pero lo natural es «mi fa male la gola» o «ho mal di gola»."}]},"n2":{"it":"Ha anche la febbre?","es":"¿Tiene también fiebre?","o":[{"it":"No, la febbre no, per fortuna.","es":"No, fiebre no, por suerte.","next":"n3"},{"it":"Sì, ieri sera avevo trentotto.","es":"Sí, anoche tenía treinta y ocho.","next":"n2b"}]},"n2b":{"it":"Allora le consiglio di andare dal medico se domani non passa. Intanto può prendere questo.","es":"Entonces le aconsejo ir al médico si mañana no se pasa. Mientras, puede tomar esto.","o":[{"it":"D'accordo. Come lo prendo?","es":"De acuerdo. ¿Cómo lo tomo?","next":"n4"}]},"n3":{"it":"Allora le do queste pastiglie per la gola. È allergic{o} a qualche farmaco?","es":"Entonces le doy estas pastillas para la garganta. ¿Es alérgico/a a algún medicamento?","o":[{"it":"No, non sono allergic{o} a niente.","es":"No, no soy alérgico/a a nada.","next":"n4a"},{"it":"Sì, sono allergic{o} alla penicillina.","es":"Sí, soy alérgico/a a la penicilina.","next":"n4a"}]},"n4a":{"it":"Bene, queste vanno bene.","es":"Bien, estas le sirven.","o":[{"it":"Come le prendo?","es":"¿Cómo las tomo?","next":"n4"},{"it":"Come lo prendo?","es":"¿Cómo lo tomo?","bad":"Son «le pastiglie» (femenino plural): «come le prendo?»."}]},"n4":{"it":"Una ogni sei ore, dopo i pasti. Non più di quattro al giorno.","es":"Una cada seis horas, después de las comidas. No más de cuatro al día.","o":[{"it":"Perfetto. Serve la ricetta?","es":"Perfecto. ¿Hace falta receta?","next":"n5"},{"it":"Grazie. Quanto costano?","es":"Gracias. ¿Cuánto cuestan?","next":"n5"}]},"n5":{"it":"No, sono da banco. Sono otto euro e cinquanta. Guarisca presto!","es":"No, son sin receta. Son ocho euros cincuenta. ¡Que se mejore!","o":[]}},"start":"n1","vocab":[["ho mal di gola","me duele la garganta"],["la tosse","la tos"],["la febbre","la fiebre"],["la pastiglia","la pastilla"],["dopo i pasti","después de las comidas"],["da banco","sin receta"]],"frasi":[["Come posso aiutarla?","¿En qué puedo ayudarle?"],["Le consiglio di...","Le aconsejo que..."],["Guarisca presto!","¡Que se mejore pronto!"]]},{"id":"vicina","lvl":"A2","title":"La vicina di casa","who":"La signora Rossi","role":"vecina","reg":"Lei","desc":"Te vas de viaje una semana y quieres pedirle un favor a tu vecina mayor.","nodes":{"n1":{"it":"Oh, buongiorno! Come sta?","es":"¡Oh, buenos días! ¿Cómo está?","o":[{"it":"Buongiorno signora Rossi, bene grazie, e lei?","es":"Buenos días señora Rossi, bien gracias, ¿y usted?","next":"n2"},{"it":"Ciao Rossi, come stai?","es":"Hola Rossi, ¿cómo estás?","bad":"A una vecina mayor se le habla de Lei: «Buongiorno signora, come sta?»."}]},"n2":{"it":"Eh, si tira avanti, con questo caldo! Mi dica, ha bisogno di qualcosa?","es":"¡Eh, vamos tirando, con este calor! Dígame, ¿necesita algo?","o":[{"it":"Sì, volevo chiederle un favore. Domani parto per una settimana.","es":"Sí, quería pedirle un favor. Mañana me voy una semana.","next":"n3"},{"it":"Le dispiacerebbe innaffiare le mie piante? Parto domani.","es":"¿Le importaría regar mis plantas? Me voy mañana.","next":"n4"}]},"n3":{"it":"Ah, che bello! Dove va di bello?","es":"¡Ah, qué bien! ¿Adónde se va?","o":[{"it":"Vado in Puglia con degli amici. Potrebbe innaffiare le mie piante?","es":"Me voy a Apulia con unos amigos. ¿Podría regar mis plantas?","next":"n4"},{"it":"Vado in Puglia. Puoi innaffiare le mie piante?","es":"... ¿Puedes regar mis plantas?","bad":"Mantén el Lei: «potrebbe» o «può»."}]},"n4":{"it":"Ma certo, con piacere! Mi lascia le chiavi?","es":"¡Pues claro, con mucho gusto! ¿Me deja las llaves?","o":[{"it":"Sì, gliele porto stasera.","es":"Sí, se las traigo esta noche.","next":"n5"},{"it":"Certo, gliele lascio domattina.","es":"Claro, se las dejo mañana por la mañana.","next":"n5"},{"it":"Sì, le le porto stasera.","es":"Sí, se las traigo esta noche.","bad":"«Le» (a usted) + «le» (las llaves) = «gliele»."}]},"n5":{"it":"Perfetto. Quante volte devo innaffiarle?","es":"Perfecto. ¿Cuántas veces tengo que regarlas?","o":[{"it":"Due volte, mercoledì e sabato, se non le dispiace.","es":"Dos veces, el miércoles y el sábado, si no le importa.","next":"n6"},{"it":"Basta una volta, giovedì. Grazie davvero!","es":"Basta con una vez, el jueves. ¡Muchísimas gracias!","next":"n6"}]},"n6":{"it":"Si figuri, tra vicini ci si aiuta! Buon viaggio!","es":"¡No hay de qué, entre vecinos hay que ayudarse! ¡Buen viaje!","o":[{"it":"Grazie! Le porto qualcosa dalla Puglia.","es":"¡Gracias! Le traigo algo de Apulia.","next":"n7"}]},"n7":{"it":"Ma non deve! Però i taralli mi piacciono tanto...","es":"¡No hace falta! Aunque los taralli me gustan mucho...","o":[]}},"start":"n1","vocab":[["si tira avanti","vamos tirando"],["innaffiare","regar"],["le chiavi","las llaves"],["gliele","se las"],["domattina","mañana por la mañana"]],"frasi":[["Volevo chiederle un favore.","Quería pedirle un favor."],["Le dispiacerebbe...?","¿Le importaría...?"],["Se non le dispiace","Si no le importa"]]},{"id":"negozio","lvl":"A2","title":"In un negozio di vestiti","who":"La commessa","role":"dependienta","reg":"Lei","desc":"Buscas una chaqueta para una boda en una tienda de ropa.","nodes":{"n1":{"it":"Buongiorno, posso aiutarla?","es":"Buenos días, ¿le puedo ayudar?","o":[{"it":"Sì, grazie. Cerco una giacca elegante per un matrimonio.","es":"Sí, gracias. Busco una chaqueta elegante para una boda.","next":"n2"},{"it":"Do solo un'occhiata, grazie.","es":"Solo estoy mirando, gracias.","next":"n1b"}]},"n1b":{"it":"Certo, se ha bisogno mi chiami.","es":"Claro, si necesita algo, llámeme.","o":[{"it":"(Dopo un po') Scusi, ha questa giacca in un'altra taglia?","es":"(Al rato) Perdone, ¿tiene esta chaqueta en otra talla?","next":"n2"}]},"n2":{"it":"Che taglia porta?","es":"¿Qué talla usa?","o":[{"it":"Porto la 46.","es":"Uso la 46.","next":"n3"},{"it":"Di solito la M, ma dipende.","es":"Normalmente la M, pero depende.","next":"n3"},{"it":"Sono la 46.","es":"(Soy la 46.)","bad":"La talla se «lleva»: «porto la 46»."}]},"n3":{"it":"Ecco, abbiamo questa blu e questa grigia. Vuole provarle?","es":"Mire, tenemos esta azul y esta gris. ¿Quiere probárselas?","o":[{"it":"Sì, grazie. Dov'è il camerino?","es":"Sí, gracias. ¿Dónde está el probador?","next":"n4"},{"it":"Provo la blu, grazie.","es":"Me pruebo la azul, gracias.","next":"n4"}]},"n4":{"it":"Come le sta?","es":"¿Qué tal le queda?","o":[{"it":"Mi sta un po' stretta. Ha la taglia più grande?","es":"Me queda un poco estrecha. ¿Tiene la talla más grande?","next":"n5"},{"it":"Mi sta benissimo! La prendo.","es":"¡Me queda genial! Me la llevo.","next":"n6"},{"it":"Mi sta un po' stretto.","es":"Me queda un poco estrecho.","bad":"«La giacca» es femenino: «stretta»."}]},"n5":{"it":"Ecco la 48. Prego.","es":"Aquí tiene la 48. Adelante.","o":[{"it":"Questa va benissimo. Quanto costa?","es":"Esta me queda perfecta. ¿Cuánto cuesta?","next":"n6"}]},"n6":{"it":"Costa centoventi euro, ma oggi c'è il venti per cento di sconto.","es":"Cuesta ciento veinte euros, pero hoy hay un veinte por ciento de descuento.","o":[{"it":"Ottimo! Se non va bene, posso cambiarla?","es":"¡Genial! Si no me queda bien, ¿puedo cambiarla?","next":"n7"},{"it":"Perfetto, la prendo. Pago con la carta.","es":"Perfecto, me la llevo. Pago con tarjeta.","next":"n7"}]},"n7":{"it":"Certo, entro quattordici giorni con lo scontrino. Buon matrimonio!","es":"Claro, en un plazo de catorce días con el tique. ¡Que disfrute la boda!","o":[]}},"start":"n1","vocab":[["dare un'occhiata","echar un vistazo"],["la taglia","la talla"],["il camerino","el probador"],["stare stretto","quedar estrecho"],["lo sconto","el descuento"],["lo scontrino","el tique"]],"frasi":[["Come le sta?","¿Qué tal le queda?"],["La prendo.","Me la llevo."],["Posso cambiarla?","¿Puedo cambiarla?"]]},{"id":"prof","lvl":"A2","title":"Dalla professoressa","who":"La prof.ssa Bianchi","role":"profesora","reg":"Lei","desc":"Vas a hablar con la profesora de tu curso de italiano sobre tu nivel.","nodes":{"n1":{"it":"Buongiorno, si accomodi. Di cosa voleva parlarmi?","es":"Buenos días, siéntese. ¿De qué quería hablarme?","o":[{"it":"Buongiorno professoressa. Volevo chiederle un consiglio sul corso.","es":"Buenos días, profesora. Quería pedirle un consejo sobre el curso.","next":"n2"},{"it":"Ciao prof, devo parlarti.","es":"Hola profe, tengo que hablar contigo.","bad":"Con la profesora se usa el Lei y «professoressa»."}]},"n2":{"it":"Mi dica pure.","es":"Dígame.","o":[{"it":"Capisco bene, ma quando parlo faccio molti errori.","es":"Entiendo bien, pero cuando hablo cometo muchos errores.","next":"n3"},{"it":"Vorrei passare al livello B1. Pensa che sia possibile?","es":"Me gustaría pasar al nivel B1. ¿Cree que es posible?","next":"n3b"}]},"n3":{"it":"È normale. Gli spagnoli capiscono tanto, ma devono parlare di più. Cosa fa per praticare?","es":"Es normal. Los españoles entienden mucho, pero tienen que hablar más. ¿Qué hace para practicar?","o":[{"it":"Guardo serie in italiano e uso un'app tutti i giorni.","es":"Veo series en italiano y uso una app todos los días.","next":"n4"},{"it":"Purtroppo non molto. Non ho amici italiani.","es":"Por desgracia, no mucho. No tengo amigos italianos.","next":"n4"}]},"n3b":{"it":"Ha fatto molti progressi. Se continua così, a gennaio potrà fare il B1.","es":"Ha hecho muchos progresos. Si sigue así, en enero podrá hacer el B1.","o":[{"it":"Che bello! Cosa mi consiglia di studiare?","es":"¡Qué bien! ¿Qué me aconseja estudiar?","next":"n4"}]},"n4":{"it":"Le consiglio di fare uno scambio linguistico: un'ora in italiano e un'ora in spagnolo.","es":"Le aconsejo hacer un intercambio de idiomas: una hora en italiano y una en español.","o":[{"it":"Ottima idea! Dove posso trovare qualcuno?","es":"¡Muy buena idea! ¿Dónde puedo encontrar a alguien?","next":"n5"},{"it":"Lo farò sicuramente.","es":"Lo haré seguro.","next":"n5"},{"it":"Ottima idea! Lo farei.","es":"¡Muy buena idea! Lo haría.","bad":"Para un plan firme se usa el futuro: «lo farò»."}]},"n5":{"it":"In bacheca ci sono annunci di studenti. E il giovedì c'è il caffè linguistico in biblioteca.","es":"En el tablón hay anuncios de estudiantes. Y los jueves hay café de idiomas en la biblioteca.","o":[{"it":"Grazie mille, professoressa. Ci andrò giovedì.","es":"Muchas gracias, profesora. Iré el jueves.","next":"n6"}]},"n6":{"it":"Brav{o}! E si ricordi: sbagliando si impara.","es":"¡Muy bien! Y recuerde: equivocándose se aprende.","o":[]}},"start":"n1","vocab":[["si accomodi","siéntese"],["il consiglio","el consejo"],["lo scambio linguistico","el intercambio de idiomas"],["la bacheca","el tablón de anuncios"],["gli annunci","los anuncios"]],"frasi":[["Mi dica pure.","Dígame."],["Le consiglio di...","Le aconsejo..."],["Sbagliando si impara.","Equivocándose se aprende."]]},{"id":"cena","lvl":"B1","title":"Organizzare una cena","who":"Marco","role":"amigo","reg":"tu","desc":"Marco y tú queréis organizar una cena para el cumpleaños de Elena.","nodes":{"n1":{"it":"Senti, sabato è il compleanno di Elena. Potremmo organizzarle una cena a sorpresa, che ne dici?","es":"Oye, el sábado es el cumple de Elena. Podríamos organizarle una cena sorpresa, ¿qué te parece?","o":[{"it":"Sarebbe fantastico! Dove la facciamo?","es":"¡Sería fantástico! ¿Dónde la hacemos?","next":"n2"},{"it":"Ottima idea! Io potrei cucinare.","es":"¡Muy buena idea! Yo podría cocinar.","next":"n2b"}]},"n2":{"it":"Potremmo farla a casa mia, ma è piccola. Oppure in pizzeria.","es":"Podríamos hacerla en mi casa, pero es pequeña. O en una pizzería.","o":[{"it":"Secondo me la pizzeria è meglio: nessuno deve cucinare.","es":"En mi opinión la pizzería es mejor: nadie tiene que cocinar.","next":"n3"},{"it":"Io preferirei a casa: è più intimo. Cucino io!","es":"Yo preferiría en casa: es más íntimo. ¡Cocino yo!","next":"n2b"}]},"n2b":{"it":"Davvero? Cosa prepareresti?","es":"¿En serio? ¿Qué prepararías?","o":[{"it":"Farei una paella! Elena adora la cucina spagnola.","es":"¡Haría una paella! A Elena le encanta la cocina española.","next":"n3"},{"it":"Preparerei la pasta e un tiramisù.","es":"Prepararía pasta y un tiramisú.","next":"n3"},{"it":"Facerei una paella.","es":"Haría una paella.","bad":"El condicional de fare es irregular: «farei»."}]},"n3":{"it":"Perfetto. Quante persone invitiamo?","es":"Perfecto. ¿A cuántas personas invitamos?","o":[{"it":"Direi una decina, i suoi amici più stretti.","es":"Yo diría unas diez, sus amigos más cercanos.","next":"n4"},{"it":"Inviterei anche i suoi colleghi, se ti va.","es":"Invitaría también a sus compañeros, si te parece.","next":"n4"}]},"n4":{"it":"E il regalo? Hai qualche idea?","es":"¿Y el regalo? ¿Tienes alguna idea?","o":[{"it":"Potremmo regalarle un weekend alle terme. Facciamo una colletta?","es":"Podríamos regalarle un fin de semana en un balneario. ¿Hacemos un bote?","next":"n5"},{"it":"Le piacerebbe un corso di fotografia, credo.","es":"Le gustaría un curso de fotografía, creo.","next":"n5"},{"it":"Gli piacerebbe un corso di fotografia.","es":"Le gustaría un curso de fotografía.","bad":"Elena es mujer: «le piacerebbe»."}]},"n5":{"it":"Mi piace! Allora io scrivo agli altri e tu pensi alla cena. Ma acqua in bocca con Elena!","es":"¡Me gusta! Entonces yo escribo a los demás y tú te encargas de la cena. ¡Pero punto en boca con Elena!","o":[{"it":"Tranquillo, non le dirò niente!","es":"Tranquilo, ¡no le diré nada!","next":"n6"},{"it":"Certo, sarò una tomba!","es":"¡Claro, seré una tumba!","next":"n6"}]},"n6":{"it":"Grande! Sarà una serata bellissima.","es":"¡Genial! Será una noche preciosa.","o":[]}},"start":"n1","vocab":[["a sorpresa","sorpresa"],["che ne dici?","¿qué te parece?"],["una decina","unos diez"],["gli amici più stretti","los amigos más cercanos"],["la colletta","el bote"],["le terme","el balneario"]],"frasi":[["Sarebbe fantastico!","¡Sería fantástico!"],["Se ti va","Si te apetece"],["Acqua in bocca!","¡Punto en boca!"]]},{"id":"riunione","lvl":"B1","title":"Una riunione di lavoro","who":"Giulia","role":"compañera de trabajo","reg":"tu","desc":"En una reunión, Giulia te pide tu opinión sobre un nuevo proyecto.","nodes":{"n1":{"it":"Allora, cosa pensi della proposta del cliente?","es":"Bueno, ¿qué piensas de la propuesta del cliente?","o":[{"it":"Penso che sia interessante, ma la scadenza è troppo stretta.","es":"Creo que es interesante, pero el plazo es demasiado ajustado.","next":"n2"},{"it":"Secondo me è un'ottima occasione per l'azienda.","es":"En mi opinión es una gran oportunidad para la empresa.","next":"n2b"},{"it":"Penso che è interessante, ma la scadenza è troppo stretta.","es":"Creo que es interesante...","bad":"Tras «penso che», en registro cuidado: congiuntivo, «penso che sia»."}]},"n2":{"it":"Hai ragione. Credi che riusciamo a finire entro marzo?","es":"Tienes razón. ¿Crees que conseguimos terminar antes de marzo?","o":[{"it":"Dubito che ce la facciamo senza un'altra persona.","es":"Dudo que lo logremos sin otra persona.","next":"n3"},{"it":"Sì, purché tutti facciano gli straordinari.","es":"Sí, siempre que todos hagan horas extra.","next":"n3"},{"it":"Sì, purché tutti fanno gli straordinari.","es":"Sí, siempre que...","bad":"«Purché» exige congiuntivo: «facciano»."}]},"n2b":{"it":"Sono d'accordo, però è un progetto rischioso.","es":"Estoy de acuerdo, pero es un proyecto arriesgado.","o":[{"it":"Da un lato è rischioso, dall'altro potremmo crescere molto.","es":"Por un lado es arriesgado; por otro, podríamos crecer mucho.","next":"n3"},{"it":"È vero, però mi sembra che valga la pena.","es":"Es verdad, pero me parece que vale la pena.","next":"n3"}]},"n3":{"it":"Allora cosa proponi di dire al capo?","es":"Entonces, ¿qué propones decirle al jefe?","o":[{"it":"Proporrei di accettare, ma chiedendo più tempo.","es":"Propondría aceptar, pero pidiendo más tiempo.","next":"n4"},{"it":"Bisogna che il capo ci dia una persona in più.","es":"Hace falta que el jefe nos dé una persona más.","next":"n4"}]},"n4":{"it":"Mi sembra ragionevole. Scrivi tu l'email o la scrivo io?","es":"Me parece razonable. ¿Escribes tú el correo o lo escribo yo?","o":[{"it":"La scrivo io e te la mando prima di inviarla.","es":"Lo escribo yo y te lo mando antes de enviarlo.","next":"n5"},{"it":"Scrivila tu, sei più brava di me con il capo!","es":"¡Escríbelo tú, que se te da mejor que a mí con el jefe!","next":"n5"}]},"n5":{"it":"Perfetto. Comunque, ottimo lavoro oggi.","es":"Perfecto. En cualquier caso, buen trabajo hoy.","o":[]}},"start":"n1","vocab":[["la proposta","la propuesta"],["la scadenza","el plazo"],["farcela","lograrlo"],["purché","siempre que"],["gli straordinari","las horas extra"],["valere la pena","valer la pena"]],"frasi":[["Penso che sia...","Creo que es..."],["Da un lato... dall'altro...","Por un lado... por otro..."],["Mi sembra ragionevole.","Me parece razonable."]]},{"id":"reclamo","lvl":"B1","title":"Un reclamo al ristorante","who":"Il cameriere","role":"camarero","reg":"Lei","desc":"Llevas 40 minutos esperando y te traen un plato equivocado.","nodes":{"n1":{"it":"Ecco a lei: spaghetti alle vongole.","es":"Aquí tiene: espaguetis con almejas.","o":[{"it":"Mi scusi, ma io avevo ordinato le lasagne.","es":"Perdone, pero yo había pedido lasaña.","next":"n2"},{"it":"Mi scusi, ma io ho ordinato le lasagne e voi sbagliate sempre.","es":"Perdone, pero yo pedí lasaña y siempre os equivocáis.","bad":"Reclamar es legítimo, pero mejor sin generalizar: firme y educado funciona mejor."}]},"n2":{"it":"Oh, mi dispiace tanto! Deve esserci stato un errore in cucina.","es":"¡Oh, lo siento mucho! Ha debido de haber un error en la cocina.","o":[{"it":"Capisco, ma aspetto già da quaranta minuti.","es":"Lo entiendo, pero ya llevo cuarenta minutos esperando.","next":"n3"},{"it":"Non si preoccupi, ma quanto ci vorrà?","es":"No se preocupe, pero ¿cuánto tardará?","next":"n3"}]},"n3":{"it":"Ha ragione. Le porto subito le lasagne, ci vorranno cinque minuti.","es":"Tiene razón. Le traigo la lasaña enseguida, serán cinco minutos.","o":[{"it":"Va bene, ma per favore che siano calde.","es":"Vale, pero por favor que esté caliente.","next":"n4"},{"it":"Preferirei annullare l'ordine, se possibile.","es":"Preferiría anular el pedido, si es posible.","next":"n3b"}]},"n3b":{"it":"Capisco perfettamente. Le offriamo almeno un caffè e un dolce?","es":"Lo entiendo perfectamente. ¿Le invitamos al menos a un café y un postre?","o":[{"it":"Va bene, grazie, accetto volentieri.","es":"Vale, gracias, acepto con gusto.","next":"n5"}]},"n4":{"it":"(Dopo cinque minuti) Ecco le lasagne. Per scusarci, il dolce lo offre la casa.","es":"(Cinco minutos después) Aquí tiene la lasaña. Para disculparnos, el postre invita la casa.","o":[{"it":"Molto gentile, grazie. Apprezzo.","es":"Muy amable, gracias. Lo agradezco.","next":"n5"},{"it":"Grazie, sono buonissime!","es":"¡Gracias, está buenísima!","next":"n5"}]},"n5":{"it":"Ancora mille scuse. Buon proseguimento!","es":"Mil disculpas otra vez. ¡Que siga bien!","o":[]}},"start":"n1","vocab":[["ordinare","pedir (en un restaurante)"],["un errore in cucina","un error en la cocina"],["annullare l'ordine","anular el pedido"],["lo offre la casa","invita la casa"],["apprezzare","agradecer / valorar"]],"frasi":[["Avevo ordinato...","Había pedido..."],["Quanto ci vorrà?","¿Cuánto tardará?"],["Buon proseguimento!","¡Que siga bien!"]]},{"id":"notizia","lvl":"B2","title":"Discutere una notizia","who":"Luca","role":"conocido","reg":"tu","desc":"Tomando algo con Luca, comentáis una noticia: la ciudad quiere cerrar el centro a los coches.","nodes":{"n1":{"it":"Hai letto? Il comune vuole chiudere il centro alle macchine. Per me è una follia.","es":"¿Has leído? El ayuntamiento quiere cerrar el centro a los coches. Para mí es una locura.","o":[{"it":"Io invece penso che sia una buona idea: l'aria è irrespirabile.","es":"Yo en cambio creo que es una buena idea: el aire es irrespirable.","next":"n2"},{"it":"Capisco i tuoi dubbi, ma dipende da come lo fanno.","es":"Entiendo tus dudas, pero depende de cómo lo hagan.","next":"n2"},{"it":"Io penso che è una buona idea.","es":"Yo creo que es una buena idea.","bad":"En registro cuidado: «penso che sia»."}]},"n2":{"it":"Sì, ma se chiudessero il centro, i negozi perderebbero clienti.","es":"Sí, pero si cerraran el centro, las tiendas perderían clientes.","o":[{"it":"Non è detto: se ci fossero più zone pedonali, la gente passeggerebbe di più.","es":"No necesariamente: si hubiera más zonas peatonales, la gente pasearía más.","next":"n3"},{"it":"Forse, ma se migliorassero i trasporti, il problema non ci sarebbe.","es":"Quizás, pero si mejoraran el transporte, no habría problema.","next":"n3"},{"it":"Se ci sarebbero più zone pedonali, la gente passeggerebbe di più.","es":"Si hubiera más zonas peatonales...","bad":"Nunca condizionale tras «se»: «se ci fossero»."}]},"n3":{"it":"Mah. A Bologna l'hanno fatto qualche anno fa e i commercianti si sono lamentati.","es":"Bueno. En Bolonia lo hicieron hace unos años y los comerciantes se quejaron.","o":[{"it":"Sì, ma ho letto che dopo un anno le vendite erano aumentate.","es":"Sí, pero leí que al cabo de un año las ventas habían aumentado.","next":"n4"},{"it":"Magari! Se l'avessero fatto anche qui dieci anni fa, ora staremmo meglio.","es":"¡Ojalá! Si lo hubieran hecho aquí también hace diez años, ahora estaríamos mejor.","next":"n4"}]},"n4":{"it":"Può darsi. Comunque il sindaco ha detto che il progetto sarebbe partito a gennaio.","es":"Puede ser. De todos modos, el alcalde dijo que el proyecto empezaría en enero.","o":[{"it":"Vedremo. L'importante è che ascoltino anche i cittadini.","es":"Ya veremos. Lo importante es que escuchen también a los ciudadanos.","next":"n5"},{"it":"Speriamo che non lo rimandino come al solito.","es":"Esperemos que no lo pospongan como siempre.","next":"n5"}]},"n5":{"it":"Su questo siamo d'accordo! Dai, cambiamo argomento, che arriva la pizza.","es":"¡En eso estamos de acuerdo! Venga, cambiemos de tema, que llega la pizza.","o":[]}},"start":"n1","vocab":[["una follia","una locura"],["il comune","el ayuntamiento"],["la zona pedonale","la zona peatonal"],["i commercianti","los comerciantes"],["può darsi","puede ser"],["rimandare","posponer"]],"frasi":[["Non è detto.","No necesariamente."],["Su questo siamo d'accordo.","En eso estamos de acuerdo."],["Cambiamo argomento.","Cambiemos de tema."]]},{"id":"colloquio","lvl":"B2","title":"Un colloquio di lavoro","who":"La dott.ssa Conti","role":"entrevistadora","reg":"Lei","desc":"Entrevista de trabajo para un puesto en una empresa de Turín.","nodes":{"n1":{"it":"Buongiorno, si accomodi. Mi parli un po' di lei.","es":"Buenos días, siéntese. Hábleme un poco de usted.","o":[{"it":"Buongiorno. Mi sono laureat{o} in economia e lavoro da cinque anni nel marketing.","es":"Buenos días. Me licencié en económicas y trabajo desde hace cinco años en marketing.","next":"n2"},{"it":"Buongiorno. Sono un{o} specialista in comunicazione con esperienza internazionale.","es":"Buenos días. Soy especialista en comunicación con experiencia internacional.","next":"n2"},{"it":"Ciao! Allora, io sono uno che lavora tanto.","es":"¡Hola! Pues yo soy alguien que trabaja mucho.","bad":"En una entrevista: Lei, «buongiorno» y un registro formal."}]},"n2":{"it":"Interessante. Perché vorrebbe lavorare con noi?","es":"Interesante. ¿Por qué querría trabajar con nosotros?","o":[{"it":"Perché la vostra azienda è leader nel settore e vorrei crescere professionalmente.","es":"Porque su empresa es líder en el sector y me gustaría crecer profesionalmente.","next":"n3"},{"it":"Ho seguito i vostri progetti e mi piacerebbe contribuire con la mia esperienza.","es":"He seguido sus proyectos y me gustaría contribuir con mi experiencia.","next":"n3"}]},"n3":{"it":"Qual è il suo punto debole?","es":"¿Cuál es su punto débil?","o":[{"it":"A volte sono troppo perfezionista, ma sto imparando a delegare.","es":"A veces soy demasiado perfeccionista, pero estoy aprendiendo a delegar.","next":"n4"},{"it":"Il mio italiano non è ancora perfetto, ma lo sto migliorando ogni giorno.","es":"Mi italiano todavía no es perfecto, pero lo estoy mejorando cada día.","next":"n4"}]},"n4":{"it":"Se dovesse gestire un conflitto con un collega, come si comporterebbe?","es":"Si tuviera que gestionar un conflicto con un compañero, ¿cómo se comportaría?","o":[{"it":"Cercherei di parlarne con calma, prima che il problema diventasse più grande.","es":"Intentaría hablarlo con calma, antes de que el problema se hiciera más grande.","next":"n5"},{"it":"Lo affronterei subito, ascoltando il suo punto di vista.","es":"Lo afrontaría enseguida, escuchando su punto de vista.","next":"n5"},{"it":"Se dovrei gestire un conflitto, parlerei con lui.","es":"Si tuviera que gestionar un conflicto, hablaría con él.","bad":"Tras «se», congiuntivo imperfetto: «se dovessi»."}]},"n5":{"it":"Bene. Ha qualche domanda per noi?","es":"Bien. ¿Tiene alguna pregunta para nosotros?","o":[{"it":"Sì: come sarebbe organizzata una giornata tipo?","es":"Sí: ¿cómo estaría organizada una jornada típica?","next":"n6"},{"it":"Vorrei sapere se è prevista la possibilità di lavorare da remoto.","es":"Me gustaría saber si está prevista la posibilidad de teletrabajar.","next":"n6"}]},"n6":{"it":"Ottima domanda. Le faremo sapere entro la fine della settimana. È stato un piacere.","es":"Muy buena pregunta. Le diremos algo antes de que acabe la semana. Ha sido un placer.","o":[{"it":"Grazie a lei, il piacere è stato mio. Arrivederla.","es":"Gracias a usted, el placer ha sido mío. Hasta luego.","next":"n7"}]},"n7":{"it":"Arrivederla e buona giornata.","es":"Hasta luego y buen día.","o":[]}},"start":"n1","vocab":[["laurearsi","licenciarse"],["il settore","el sector"],["il punto debole","el punto débil"],["delegare","delegar"],["affrontare","afrontar"],["lavorare da remoto","teletrabajar"]],"frasi":[["Mi parli di lei.","Hábleme de usted."],["Le faremo sapere.","Le diremos algo."],["Arrivederla.","Adiós (muy formal)."]]}]}</script>
<script id="data2" type="application/json">{"culture":{"u1":{"t":"Ciao no sirve para todo","b":"*Ciao* es solo para gente a la que tuteas. A un desconocido, a un dependiente o a alguien mayor se le dice *buongiorno* hasta media tarde y *buonasera* después; al despedirte, *arrivederci* (o *arrivederLa*, muy formal). Al presentarse, los italianos se dan la mano y dicen *piacere*; los dos besos llegan con la confianza, y en el norte se tarda más que en el sur."},"u2":{"t":"El ritual del bar","b":"En muchos bares primero se paga en la caja y luego se entrega el *scontrino* al barista. El café se toma de pie en la barra, rápido y más barato que sentado en una mesa, donde puede costar el doble. Pedir *un caffè* es pedir un espresso. El *cappuccino* es cosa de la mañana: pedirlo después de comer delata al turista. Si quieres algo parecido a un café con leche, pide *un caffè macchiato* o *un latte macchiato*."},"u3":{"t":"La familia y la mamma","b":"Muchos jóvenes italianos viven con sus padres hasta los treinta o más, por razones económicas y culturales. Son los famosos *mammoni*. El domingo, la comida en familia es casi sagrada y puede durar toda la tarde. Ojo: *i parenti* son los parientes en general; *i genitori* son solo el padre y la madre."},"u4":{"t":"La hora italiana","b":"En la vida cotidiana se usa el reloj de 12 horas (*le otto di sera*), pero los horarios de trenes, tiendas y oficinas van en formato 24 h (*le 20.00*). Se come antes que en España: la comida hacia las 13.00 y la cena entre las 19.30 y las 21.00 (más tarde en el sur). Muchas tiendas cierran a mediodía, sobre todo fuera de las grandes ciudades."},"u5":{"t":"Moverse por la ciudad","b":"El billete de autobús o tranvía se compra antes de subir: en un *tabaccaio* (la T azul), en un quiosco o con el móvil. Después hay que *timbrare* (validarlo) en la máquina de a bordo; si no, te pueden multar aunque lo hayas comprado. En Milán, el metro es la opción más rápida, y en muchas ciudades el centro histórico es *ZTL*, zona de tráfico limitado."},"u6":{"t":"En el mercado, no se toca","b":"En las fruterías y los mercados no suele tocarse la fruta: se pide al vendedor y él la elige (*Mi dà due etti di...?*). El peso se pide en *etti* (100 g): *un etto di prosciutto*, *mezzo chilo di pane*. En el supermercado sí te sirves tú, pero con los guantes de plástico desechables que hay junto a la báscula."},"u7":{"t":"La casa italiana","b":"Los pisos en alquiler pueden ofrecerse sin cocina, sobre todo en el norte: a veces el inquilino tiene que llevársela. En casi todos los baños hay *bidet*. Al entrar en casa ajena, lo normal es dejarse los zapatos puestos, salvo que te digan lo contrario. Para ventilar se abren *le persiane*, las contraventanas, muy típicas."},"u8":{"t":"La passeggiata y el aperitivo","b":"El *aperitivo* de las 18.30-20.00 es una institución, sobre todo en el norte: pides un spritz o un *analcolico* y a menudo incluye algo de picar o un buffet. En los pueblos sigue viva la *passeggiata* del atardecer por la calle principal: pasear, saludar y dejarse ver. En agosto, el *Ferragosto* (día 15) vacía las ciudades."},"u9":{"t":"Viajar en tren","b":"Hay trenes de alta velocidad (*Frecciarossa*, *Italo*) con asiento asignado y precios variables, y trenes *regionali*, baratos y de precio fijo. Las huelgas (*scioperi*) se anuncian con antelación y siempre se garantizan algunos trenes. En los hoteles se paga aparte la *tassa di soggiorno*, una tasa turística por noche."},"u10":{"t":"Un día cualquiera","b":"La mañana empieza con un desayuno dulce y rápido: café y *cornetto* o galletas. Nada de salado. La moka está en todas las cocinas. Después de comer viene un espresso, nunca un capuchino. En el sur, en verano, la siesta (*il riposino* o *la pennichella*) sigue siendo habitual en las horas de más calor."},"u11":{"t":"Rebajas y tallas","b":"Las rebajas (*i saldi*) empiezan en fechas fijadas por cada región, normalmente a primeros de enero y de julio. Las tallas italianas de ropa de mujer son distintas de las españolas: una 38 española equivale más o menos a una 42 italiana. Al entrar en una tienda pequeña se saluda con un *buongiorno*; si no, se considera de mala educación."},"u12":{"t":"La infancia en Italia","b":"Muchos adultos recuerdan los veranos en casa de *i nonni* o en la *colonia* (campamento de verano). La *Befana*, una bruja buena, trae caramelos a los niños el 6 de enero, y carbón de azúcar a los traviesos. Los dibujos y canciones de *Zecchino d'Oro* forman parte de la memoria colectiva de varias generaciones."},"u13":{"t":"Farmacia y médico de cabecera","b":"La cruz verde iluminada señala una farmacia, y siempre hay una *di turno* abierta por la noche y en festivos. Todo residente tiene un *medico di base* (de cabecera) gratuito. Ojo: el *ticket* sanitario es el copago de pruebas y medicamentos. Si te pones malo en el trabajo, el médico envía el *certificato* directamente por internet."},"u14":{"t":"Títulos y trato","b":"En Italia los títulos importan: a un licenciado se le puede llamar *dottore* o *dottoressa*, y a un abogado, *avvocato*. En el trabajo, el *Lei* es lo normal con los superiores y los clientes hasta que te propongan el tú (*Diamoci del tu!*). El *colloquio* empieza con un apretón de manos firme y suele ser bastante formal."},"u15":{"t":"Las comparaciones y la exageración","b":"Los italianos aman los superlativos: *buonissimo*, *bellissimo*, *stanchissimo*. Es parte del estilo expresivo, igual que los gestos. El famoso gesto de los dedos juntos hacia arriba, moviendo la mano, significa *ma che vuoi?* (¿pero qué quieres?, ¿qué dices?), y no es ofensivo entre amigos. Úsalo con cuidado y solo cuando ya lo domines."},"u16":{"t":"Planes y supersticiones","b":"Para desear suerte antes de un examen o de un proyecto se dice *In bocca al lupo!* y se responde *Crepi!* (no *grazie*). El día de mala suerte es el viernes 17, no el martes 13. Tocar hierro (*toccare ferro*) protege del mal fario, y nunca se brinda con agua."},"u17":{"t":"Las normas de la cocina","b":"La pasta va al dente, no se rompen los espaguetis antes de cocerlos y no se pone queso al pescado. La carbonara lleva *guanciale*, huevo, pecorino y pimienta: nada de nata. Después de la comida, nada de capuchino. Los italianos son muy sensibles a estas reglas: si las respetas, te ganas su simpatía."},"u18":{"t":"Pedir y hacer favores","b":"Para pedir algo con cortesía se usa mucho el condicional: *Mi faresti un favore?*, *Potrebbe...?*. Entre vecinos es normal pedir sal o recoger un paquete. Si te invitan a cenar, se lleva vino, flores o un dulce de la *pasticceria* (las bandejas de pasteles envueltas son un clásico del domingo)."},"u19":{"t":"Ci vado: el italiano económico","b":"Los pronombres *ci* y *ne* aparecen constantemente en la lengua hablada: *Ci vado domani* (voy mañana), *Ne vuoi?* (¿quieres?). Expresiones como *ci vuole* (hace falta), *ce l'ho* (lo tengo) o *me ne vado* (me voy) suenan muy naturales, y usarlas te hace sonar menos a libro de texto."},"u20":{"t":"Antes y después: el tiempo italiano","b":"El *quarto d'ora accademico* permite llegar unos minutos tarde a clase o a una cita informal, pero en el trabajo se espera puntualidad, sobre todo en el norte. En el sur, la noción del tiempo es más flexible. Si alguien dice *arrivo!* (¡ya llego!), puede tardar cinco minutos... o veinte."},"u21":{"t":"Opinar y discutir","b":"Discutir apasionadamente de fútbol, política o comida es casi un deporte nacional, y no significa estar enfadado. Interrumpir es habitual en una conversación animada. Para dar tu opinión con suavidad: *Secondo me...*, *Mi sembra che...*, *Non sono del tutto d'accordo*. Hablar de dinero o de sueldos, en cambio, es más delicado."},"u22":{"t":"Falsos amigos peligrosos","b":"*Burro* es mantequilla, *salire* es subir, *guardare* es mirar, *imbarazzata* es avergonzada (¡no embarazada!), *caldo* es calor y *camera* es habitación. *Subire* es sufrir algo, y *la gamba* es la pierna. Cuando dudes, pregunta: los italianos agradecen el esfuerzo y suelen tomárselo con humor."},"u23":{"t":"Fiabe y leyendas","b":"Las *Fiabe italiane* que recopiló Italo Calvino son un tesoro de cuentos regionales. *Pinocchio*, de Collodi, es mucho más oscuro que la versión de Disney. Los cuentos y las novelas usan el *passato remoto* (*c'era una volta un re che partì...*), un tiempo que en el norte casi no se usa al hablar, pero en el sur sí."},"u24":{"t":"Deseos y monedas","b":"En la Fontana di Trevi se lanza una moneda de espaldas, con la mano derecha por encima del hombro izquierdo, para asegurarse de volver a Roma. Para desear algo se usa mucho *magari!* (¡ojalá!). En Nochevieja se comen lentejas para tener dinero y, por tradición, se lleva ropa interior roja."},"u25":{"t":"Si fuera italiano...","b":"El periodo hipotético es muy frecuente en el habla: *Se fossi in te...* (yo que tú...). En el habla coloquial, muchos italianos usan el imperfecto en lugar del subjuntivo (*se lo sapevo, venivo*), pero en un contexto formal o escrito se espera la forma correcta: *se lo avessi saputo, sarei venuto*."},"u26":{"t":"La información en Italia","b":"Los periódicos más leídos son el *Corriere della Sera* (Milán) y *la Repubblica* (Roma), y existe un diario deportivo de papel rosa: *La Gazzetta dello Sport*. El telediario de la RAI (*TG1*) a las 20.00 es un ritual en muchas casas. *Si dice che...* (se dice que...) introduce rumores y chismes: el *pettegolezzo* es un deporte popular."},"u27":{"t":"Hablar por teléfono","b":"Los italianos contestan al teléfono con *Pronto?*. En las llamadas formales se usa el *Lei* y fórmulas como *Mi passa il dottor Rossi?* o *Le lascio un messaggio*. Los audios de WhatsApp (*vocali*) son muy populares, a veces de varios minutos: un buen ejercicio de comprensión real."},"u28":{"t":"El currículum y la entrevista","b":"En Italia el currículum suele seguir el formato *Europass* y a menudo lleva foto y la autorización para tratar los datos personales al pie. En la entrevista se espera un registro formal (*Lei*) y una cierta modestia. Muchos contratos empiezan siendo de duración determinada (*a tempo determinato*); el objetivo es el indefinido (*a tempo indeterminato*)."},"u29":{"t":"El italiano de verdad","b":"En Italia conviven el italiano estándar y muchos dialectos que son casi otras lenguas: napolitano, siciliano, véneto, milanés... Los acentos regionales son fuertes y cambian las vocales y la entonación. Para entender el italiano real, escucha podcasts, películas con subtítulos en italiano y conversaciones de bar. *Complimenti*, ¡has llegado al final de la línea!"}},"dialogs2":[{"id":"idraulico","lvl":"B1","title":"Al telefono con l'idraulico","who":"Il signor Gatti","role":"fontanero","reg":"Lei","desc":"Tienes una fuga de agua en la cocina y llamas a un fontanero.","nodes":{"n1":{"it":"Pronto, Idraulica Gatti, mi dica.","es":"¿Diga? Fontanería Gatti, dígame.","o":[{"it":"Buongiorno, mi chiamo {nome}. Ho una perdita d'acqua sotto il lavandino della cucina.","es":"Buenos días, me llamo {nome}. Tengo una fuga de agua debajo del fregadero de la cocina.","next":"n2"},{"it":"Buongiorno, avrei bisogno di un idraulico il prima possibile: mi si è allagata la cucina.","es":"Buenos días, necesitaría un fontanero lo antes posible: se me ha inundado la cocina.","next":"n2"},{"it":"Pronto, sono {nome}. Ho una fuga di acqua in cucina.","es":"(¿Diga? Soy {nome}. Tengo una «fuga» de agua en la cocina.)","bad":"«Fuga» en italiano es una huida. Una fuga de agua es «una perdita d'acqua»."}]},"n2":{"it":"Capisco. Ha chiuso il rubinetto centrale dell'acqua?","es":"Entiendo. ¿Ha cerrado la llave de paso general?","o":[{"it":"Sì, l'ho chiuso subito, ma il pavimento è tutto bagnato.","es":"Sí, la he cerrado enseguida, pero el suelo está todo mojado.","next":"n3"},{"it":"No, non so dove sia. Mi può spiegare dove si trova di solito?","es":"No, no sé dónde está. ¿Me puede explicar dónde suele estar?","next":"n3"}]},"n3":{"it":"Va bene. Posso passare domani mattina verso le dieci. Le va bene?","es":"Muy bien. Puedo pasar mañana por la mañana hacia las diez. ¿Le va bien?","o":[{"it":"Non sarebbe possibile oggi pomeriggio? È piuttosto urgente.","es":"¿No sería posible esta tarde? Es bastante urgente.","next":"n4"},{"it":"Domani alle dieci va benissimo, grazie.","es":"Mañana a las diez va perfecto, gracias.","next":"n5"},{"it":"Domani mi va bene, ma non posso prima delle diez.","es":"(Mañana me va bien, pero no puedo antes de las diez.)","bad":"Ojo con el número: en italiano es «dieci», no «diez»."}]},"n4":{"it":"Oggi sono pieno, ma se è un'emergenza posso venire alle sei. C'è però un supplemento di trenta euro.","es":"Hoy lo tengo todo lleno, pero si es una emergencia puedo ir a las seis. Pero hay un suplemento de treinta euros.","o":[{"it":"D'accordo, va bene alle sei. Meglio pagare un po' di più che allagare il vicino di sotto.","es":"De acuerdo, a las seis está bien. Mejor pagar un poco más que inundar al vecino de abajo.","next":"n5"},{"it":"Allora aspetto fino a domani. Il rubinetto è chiuso, quindi posso resistere.","es":"Entonces espero hasta mañana. La llave está cerrada, así que puedo aguantar.","next":"n5"}]},"n5":{"it":"Perfetto. Mi lascia l'indirizzo e un numero di telefono?","es":"Perfecto. ¿Me deja la dirección y un número de teléfono?","o":[{"it":"Certo: via Mazzini 14, terzo piano, citofono {nome}. Il mio numero è questo da cui la sto chiamando.","es":"Claro: calle Mazzini 14, tercer piso, portero automático {nome}. Mi número es este desde el que le llamo.","next":"n6"},{"it":"Sì, abito in via Mazzini 14. Le mando il numero per messaggio, così non sbaglia.","es":"Sí, vivo en la calle Mazzini 14. Le mando el número por mensaje, así no se equivoca.","next":"n6"}]},"n6":{"it":"Benissimo. Ci vediamo dopo, allora. E non si preoccupi: è un lavoro da mezz'ora.","es":"Muy bien. Nos vemos luego, entonces. Y no se preocupe: es un trabajo de media hora.","o":[]}},"vocab":[["la perdita d'acqua","la fuga de agua"],["il lavandino","el fregadero / el lavabo"],["il rubinetto","el grifo / la llave"],["allagare","inundar"],["il citofono","el portero automático"],["il supplemento","el suplemento"]],"frasi":[["Pronto, mi dica.","¿Diga? Dígame."],["Avrei bisogno di...","Necesitaría..."],["Le va bene?","¿Le va bien?"],["Non sarebbe possibile...?","¿No sería posible...?"]],"start":"n1"},{"id":"banca","lvl":"B1","title":"In banca","who":"La signora Ferraro","role":"empleada de banco","reg":"Lei","desc":"Acabas de mudarte a Italia y quieres abrir una cuenta corriente.","nodes":{"n1":{"it":"Buongiorno, prego, si accomodi. Come posso aiutarla?","es":"Buenos días, adelante, siéntese. ¿En qué puedo ayudarle?","o":[{"it":"Buongiorno. Vorrei aprire un conto corrente: mi sono appena trasferit{o} in Italia.","es":"Buenos días. Querría abrir una cuenta corriente: me acabo de trasladar a Italia.","next":"n2"},{"it":"Buongiorno, avrei bisogno di informazioni per aprire un conto.","es":"Buenos días, necesitaría información para abrir una cuenta.","next":"n2"},{"it":"Buongiorno, voglio aprire una conta.","es":"(Buenos días, quiero abrir una «conta».)","bad":"La cuenta bancaria es «il conto» (masculino). «Il conto» también es la cuenta del restaurante."}]},"n2":{"it":"Certamente. Ha con sé un documento d'identità e il codice fiscale?","es":"Por supuesto. ¿Tiene consigo un documento de identidad y el código fiscal?","o":[{"it":"Sì, ecco il passaporto e il codice fiscale.","es":"Sí, aquí tiene el pasaporte y el código fiscal.","next":"n3"},{"it":"Ho il passaporto, ma il codice fiscale non ce l'ho ancora. Dove posso richiederlo?","es":"Tengo el pasaporte, pero todavía no tengo el código fiscal. ¿Dónde puedo solicitarlo?","next":"n2b"}]},"n2b":{"it":"Può richiederlo all'Agenzia delle Entrate: è gratuito e di solito lo rilasciano subito. Poi torni da noi.","es":"Puede solicitarlo en la Agencia Tributaria: es gratuito y normalmente lo dan en el momento. Luego vuelva con nosotros.","o":[{"it":"Perfetto, ci vado oggi stesso. Intanto può spiegarmi che tipi di conto avete?","es":"Perfecto, voy hoy mismo. Mientras tanto, ¿puede explicarme qué tipos de cuenta tienen?","next":"n3"}]},"n3":{"it":"Abbiamo un conto base a due euro al mese e un conto online senza canone. Quale preferisce?","es":"Tenemos una cuenta básica a dos euros al mes y una cuenta online sin comisión de mantenimiento. ¿Cuál prefiere?","o":[{"it":"Quello online, se posso fare tutto dall'app. Ci sono costi per i bonifici?","es":"La online, si puedo hacerlo todo desde la aplicación. ¿Hay costes por las transferencias?","next":"n4"},{"it":"Preferirei il conto base: mi piace poter venire in filiale quando ho dei dubbi.","es":"Preferiría la cuenta básica: me gusta poder venir a la sucursal cuando tengo dudas.","next":"n4"},{"it":"Preferisco quello che costa più barato.","es":"(Prefiero el que «cuesta más barato».)","bad":"Mejor «quello che costa meno» o «quello più economico». «Barato» no existe en italiano."}]},"n4":{"it":"I bonifici online sono gratuiti. Le diamo anche una carta di debito. Vuole attivare l'home banking?","es":"Las transferencias online son gratuitas. Le damos también una tarjeta de débito. ¿Quiere activar la banca online?","o":[{"it":"Sì, grazie. E quanto tempo ci vuole per ricevere la carta?","es":"Sí, gracias. ¿Y cuánto se tarda en recibir la tarjeta?","next":"n5"},{"it":"Volentieri. Posso anche domiciliare lo stipendio su questo conto?","es":"Con gusto. ¿Puedo domiciliar también la nómina en esta cuenta?","next":"n5"}]},"n5":{"it":"Certo. La carta arriva a casa in una settimana circa. Ora le stampo il contratto: legga con calma e firmi qui.","es":"Claro. La tarjeta llega a casa en una semana aproximadamente. Ahora le imprimo el contrato: léalo con calma y firme aquí.","o":[{"it":"Lo leggo subito. Mi scusi, cosa significa «estratto conto»?","es":"Lo leo enseguida. Perdone, ¿qué significa «estratto conto»?","next":"n6"},{"it":"Grazie, firmo qui e qui. È stata molto chiara.","es":"Gracias, firmo aquí y aquí. Ha sido usted muy clara.","next":"n6"}]},"n6":{"it":"L'estratto conto è il riepilogo dei movimenti: lo trova ogni mese nell'app. Benvenut{o} tra i nostri clienti!","es":"El «estratto conto» es el extracto de movimientos: lo encontrará cada mes en la aplicación. ¡Bienvenido/a entre nuestros clientes!","o":[]}},"vocab":[["il conto corrente","la cuenta corriente"],["il codice fiscale","el código fiscal (NIF italiano)"],["il bonifico","la transferencia"],["il canone","la cuota / comisión fija"],["la filiale","la sucursal"],["l'estratto conto","el extracto"],["firmare","firmar"]],"frasi":[["Come posso aiutarla?","¿En qué puedo ayudarle?"],["Ha con sé...?","¿Tiene consigo...?"],["Quanto tempo ci vuole?","¿Cuánto tiempo se tarda?"],["Mi sono appena trasferito.","Me acabo de trasladar."]],"start":"n1"},{"id":"affitto","lvl":"B1","title":"Un appartamento in affitto","who":"Il signor Bruni","role":"propietario","reg":"Lei","desc":"Visitas un piso de alquiler en Bolonia con el propietario.","nodes":{"n1":{"it":"Ecco, questo è il soggiorno. Come vede, è molto luminoso.","es":"Aquí está, este es el salón. Como ve, es muy luminoso.","o":[{"it":"È bellissimo! Quanti metri quadri è l'appartamento in tutto?","es":"¡Es precioso! ¿Cuántos metros cuadrados tiene el piso en total?","next":"n2"},{"it":"Sì, molto luminoso. L'appartamento è arredato?","es":"Sí, muy luminoso. ¿El piso está amueblado?","next":"n2"}]},"n2":{"it":"Sono settanta metri quadri, completamente arredato: due camere, cucina abitabile e un bagno.","es":"Son setenta metros cuadrados, completamente amueblado: dos dormitorios, cocina con comedor y un baño.","o":[{"it":"E l'affitto quant'è? Le spese condominiali sono incluse?","es":"¿Y cuánto es el alquiler? ¿Los gastos de comunidad están incluidos?","next":"n3"},{"it":"Quanto costa l'affitto al mese, spese comprese?","es":"¿Cuánto cuesta el alquiler al mes, gastos incluidos?","next":"n3"},{"it":"Mi piace molto. Quanto costa il alquiler?","es":"(Me gusta mucho. ¿Cuánto cuesta «il alquiler»?)","bad":"El alquiler se dice «l'affitto». Y «affittare» es alquilar una casa."}]},"n3":{"it":"Sono ottocento euro al mese più cinquanta di spese. Chiedo tre mensilità di deposito cauzionale.","es":"Son ochocientos euros al mes más cincuenta de gastos. Pido tres mensualidades de fianza.","o":[{"it":"Tre mesi di deposito mi sembrano tanti. Non potremmo fare due?","es":"Tres meses de fianza me parecen mucho. ¿No podríamos dejarlo en dos?","next":"n4"},{"it":"D'accordo. Che tipo di contratto propone?","es":"De acuerdo. ¿Qué tipo de contrato propone?","next":"n5"}]},"n4":{"it":"Mah... se mi garantisce che resta almeno un anno, possiamo fare due mensilità.","es":"Bueno... si me garantiza que se queda al menos un año, podemos dejarlo en dos mensualidades.","o":[{"it":"Sì, ho un contratto di lavoro a tempo indeterminato qui a Bologna, quindi resto sicuramente.","es":"Sí, tengo un contrato de trabajo indefinido aquí en Bolonia, así que me quedo seguro.","next":"n5"},{"it":"Mi sembra giusto. Le posso mostrare anche la busta paga, se vuole.","es":"Me parece justo. También le puedo enseñar la nómina, si quiere.","next":"n5"}]},"n5":{"it":"Allora facciamo un contratto quattro più quattro, registrato regolarmente. Quando vorrebbe entrare?","es":"Entonces hacemos un contrato de cuatro más cuatro años, registrado como es debido. ¿Cuándo querría entrar?","o":[{"it":"Dal primo del mese prossimo, se per lei va bene.","es":"A partir del día uno del mes que viene, si a usted le va bien.","next":"n6"},{"it":"Il prima possibile: adesso sto in un ostello.","es":"Lo antes posible: ahora estoy en un albergue.","next":"n6"},{"it":"Il prima possibile: adesso sono in un ostello e voglio che mi dà le chiavi subito.","es":"(Lo antes posible: ahora estoy en un albergue y quiero que me «dà» las llaves enseguida.)","bad":"Tras «voglio che» va subjuntivo: «voglio che mi dia le chiavi»."}]},"n6":{"it":"Benissimo. Allora preparo il contratto e ci vediamo giovedì per la firma e le chiavi.","es":"Muy bien. Entonces preparo el contrato y nos vemos el jueves para la firma y las llaves.","o":[]}},"vocab":[["il soggiorno","el salón"],["arredato","amueblado"],["i metri quadri","los metros cuadrados"],["le spese condominiali","los gastos de comunidad"],["il deposito cauzionale","la fianza"],["la mensilità","la mensualidad"],["la busta paga","la nómina"],["a tempo indeterminato","indefinido (contrato)"]],"frasi":[["Quant'è l'affitto?","¿Cuánto es el alquiler?"],["Le spese sono incluse?","¿Los gastos están incluidos?"],["Non potremmo fare...?","¿No podríamos dejarlo en...?"],["Il prima possibile.","Lo antes posible."]],"start":"n1"},{"id":"appuntamento","lvl":"B1","title":"Un primo appuntamento","who":"Matteo","role":"una cita","reg":"tu","desc":"Has quedado con Matteo, al que conociste en un curso de fotografía, para tomar un aperitivo.","nodes":{"n1":{"it":"Ciao! Scusa il ritardo, non trovavo parcheggio. È da tanto che aspetti?","es":"¡Hola! Perdona el retraso, no encontraba aparcamiento. ¿Llevas mucho rato esperando?","o":[{"it":"Ciao! No, tranquillo, sono arrivat{o} cinque minuti fa.","es":"¡Hola! No, tranquilo, he llegado hace cinco minutos.","next":"n2"},{"it":"Figurati, ne ho approfittato per guardare il tramonto.","es":"No pasa nada, he aprovechado para ver el atardecer.","next":"n2"},{"it":"Non ti preoccupare, sono qui da cinque minuti fa.","es":"(No te preocupes, estoy aquí «desde hace cinco minutos fa».)","bad":"«Da» y «fa» no se combinan: «sono qui da cinque minuti» o «sono arrivato cinque minuti fa»."}]},"n2":{"it":"Allora, cosa prendi? Qui fanno uno spritz buonissimo.","es":"Bueno, ¿qué tomas? Aquí hacen un spritz buenísimo.","o":[{"it":"Allora vada per lo spritz! E qualcosa da mangiare?","es":"¡Pues venga, un spritz! ¿Y algo de comer?","next":"n3"},{"it":"Io prendo un analcolico, domani mi alzo presto.","es":"Yo me tomo uno sin alcohol, mañana me levanto temprano.","next":"n3"}]},"n3":{"it":"Certo, l'aperitivo qui è ricchissimo. Senti, ma da quanto tempo fai fotografia?","es":"Claro, el aperitivo aquí es muy abundante. Oye, ¿y desde cuándo haces fotografía?","o":[{"it":"Da un paio d'anni. Ho cominciato durante un viaggio in Islanda e non ho più smesso.","es":"Desde hace un par de años. Empecé durante un viaje a Islandia y ya no lo he dejado.","next":"n4"},{"it":"Da poco, in realtà. Mi sono iscritt{o} al corso proprio per conoscere gente nuova.","es":"Desde hace poco, la verdad. Me apunté al curso precisamente para conocer gente nueva.","next":"n4"}]},"n4":{"it":"Che bello! Io invece fotografo soprattutto la città di notte. Ti andrebbe di fare un giro insieme qualche sera?","es":"¡Qué bien! Yo en cambio fotografío sobre todo la ciudad de noche. ¿Te apetecería dar una vuelta juntos alguna noche?","o":[{"it":"Mi piacerebbe molto! Magari sabato prossimo?","es":"¡Me encantaría! ¿Quizás el sábado que viene?","next":"n5"},{"it":"Volentieri, ma questa settimana sono pienissim{o}. Ci sentiamo la prossima?","es":"Con gusto, pero esta semana estoy hasta arriba. ¿Hablamos la que viene?","next":"n5"},{"it":"Sì, mi piacerebbe! Ti scrivo e quedamos.","es":"(¡Sí, me gustaría! Te escribo y «quedamos».)","bad":"«Quedar» no existe en italiano. Se dice «ci mettiamo d'accordo» o «ci vediamo». Y para mostrar ilusión: «Non vedo l'ora!»."}]},"n5":{"it":"Perfetto, ti scrivo io. Posso offrirti un altro giro?","es":"Perfecto, ya te escribo yo. ¿Te puedo invitar a otra ronda?","o":[{"it":"Grazie, ma stavolta offro io: tu hai pagato il primo.","es":"Gracias, pero esta vez invito yo: tú has pagado la primera.","next":"n6"},{"it":"Facciamo alla romana, dai.","es":"Pagamos a medias, venga.","next":"n6"}]},"n6":{"it":"Come vuoi! Comunque sono proprio contento di essere uscito con te stasera.","es":"¡Como quieras! En cualquier caso, me alegro mucho de haber salido contigo esta noche.","o":[]}},"vocab":[["il parcheggio","el aparcamiento"],["il tramonto","el atardecer"],["l'analcolico","la bebida sin alcohol"],["fare un giro","dar una vuelta"],["offrire","invitar (pagar)"],["pagare alla romana","pagar a medias"]],"frasi":[["È da tanto che aspetti?","¿Llevas mucho esperando?"],["Vada per...!","¡Venga, pues...!"],["Ti andrebbe di...?","¿Te apetecería...?"],["Non vedo l'ora!","¡Estoy deseando!"]],"start":"n1"},{"id":"medico","lvl":"B1","title":"Dal medico di base","who":"La dottoressa Neri","role":"médica de cabecera","reg":"Lei","desc":"Llevas varios días con fiebre y tos y vas a tu médica de cabecera.","nodes":{"n1":{"it":"Buongiorno, si sieda pure. Cosa la porta qui?","es":"Buenos días, siéntese. ¿Qué le trae por aquí?","o":[{"it":"Buongiorno, dottoressa. Da tre giorni ho la febbre e una tosse molto forte.","es":"Buenos días, doctora. Desde hace tres días tengo fiebre y una tos muy fuerte.","next":"n2"},{"it":"Non mi sento bene: ho mal di gola, la tosse e sono stanchissim{o}.","es":"No me encuentro bien: me duele la garganta, tengo tos y estoy agotado/a.","next":"n2"},{"it":"Buongiorno, ho la gripe da tre giorni.","es":"(Buenos días, tengo la «gripe» desde hace tres días.)","bad":"«Gripe» no existe en italiano: la gripe es «l'influenza», y un resfriado, «il raffreddore»."}]},"n2":{"it":"Quanto ha di febbre? E la tosse è secca o grassa?","es":"¿Cuánta fiebre tiene? ¿Y la tos es seca o con flemas?","o":[{"it":"Ieri sera avevo trentotto e mezzo. La tosse è secca, soprattutto di notte.","es":"Anoche tenía treinta y ocho y medio. La tos es seca, sobre todo por la noche.","next":"n3"},{"it":"Più o meno trentotto. La tosse è grassa e mi fa male il petto quando tossisco.","es":"Más o menos treinta y ocho. La tos es con flemas y me duele el pecho cuando toso.","next":"n3"}]},"n3":{"it":"Vediamo. Respiri profondamente... Ancora... Bene. Prende qualche farmaco?","es":"A ver. Respire hondo... Otra vez... Bien. ¿Toma algún medicamento?","o":[{"it":"Solo la tachipirina quando la febbre sale. Sono allergic{o} alla penicillina.","es":"Solo paracetamol cuando sube la fiebre. Soy alérgico/a a la penicilina.","next":"n4"},{"it":"No, nessun farmaco, e non ho allergie.","es":"No, ningún medicamento, y no tengo alergias.","next":"n4"}]},"n4":{"it":"I polmoni sono puliti. È un'influenza: deve stare a riposo almeno quattro o cinque giorni.","es":"Los pulmones están limpios. Es una gripe: tiene que hacer reposo al menos cuatro o cinco días.","o":[{"it":"Mi può fare un certificato per il lavoro?","es":"¿Me puede hacer un justificante para el trabajo?","next":"n5"},{"it":"Devo prendere degli antibiotici?","es":"¿Tengo que tomar antibióticos?","next":"n4b"},{"it":"Mi può dare una receta per il lavoro?","es":"(¿Me puede dar una «receta» para el trabajo?)","bad":"Para el trabajo se pide «il certificato medico». «La ricetta» es la receta de medicamentos (o de cocina)."}]},"n4b":{"it":"No, per l'influenza gli antibiotici non servono. Continui con la tachipirina e beva molta acqua.","es":"No, para la gripe los antibióticos no sirven. Siga con el paracetamol y beba mucha agua.","o":[{"it":"Capito. Mi serve anche il certificato per il lavoro, per favore.","es":"Entendido. Necesito también el justificante para el trabajo, por favor.","next":"n5"}]},"n5":{"it":"Certo, le mando il certificato online all'INPS. Se tra cinque giorni la febbre non passa, torni da me.","es":"Claro, le envío el certificado por internet al INPS. Si dentro de cinco días no se le pasa la fiebre, vuelva a verme.","o":[{"it":"Grazie mille, dottoressa. Ci vediamo, spero di no!","es":"Muchas gracias, doctora. Nos vemos... ¡espero que no!","next":"n6"},{"it":"Perfetto, grazie. Devo pagare qualcosa?","es":"Perfecto, gracias. ¿Tengo que pagar algo?","next":"n6"}]},"n6":{"it":"Niente, è tutto coperto dal Servizio Sanitario. Si riguardi e buona guarigione!","es":"Nada, todo lo cubre el Servicio Sanitario. ¡Cuídese y que se mejore!","o":[]}},"vocab":[["il medico di base","el médico de cabecera"],["la tosse secca / grassa","la tos seca / con flemas"],["il mal di gola","el dolor de garganta"],["l'influenza","la gripe"],["il certificato medico","el justificante médico"],["la tachipirina","el paracetamol (marca común)"],["il petto","el pecho"]],"frasi":[["Cosa la porta qui?","¿Qué le trae por aquí?"],["Da tre giorni ho la febbre.","Desde hace tres días tengo fiebre."],["Si riguardi!","¡Cuídese!"],["Buona guarigione!","¡Que se mejore!"]],"start":"n1"},{"id":"bagaglio","lvl":"B1","title":"Il bagaglio smarrito","who":"L'addetto","role":"empleado del aeropuerto","reg":"Lei","desc":"Acabas de aterrizar en Fiumicino y tu maleta no ha salido en la cinta.","nodes":{"n1":{"it":"Buonasera, ufficio bagagli smarriti. Mi dica.","es":"Buenas noches, oficina de equipajes perdidos. Dígame.","o":[{"it":"Buonasera, la mia valigia non è arrivata. Ero sul volo da Madrid delle diciotto.","es":"Buenas noches, mi maleta no ha llegado. Venía en el vuelo de Madrid de las seis de la tarde.","next":"n2"},{"it":"Buonasera, ho aspettato al nastro per un'ora ma il mio bagaglio non è uscito.","es":"Buenas noches, he esperado en la cinta una hora pero mi equipaje no ha salido.","next":"n2"},{"it":"Buonasera, ho perduto la mia maleta.","es":"(Buenas noches, he perdido mi «maleta».)","bad":"La maleta es «la valigia» o «il bagaglio». «Maleta» no existe en italiano."}]},"n2":{"it":"Mi dispiace. Ha la carta d'imbarco e lo scontrino del bagaglio?","es":"Lo siento. ¿Tiene la tarjeta de embarque y el resguardo del equipaje?","o":[{"it":"Sì, eccoli. Il codice è attaccato alla carta d'imbarco.","es":"Sí, aquí los tiene. El código está pegado en la tarjeta de embarque.","next":"n3"},{"it":"Ho la carta d'imbarco sul telefono, ma lo scontrino non lo trovo...","es":"Tengo la tarjeta de embarque en el móvil, pero el resguardo no lo encuentro...","next":"n3"}]},"n3":{"it":"Va bene. Mi può descrivere la valigia?","es":"Muy bien. ¿Me puede describir la maleta?","o":[{"it":"È una valigia rigida, blu scuro, media, con un nastro arancione sulla maniglia.","es":"Es una maleta rígida, azul oscuro, mediana, con una cinta naranja en el asa.","next":"n4"},{"it":"È grande, nera, di stoffa, con le ruote. Purtroppo è uguale a mille altre.","es":"Es grande, negra, de tela, con ruedas. Por desgracia es igual que otras mil.","next":"n4"}]},"n4":{"it":"Dal sistema risulta che è rimasta a Madrid. Arriverà con il volo di domani mattina.","es":"Según el sistema, se ha quedado en Madrid. Llegará en el vuelo de mañana por la mañana.","o":[{"it":"Me la potete consegnare in albergo? Domani ho una riunione e non ho niente da mettermi.","es":"¿Me la pueden entregar en el hotel? Mañana tengo una reunión y no tengo nada que ponerme.","next":"n5"},{"it":"E nel frattempo come faccio? Ho tutto lì dentro, anche le medicine.","es":"¿Y mientras tanto qué hago? Lo tengo todo ahí dentro, incluso las medicinas.","next":"n5"},{"it":"Non è possibile! Esijo una soluzione subito!","es":"(¡No es posible! «Esijo» una solución ya.)","bad":"«Exigir» es «esigere»: «Esigo una soluzione». Aunque, con educación, se consigue más: «Vorrei una soluzione»."}]},"n5":{"it":"Certo, la consegniamo all'indirizzo che ci indica. Può anche comprare il necessario: la compagnia rimborsa le spese di prima necessità, con gli scontrini.","es":"Claro, se la entregamos en la dirección que nos indique. También puede comprar lo necesario: la compañía reembolsa los gastos de primera necesidad, con los tiques.","o":[{"it":"Perfetto, allora conservo tutti gli scontrini. L'albergo è in via Cavour 30.","es":"Perfecto, entonces guardo todos los tiques. El hotel está en la calle Cavour 30.","next":"n6"},{"it":"Meno male. Mi lascia un numero per seguire la pratica?","es":"Menos mal. ¿Me deja un número para hacer el seguimiento del expediente?","next":"n6"}]},"n6":{"it":"Ecco il numero della pratica: può seguirla anche online. Mi scusi ancora per il disagio.","es":"Aquí tiene el número de expediente: también puede seguirlo por internet. Disculpe de nuevo las molestias.","o":[]}},"vocab":[["il bagaglio smarrito","el equipaje perdido"],["il nastro","la cinta (transportadora)"],["la carta d'imbarco","la tarjeta de embarque"],["la maniglia","el asa"],["rimborsare","reembolsar"],["la pratica","el expediente / el trámite"],["il disagio","la molestia / el inconveniente"]],"frasi":[["Dal sistema risulta che...","Según el sistema..."],["Nel frattempo come faccio?","¿Y mientras tanto qué hago?"],["Meno male.","Menos mal."],["Mi scusi per il disagio.","Disculpe las molestias."]],"start":"n1"},{"id":"meccanico","lvl":"B1","title":"Dal meccanico","who":"Beppe","role":"mecánico","reg":"Lei","desc":"Tu coche hace un ruido extraño y lo llevas a un taller.","nodes":{"n1":{"it":"Buongiorno! Che problema ha la macchina?","es":"¡Buenos días! ¿Qué problema tiene el coche?","o":[{"it":"Buongiorno. Quando freno sento un rumore strano, come un fischio.","es":"Buenos días. Cuando freno oigo un ruido extraño, como un pitido.","next":"n2"},{"it":"Da qualche giorno la macchina fa fatica a partire la mattina.","es":"Desde hace unos días al coche le cuesta arrancar por la mañana.","next":"n2b"}]},"n2":{"it":"Probabilmente sono le pastiglie dei freni. Quanti chilometri ha fatto?","es":"Probablemente son las pastillas de freno. ¿Cuántos kilómetros tiene?","o":[{"it":"Circa sessantamila. Non le ho mai cambiate.","es":"Unos sesenta mil. Nunca las he cambiado.","next":"n3"},{"it":"Non lo so di preciso, è una macchina usata. Lo controllo sul cruscotto.","es":"No lo sé exactamente, es un coche de segunda mano. Lo miro en el salpicadero.","next":"n3"}]},"n2b":{"it":"Potrebbe essere la batteria, con il freddo succede spesso. Gliela controllo subito.","es":"Podría ser la batería, con el frío pasa a menudo. Se la reviso enseguida.","o":[{"it":"Grazie. Già che c'è, può controllare anche i freni? Fanno un rumore strano.","es":"Gracias. Ya que está, ¿puede revisar también los frenos? Hacen un ruido raro.","next":"n3"}]},"n3":{"it":"Allora, le pastiglie sono da cambiare. Tra pezzi e manodopera sono centoventi euro.","es":"Bueno, hay que cambiar las pastillas. Entre piezas y mano de obra son ciento veinte euros.","o":[{"it":"Va bene. Per quando sarebbe pronta?","es":"Muy bien. ¿Para cuándo estaría listo?","next":"n4"},{"it":"Mi sembra un po' caro. È proprio necessario farlo subito?","es":"Me parece un poco caro. ¿Es realmente necesario hacerlo ya?","next":"n3b"},{"it":"D'accordo, ma mi fa una factura?","es":"(De acuerdo, pero ¿me hace una «factura»?)","bad":"La factura es «la fattura», con doble t."}]},"n3b":{"it":"Guardi, con i freni non si scherza. Se aspetta, rischia di rovinare anche i dischi, e allora spende il triplo.","es":"Mire, con los frenos no se juega. Si espera, corre el riesgo de estropear también los discos, y entonces gastará el triple.","o":[{"it":"Ha ragione, meglio non rischiare. Proceda pure.","es":"Tiene razón, mejor no arriesgarse. Adelante.","next":"n4"}]},"n4":{"it":"Me la lasci qui: gliela faccio trovare pronta domani alle cinque.","es":"Déjemelo aquí, mañana a las cinco se lo tengo listo.","o":[{"it":"Perfetto. Mi può chiamare quando ha finito?","es":"Perfecto. ¿Me puede llamar cuando haya terminado?","next":"n5"},{"it":"Domani alle cinque non riesco. Posso passare sabato mattina?","es":"Mañana a las cinco no puedo. ¿Puedo pasar el sábado por la mañana?","next":"n5"}]},"n5":{"it":"Nessun problema. Mi lascia le chiavi e un numero di telefono?","es":"Ningún problema. ¿Me deja las llaves y un número de teléfono?","o":[{"it":"Ecco le chiavi. Le scrivo il numero qui sul foglio.","es":"Aquí tiene las llaves. Le escribo el número aquí en la hoja.","next":"n6"}]},"n6":{"it":"Grazie. Stia tranquill{o}, la sua macchina è in buone mani!","es":"Gracias. Quédese tranquilo/a, ¡su coche está en buenas manos!","o":[]}},"vocab":[["frenare","frenar"],["il fischio","el pitido"],["le pastiglie dei freni","las pastillas de freno"],["il cruscotto","el salpicadero"],["la manodopera","la mano de obra"],["la fattura","la factura"],["rovinare","estropear"]],"frasi":[["Fa fatica a partire.","Le cuesta arrancar."],["Già che c'è...","Ya que está..."],["Con i freni non si scherza.","Con los frenos no se juega."],["È in buone mani.","Está en buenas manos."]],"start":"n1"},{"id":"reso","lvl":"B1","title":"Un reso al negozio","who":"La commessa","role":"dependienta","reg":"Lei","desc":"Compraste unos zapatos que te hacen daño y quieres devolverlos.","nodes":{"n1":{"it":"Buongiorno, posso esserle utile?","es":"Buenos días, ¿puedo ayudarle?","o":[{"it":"Buongiorno. La settimana scorsa ho comprato queste scarpe, ma mi fanno male. Vorrei restituirle.","es":"Buenos días. La semana pasada compré estos zapatos, pero me hacen daño. Querría devolverlos.","next":"n2"},{"it":"Sì, grazie. Vorrei cambiare queste scarpe con un numero più grande.","es":"Sí, gracias. Querría cambiar estos zapatos por un número más grande.","next":"n2"}]},"n2":{"it":"Ha lo scontrino? E le ha già indossate fuori?","es":"¿Tiene el tique? ¿Y ya se los ha puesto en la calle?","o":[{"it":"Ecco lo scontrino. Le ho provate solo in casa, sul tappeto.","es":"Aquí tiene el tique. Solo me los he probado en casa, sobre la alfombra.","next":"n3"},{"it":"Lo scontrino ce l'ho. Le ho messe una volta sola, per un'ora.","es":"El tique lo tengo. Me los he puesto solo una vez, durante una hora.","next":"n3"},{"it":"Sì, ecco il tíquet.","es":"(Sí, aquí tiene el «tíquet».)","bad":"El tique de compra es «lo scontrino». «Il ticket» en Italia es otra cosa (por ejemplo, el copago sanitario)."}]},"n3":{"it":"Allora, non possiamo fare il rimborso in contanti, ma le possiamo fare un buono o un cambio.","es":"Bien, no podemos devolverle el dinero en efectivo, pero le podemos hacer un vale o un cambio.","o":[{"it":"Peccato. Ma per legge non avrei diritto al rimborso?","es":"Qué pena. ¿Pero por ley no tendría derecho al reembolso?","next":"n4"},{"it":"Va bene, allora le cambio con un numero in più, se le avete.","es":"Bien, entonces los cambio por un número más, si los tienen.","next":"n5"}]},"n4":{"it":"Il diritto al rimborso c'è solo se il prodotto è difettoso. Se vuole, però, il buono vale un anno.","es":"El derecho al reembolso solo existe si el producto es defectuoso. Pero, si quiere, el vale es válido un año.","o":[{"it":"Capisco. Allora preferisco provare un numero in più.","es":"Entiendo. Entonces prefiero probarme un número más.","next":"n5"},{"it":"D'accordo, prendo il buono: tornerò con calma a Natale.","es":"De acuerdo, me quedo el vale: volveré con calma en Navidad.","next":"n6"}]},"n5":{"it":"Ecco il quarantuno. Come le stanno?","es":"Aquí tiene el cuarenta y uno. ¿Qué tal le quedan?","o":[{"it":"Molto meglio, sono comodissime. Le prendo!","es":"Mucho mejor, son comodísimos. ¡Me los quedo!","next":"n6"},{"it":"Mi stanno un po' larghe, ma con una soletta andranno bene.","es":"Me quedan un poco grandes, pero con una plantilla irán bien.","next":"n6"}]},"n6":{"it":"Perfetto. Le serve un sacchetto? Sono dieci centesimi.","es":"Perfecto. ¿Necesita una bolsa? Son diez céntimos.","o":[]}},"vocab":[["restituire","devolver"],["lo scontrino","el tique de compra"],["il rimborso","el reembolso"],["il buono","el vale"],["difettoso","defectuoso"],["la soletta","la plantilla (del zapato)"],["il sacchetto","la bolsa"]],"frasi":[["Posso esserle utile?","¿Puedo ayudarle?"],["Mi fanno male.","Me hacen daño."],["Come le stanno?","¿Qué tal le quedan?"],["Le prendo!","¡Me los quedo!"]],"start":"n1"},{"id":"litigio","lvl":"B2","title":"Una discussione tra amici","who":"Davide","role":"tu amigo","reg":"tu","desc":"Davide está enfadado porque no fuiste a su fiesta de cumpleaños ni le avisaste.","nodes":{"n1":{"it":"Ah, allora sei viv{o}! Sabato ti ho aspettato tutta la sera, sai?","es":"¡Ah, así que estás vivo/a! El sábado te esperé toda la noche, ¿sabes?","o":[{"it":"Hai ragione, scusami. Avrei dovuto avvisarti, è stato un brutto gesto.","es":"Tienes razón, perdóname. Debería haberte avisado, ha sido un feo detalle.","next":"n2"},{"it":"Lo so, lo so... Lasciami spiegare, per favore.","es":"Lo sé, lo sé... Déjame explicarte, por favor.","next":"n2"},{"it":"Dai, non esagerare, era solo una festa.","es":"Venga, no exageres, era solo una fiesta.","bad":"Quitarle importancia empeora la discusión. Mejor reconocer el error: «Hai ragione, scusami»."}]},"n2":{"it":"Spiegare cosa? Bastava un messaggio. Mi sono sentito preso in giro.","es":"¿Explicar qué? Bastaba un mensaje. Me he sentido tomado por tonto.","o":[{"it":"Mi è capitato un imprevisto in famiglia e il telefono era scarico. Non è una scusa, però.","es":"Me surgió un imprevisto familiar y tenía el móvil sin batería. Aunque no es excusa.","next":"n3"},{"it":"Capisco che tu ci sia rimasto male. Al posto tuo, sarei arrabbiat{o} anch'io.","es":"Entiendo que te haya sentado mal. En tu lugar, yo también estaría enfadado/a.","next":"n3"},{"it":"Capisco che sei rimasto male, ma ho avuto un problema.","es":"(Entiendo que «te has quedado mal», pero he tenido un problema.)","bad":"Después de «capisco che» con valoración, lo natural es el subjuntivo: «capisco che tu ci sia rimasto male»."}]},"n3":{"it":"Un imprevisto? Potevi dirmelo il giorno dopo, invece di sparire per una settimana.","es":"¿Un imprevisto? Podías habérmelo dicho al día siguiente, en vez de desaparecer una semana.","o":[{"it":"Hai ragione anche su questo. Mi vergognavo e ho continuato a rimandare.","es":"Tienes razón también en eso. Me daba vergüenza y lo fui dejando para más tarde.","next":"n4"},{"it":"È vero. Il fatto è che non sapevo come affrontare la cosa, e ho sbagliato.","es":"Es verdad. El caso es que no sabía cómo afrontarlo, y me equivoqué.","next":"n4"}]},"n4":{"it":"Va be'... Almeno lo ammetti. Ma ci tenevo davvero che ci fossi.","es":"Bueno... Por lo menos lo admites. Pero de verdad me importaba que estuvieras.","o":[{"it":"Lo so, e mi dispiace tantissimo. Lascia che mi faccia perdonare: sabato ti porto a cena io.","es":"Lo sé, y lo siento muchísimo. Déjame compensártelo: el sábado te invito yo a cenar.","next":"n5"},{"it":"Se potessi tornare indietro, verrei di corsa. Posso rimediare in qualche modo?","es":"Si pudiera volver atrás, iría corriendo. ¿Puedo arreglarlo de alguna manera?","next":"n5"},{"it":"Se potrei tornare indietro, verrei.","es":"(Si «podría» volver atrás, iría.)","bad":"Tras «se» va congiuntivo imperfetto: «se potessi»."}]},"n5":{"it":"Mmm... va bene, ma scelgo io il ristorante. E paghi anche il dolce!","es":"Mmm... vale, pero elijo yo el restaurante. ¡Y pagas también el postre!","o":[{"it":"Affare fatto! E stavolta il telefono lo carico, promesso.","es":"¡Trato hecho! Y esta vez cargo el móvil, prometido.","next":"n6"},{"it":"Te lo sei meritato. Scegli pure il posto più caro della città.","es":"Te lo has ganado. Elige el sitio más caro de la ciudad, si quieres.","next":"n6"}]},"n6":{"it":"Ecco, così mi piaci. Dai, vieni qua: un abbraccio e non se ne parla più.","es":"Así me gusta. Venga, ven aquí: un abrazo y no se hable más.","o":[]}},"vocab":[["avvisare","avisar"],["prendere in giro","tomar el pelo / burlarse"],["l'imprevisto","el imprevisto"],["rimanerci male","sentarle mal a alguien"],["rimandare","aplazar"],["rimediare","arreglarlo / remediar"],["farsi perdonare","hacerse perdonar"]],"frasi":[["Avrei dovuto avvisarti.","Debería haberte avisado."],["Non è una scusa, però.","Aunque no es excusa."],["Al posto tuo...","En tu lugar..."],["Affare fatto!","¡Trato hecho!"],["Non se ne parla più.","No se hable más."]],"start":"n1"},{"id":"comune","lvl":"B2","title":"All'anagrafe del Comune","who":"Il funzionario","role":"funcionario del ayuntamiento","reg":"Lei","desc":"Vas al ayuntamiento a pedir la residencia y el documento de identidad italiano.","nodes":{"n1":{"it":"Il prossimo! Buongiorno, per cosa è qui?","es":"¡El siguiente! Buenos días, ¿a qué viene?","o":[{"it":"Buongiorno. Vorrei richiedere la residenza: mi sono trasferit{o} qui per lavoro a settembre.","es":"Buenos días. Querría solicitar la residencia: me trasladé aquí por trabajo en septiembre.","next":"n2"},{"it":"Buongiorno, ho preso appuntamento online per l'iscrizione anagrafica.","es":"Buenos días, he pedido cita por internet para el empadronamiento.","next":"n2"}]},"n2":{"it":"È cittadino dell'Unione Europea? Allora mi servono documento, codice fiscale, contratto di lavoro e contratto d'affitto registrato.","es":"¿Es ciudadano de la Unión Europea? Entonces necesito documento, código fiscal, contrato de trabajo y contrato de alquiler registrado.","o":[{"it":"Ecco tutto. Il contratto d'affitto è registrato, c'è il timbro dell'Agenzia delle Entrate.","es":"Aquí está todo. El contrato de alquiler está registrado, lleva el sello de la Agencia Tributaria.","next":"n3"},{"it":"Ho tutto tranne il contratto d'affitto: il proprietario non me l'ha ancora dato registrato.","es":"Lo tengo todo excepto el contrato de alquiler: el propietario todavía no me lo ha dado registrado.","next":"n2b"},{"it":"Ecco tutto. Ah, mi serve anche il carnet di identità?","es":"(Aquí está todo. Ah, ¿también necesito el «carnet» de identidad?)","bad":"El DNI italiano es «la carta d'identità» (hoy, «carta d'identità elettronica», CIE)."}]},"n2b":{"it":"Senza il contratto registrato non posso procedere, mi dispiace. Basta anche la ricevuta di registrazione.","es":"Sin el contrato registrado no puedo seguir, lo siento. También vale el justificante de registro.","o":[{"it":"Capisco. Se me lo faccio mandare per email adesso, potrebbe accettarlo?","es":"Entiendo. Si hago que me lo manden por correo ahora, ¿podría aceptarlo?","next":"n3"}]},"n3":{"it":"Va bene. Nei prossimi quarantacinque giorni passerà la polizia municipale a verificare che lei abiti davvero all'indirizzo indicato.","es":"De acuerdo. En los próximos cuarenta y cinco días pasará la policía municipal a comprobar que usted vive de verdad en la dirección indicada.","o":[{"it":"E se quando passano io sono al lavoro? Devo essere in casa per forza?","es":"¿Y si cuando pasan estoy en el trabajo? ¿Tengo que estar en casa obligatoriamente?","next":"n4"},{"it":"D'accordo. Il mio nome è sul citofono, quindi non dovrebbero esserci problemi.","es":"De acuerdo. Mi nombre está en el portero automático, así que no debería haber problemas.","next":"n4"}]},"n4":{"it":"Se non la trovano, le lasciano un avviso e potrà chiamare per fissare un nuovo controllo.","es":"Si no le encuentran, le dejan un aviso y podrá llamar para concertar un nuevo control.","o":[{"it":"Perfetto. Una volta ottenuta la residenza, posso fare subito la carta d'identità?","es":"Perfecto. Una vez obtenida la residencia, ¿puedo hacerme enseguida el documento de identidad?","next":"n5"},{"it":"Benissimo. Nel frattempo mi può rilasciare un certificato di avvenuta richiesta?","es":"Muy bien. Mientras tanto, ¿me puede expedir un justificante de la solicitud?","next":"n5"}]},"n5":{"it":"Sì. Per la carta d'identità elettronica deve prenotare online: porti una foto tessera e ventidue euro.","es":"Sí. Para el documento de identidad electrónico tiene que pedir cita por internet: traiga una foto de carné y veintidós euros.","o":[{"it":"Grazie, è stato molto chiaro. Non pensavo che fosse così semplice.","es":"Gracias, ha sido usted muy claro. No pensaba que fuera tan sencillo.","next":"n6"},{"it":"La ringrazio. Speravo che si potesse fare tutto oggi, ma pazienza.","es":"Se lo agradezco. Esperaba que se pudiera hacer todo hoy, pero paciencia.","next":"n6"}]},"n6":{"it":"Si figuri. Arrivederci e benvenut{o} in città!","es":"No hay de qué. ¡Adiós y bienvenido/a a la ciudad!","o":[]}},"vocab":[["l'anagrafe","el registro civil / padrón"],["la residenza","la residencia / el empadronamiento"],["il timbro","el sello"],["la ricevuta","el justificante / el recibo"],["la polizia municipale","la policía municipal"],["l'avviso","el aviso"],["la foto tessera","la foto de carné"],["rilasciare","expedir"]],"frasi":[["Per cosa è qui?","¿A qué viene?"],["Tranne...","Excepto..."],["Non pensavo che fosse così semplice.","No pensaba que fuera tan sencillo."],["Si figuri.","No hay de qué."]],"start":"n1"},{"id":"condominio
