verde.","Final de mes y estoy sin blanca."],["non avere peli sulla lingua","no tener pelos en la lengua","Mia nonna non ha peli sulla lingua.","Mi abuela no tiene pelos en la lengua."],["prendere in giro","tomar el pelo","Mi stai prendendo in giro?","¿Me estás tomando el pelo?"],["fare una figuraccia","hacer el ridículo","Ho fatto una figuraccia alla festa.","Hice el ridículo en la fiesta."],["acqua in bocca","punto en boca","È un segreto: acqua in bocca!","Es un secreto: ¡punto en boca!"],["avere un diavolo per capello","estar de muy mala leche","Oggi il capo ha un diavolo per capello.","Hoy el jefe está de muy mala leche."],["cadere dalle nuvole","quedarse de piedra","Quando l'ho saputo, sono caduto dalle nuvole.","Cuando me enteré, me quedé de piedra."],["in quattro e quattr'otto","en un santiamén","L'ha fatto in quattro e quattr'otto.","Lo hizo en un santiamén."],["non vedere l'ora","estar deseando","Non vedo l'ora che arrivi l'estate.","Estoy deseando que llegue el verano."],["meglio tardi che mai","más vale tarde que nunca","Sei arrivato! Meglio tardi che mai.","¡Has llegado! Más vale tarde que nunca."],["avere la testa fra le nuvole","estar en las nubes","Oggi hai la testa fra le nuvole.","Hoy estás en las nubes."],["essere in gamba","ser muy capaz / un crack","La nuova collega è in gamba.","La nueva compañera es un crack."]]}],"grammar":[{"id":"a1-1","lvl":"A1","title":"Essere y pronombres sujeto","sub":"Ser, estar y quién hace la acción","body":"Como en español, el pronombre sujeto suele omitirse: el verbo ya indica la persona. *Sono di Madrid* = Soy de Madrid.\n\n|Persona|essere|Español\n|io|sono|soy / estoy\n|tu|sei|eres / estás\n|lui / lei / Lei|è|es / está\n|noi|siamo|somos / estamos\n|voi|siete|sois / estáis\n|loro|sono|son / están\n\n**Lei** (con mayúscula en la escritura) es el «usted» italiano y se conjuga en 3.ª persona: *Lei è molto gentile*. Para «ustedes» se usa **voi** casi siempre.\n\nUna gran diferencia con el español: **essere** cubre también muchos usos de «estar»: estados (*sono stanco*), ubicación (*sono a casa*, *il libro è sul tavolo*). **Stare** se reserva para expresiones fijas: *come stai?*, *sto bene*, *stare zitto*, y para *stare + gerundio*.\n\n> Ojo con el acento: **è** = es · **e** = y. *C'è* = hay.","err":["«Estoy cansado» es *sono stanco*, no *sto stanco*.","«Soy profesor» va sin artículo, como en español: *sono insegnante*.","*Io sono* y *loro sono* tienen la misma forma: el contexto lo aclara."],"ex":[{"t":"gap","q":"Io ___ spagnolo, di Valencia.","a":[["sono"]],"x":""},{"t":"gap","q":"Tu ___ italiana?","a":[["sei"]],"x":""},{"t":"gap","q":"Marco ___ a casa adesso.","a":[["è"]],"x":"Para la ubicación se usa essere: «è a casa»."},{"t":"gap","q":"Noi ___ amici da molti anni.","a":[["siamo"]],"x":""},{"t":"gap","q":"Voi ___ stanchi?","a":[["siete"]],"x":""},{"t":"gap","q":"I miei genitori ___ di Napoli.","a":[["sono"]],"x":""},{"t":"gap","q":"Signora, Lei ___ molto gentile.","a":[["è"]],"x":"Lei (usted) va con la 3.ª persona."},{"t":"mc","q":"¿Cómo se dice «estoy cansado»?","o":["Sto stanco","Sono stanco","Ho stanco"],"a":1,"x":"Los estados se expresan con essere: «sono stanco»."},{"t":"mc","q":"«e» sin acento significa...","o":["es","y","hay"],"a":1,"x":"«e» = y; «è» = es."},{"t":"table","title":"Presente de essere","cols":["Persona","essere"],"rows":[{"l":"io","c":[["sono"]]},{"l":"tu","c":[["sei"]]},{"l":"lui / lei","c":[["è"]]},{"l":"noi","c":[["siamo"]]},{"l":"voi","c":[["siete"]]},{"l":"loro","c":[["sono"]]}]},{"t":"order","es":"¿Eres de Roma?","a":"Sei di Roma?"},{"t":"tr","es":"Somos estudiantes.","a":["Siamo studenti","Noi siamo studenti"]},{"t":"tr","es":"Él está en la oficina.","a":["È in ufficio","Lui è in ufficio"]}]},{"id":"a1-2","lvl":"A1","title":"Artículos, género y número","sub":"il, lo, la, gli... y cómo formar el plural","body":"Regla general: **-o** masculino, **-a** femenino, **-e** puede ser cualquiera (*il fiore*, *la chiave*). El plural: **-o → -i**, **-a → -e**, **-e → -i**.\n\nEl artículo depende del sonido con el que empieza la palabra siguiente:\n\n|Tipo de palabra|Singular|Plural\n|masc. + consonante|il ragazzo|i ragazzi\n|masc. + vocal|l'amico|gli amici\n|masc. + s+cons., z, ps, gn, y|lo studente|gli studenti\n|fem. + consonante|la casa|le case\n|fem. + vocal|l'amica|le amiche\n\nIndeterminados: **un** (*un libro, un amico*), **uno** (*uno zaino, uno studente*), **una** (*una casa*), **un'** (*un'amica*).\n\nNo cambian en plural: palabras acentuadas (*la città → le città*), extranjerismos (*il film → i film*) y abreviaciones (*la foto → le foto*). Irregulares útiles: *l'uomo → gli uomini*, *la mano → le mani*, *l'uovo → le uova*, *il braccio → le braccia*.","err":["Cambian de género respecto al español: *il latte*, *il sale*, *il fiore*, *il mare* (masc.); *la gente* es singular.","No existe «el agua»: *l'acqua* es femenino y en plural *le acque*.","Las palabras en -ma griegas son masculinas como en español: *il problema, i problemi*."],"ex":[{"t":"gap","q":"___ libro è sul tavolo.","a":[["il"]],"x":""},{"t":"gap","q":"___ studente è bravo.","a":[["lo"]],"x":"Ante s + consonante: lo."},{"t":"gap","q":"___ amica di Marco si chiama Sara.","a":[["l'"]],"x":""},{"t":"gap","q":"Ho comprato ___ zaino nuovo.","a":[["uno"]],"x":""},{"t":"gap","q":"Ci sono ___ amici di Luca.","a":[["gli"]],"x":""},{"t":"gap","q":"Lei è ___ amica di Laura.","a":[["un'"]],"x":"Femenino ante vocal: un' con apóstrofo."},{"t":"gap","q":"Vorrei ___ caffè, per favore.","a":[["un"]],"x":""},{"t":"mc","q":"El plural de «la città» es...","o":["le cittè","le città","le cittadi"],"a":1,"x":"Las palabras con acento final no cambian."},{"t":"mc","q":"«La leche» en italiano es...","o":["la latte","il latte","lo latte"],"a":1,"x":"Latte es masculino."},{"t":"table","title":"Plurales","cols":["Singular","Plural"],"rows":[{"l":"il ragazzo","c":[["i ragazzi"]]},{"l":"la casa","c":[["le case"]]},{"l":"lo zio","c":[["gli zii"]]},{"l":"l'amico","c":[["gli amici"]]},{"l":"il fiore","c":[["i fiori"]]},{"l":"la città","c":[["le città"]]}]},{"t":"order","es":"Los chicos están en el parque.","a":"I ragazzi sono al parco."},{"t":"tr","es":"Las casas son grandes.","a":["Le case sono grandi"]}]},{"id":"a1-3","lvl":"A1","title":"Avere y presente en -are","sub":"Tener, haber y los verbos más regulares","body":"|Persona|avere|parlare\n|io|ho|parlo\n|tu|hai|parli\n|lui / lei|ha|parla\n|noi|abbiamo|parliamo\n|voi|avete|parlate\n|loro|hanno|parlano\n\nLa **h** de *ho, hai, ha, hanno* no se pronuncia: solo distingue de *o* (o), *ai* (a los), *a* (a), *anno* (año).\n\n**Avere** se usa para la edad (*ho trent'anni*) y para sensaciones: *ho fame, ho sete, ho sonno, ho freddo, ho caldo, ho paura, ho fretta, ho ragione*.\n\nVerbos en -are con detalles: **-care / -gare** añaden h para conservar el sonido (*cerchi, cerchiamo, paghi, paghiamo*). **-iare** pierde una i (*studi, mangi, mangiamo*).\n\n> La 3.ª persona plural se acentúa como en español: *pàrlano* (hablan).","err":["«Tengo que» no es *ho che*: se dice *devo*.","«Tengo frío» es *ho freddo*, nunca *sono freddo* (eso sería «soy frío»)."],"ex":[{"t":"gap","q":"Io ___ (avere) trent'anni.","a":[["ho"]],"x":""},{"t":"gap","q":"Tu ___ (avere) fame?","a":[["hai"]],"x":""},{"t":"gap","q":"Noi ___ (parlare) italiano e spagnolo.","a":[["parliamo"]],"x":""},{"t":"gap","q":"Loro ___ (lavorare) in centro.","a":[["lavorano"]],"x":""},{"t":"gap","q":"Tu ___ (cercare) casa?","a":[["cerchi"]],"x":"-care añade h: cerchi."},{"t":"gap","q":"Voi ___ (mangiare) la pizza stasera?","a":[["mangiate"]],"x":""},{"t":"gap","q":"Quanto ___ (pagare) noi?","a":[["paghiamo"]],"x":"-gare añade h: paghiamo."},{"t":"mc","q":"«Tengo frío» se dice...","o":["Sono freddo","Ho freddo","Ho fredda"],"a":1,"x":"Sensaciones físicas con avere."},{"t":"mc","q":"«Tú estudias» se escribe...","o":["tu studii","tu studi","tu studie"],"a":1,"x":"Verbos en -iare: una sola i."},{"t":"table","title":"Presente: avere y parlare","cols":["Persona","avere","parlare"],"rows":[{"l":"io","c":[["ho"],["parlo"]]},{"l":"tu","c":[["hai"],["parli"]]},{"l":"lui / lei","c":[["ha"],["parla"]]},{"l":"noi","c":[["abbiamo"],["parliamo"]]},{"l":"voi","c":[["avete"],["parlate"]]},{"l":"loro","c":[["hanno"],["parlano"]]}]},{"t":"order","es":"Tenemos prisa.","a":"Abbiamo fretta."},{"t":"tr","es":"¿Dónde vives? (abitare)","a":["Dove abiti","Tu dove abiti","Dove abiti tu"]}]},{"id":"a1-4","lvl":"A1","title":"Presente en -ere / -ire","sub":"Incluidos los verbos con -isc","body":"|Persona|prendere|dormire|capire\n|io|prendo|dormo|capisco\n|tu|prendi|dormi|capisci\n|lui / lei|prende|dorme|capisce\n|noi|prendiamo|dormiamo|capiamo\n|voi|prendete|dormite|capite\n|loro|prendono|dormono|capiscono\n\nMuchos verbos en -ire añaden **-isc-** en io, tu, lui y loro: *capire, finire, preferire, pulire, spedire, costruire*. No hay regla para saber cuáles: apréndelos con el verbo.\n\nPronunciación: *capisco* suena [ka-PIS-ko], pero *capisci* suena [ka-PI-shi].","err":["Olvidar el -isc-: «entiendo» es *capisco*, no *capo*.","La 3.ª plural de -ere e -ire termina en **-ono**, no en *-eno*."],"ex":[{"t":"gap","q":"Io ___ (prendere) un caffè.","a":[["prendo"]],"x":""},{"t":"gap","q":"Lui ___ (leggere) il giornale ogni mattina.","a":[["legge"]],"x":""},{"t":"gap","q":"Voi ___ (dormire) poco.","a":[["dormite"]],"x":""},{"t":"gap","q":"Io non ___ (capire) questa parola.","a":[["capisco"]],"x":""},{"t":"gap","q":"A che ora ___ (finire) il film?","a":[["finisce"]],"x":""},{"t":"gap","q":"Loro ___ (preferire) il mare.","a":[["preferiscono"]],"x":""},{"t":"gap","q":"Noi ___ (aprire) la finestra.","a":[["apriamo"]],"x":""},{"t":"mc","q":"¿Cuál de estos verbos lleva -isc?","o":["dormire","partire","pulire"],"a":2,"x":"pulire → pulisco."},{"t":"mc","q":"«Ellos escriben» es...","o":["scrivano","scrivono","scriveno"],"a":1,"x":"-ere en 3.ª plural: -ono."},{"t":"table","title":"Presente -ere / -ire","cols":["Persona","vedere","sentire","finire"],"rows":[{"l":"io","c":[["vedo"],["sento"],["finisco"]]},{"l":"tu","c":[["vedi"],["senti"],["finisci"]]},{"l":"lui / lei","c":[["vede"],["sente"],["finisce"]]},{"l":"noi","c":[["vediamo"],["sentiamo"],["finiamo"]]},{"l":"voi","c":[["vedete"],["sentite"],["finite"]]},{"l":"loro","c":[["vedono"],["sentono"],["finiscono"]]}]},{"t":"order","es":"No entiendo la pregunta.","a":"Non capisco la domanda."},{"t":"tr","es":"¿Qué prefieres, té o café?","a":["Cosa preferisci, tè o caffè","Che cosa preferisci, tè o caffè","Preferisci tè o caffè"]}]},{"id":"a1-5","lvl":"A1","title":"Preposiciones simples y c'è / ci sono","sub":"Dónde, adónde, desde cuándo, y «hay»","body":"Las preposiciones son *di, a, da, in, con, su, per, tra / fra*. Las que más confunden:\n\n|Para...|Preposición|Ejemplo\n|ciudades|a|Abito a Roma\n|países y regiones|in|Vado in Italia\n|medios de transporte|in|in treno, in macchina (pero: a piedi)\n|lugares genéricos|in|in banca, in centro, in ufficio\n|casa|a|Sono a casa\n|casa / consulta de alguien|da|Ceno da Marco\n|«desde hace»|da|Studio da due anni\n|«dentro de» (tiempo)|fra / tra|Torno fra una settimana\n|origen con essere|di|Sono di Siviglia\n\n**Hay** = **c'è** + singular, **ci sono** + plural: *C'è un bar? Ci sono due farmacie.*","err":["«En Madrid» es *a Madrid*, no *in Madrid*.","«Hace tres años que estudio» es *studio da tre anni* (presente + da).","«Hay un problema» es *c'è un problema*, no *ha un problema*."],"ex":[{"t":"gap","q":"Abito ___ Roma.","a":[["a"]],"x":""},{"t":"gap","q":"Andiamo ___ Italia a luglio.","a":[["in"]],"x":""},{"t":"gap","q":"Vado al lavoro ___ macchina.","a":[["in"]],"x":""},{"t":"gap","q":"Stasera ceniamo ___ Marco.","a":[["da"]],"x":"Casa de alguien: da + persona."},{"t":"gap","q":"Studio italiano ___ due anni.","a":[["da"]],"x":"«Desde hace» = da."},{"t":"gap","q":"___ un supermercato qui vicino?","a":[["c'è"]],"x":""},{"t":"gap","q":"Nel frigo ___ tre uova.","a":[["ci sono"]],"x":""},{"t":"gap","q":"Sono ___ Barcellona, ma vivo a Milano.","a":[["di"]],"x":"Origen con essere: sono di..."},{"t":"mc","q":"«Vuelvo dentro de una semana» es...","o":["Torno da una settimana","Torno fra una settimana","Torno per una settimana"],"a":1,"x":"fra / tra + tiempo = dentro de."},{"t":"mc","q":"«Voy andando» (a pie) es...","o":["Vado in piedi","Vado a piedi","Vado da piedi"],"a":1,"x":"Excepción: a piedi."},{"t":"table","title":"¿Qué preposición?","cols":["Lugar","Preposición"],"rows":[{"l":"Milano","c":[["a"]]},{"l":"Francia","c":[["in"]]},{"l":"banca","c":[["in"]]},{"l":"casa","c":[["a"]]},{"l":"Marco (su casa)","c":[["da"]]},{"l":"treno","c":[["in"]]}]},{"t":"order","es":"Hay muchas personas en la plaza.","a":"Ci sono molte persone in piazza."},{"t":"tr","es":"Hay un problema.","a":["C'è un problema"]}]},{"id":"a1-6","lvl":"A1","title":"Verbos irregulares frecuentes","sub":"fare, andare, venire, volere, potere, dovere...","body":"|Persona|andare|fare|venire|stare\n|io|vado|faccio|vengo|sto\n|tu|vai|fai|vieni|stai\n|lui / lei|va|fa|viene|sta\n|noi|andiamo|facciamo|veniamo|stiamo\n|voi|andate|fate|venite|state\n|loro|vanno|fanno|vengono|stanno\n\n|Persona|volere|potere|dovere|sapere\n|io|voglio|posso|devo|so\n|tu|vuoi|puoi|devi|sai\n|lui / lei|vuole|può|deve|sa\n|noi|vogliamo|possiamo|dobbiamo|sappiamo\n|voi|volete|potete|dovete|sapete\n|loro|vogliono|possono|devono|sanno\n\nOtros: *dire* (dico, dici, dice, diciamo, dite, dicono), *uscire* (esco, esci, esce, usciamo, uscite, escono), *bere* (bevo, bevi...).\n\n**Fare** aparece en mil expresiones: *fare colazione, fare la spesa, fare la doccia, che tempo fa?, fa caldo, faccio l'ingegnere* (soy ingeniero).","err":["«Voy a + infinitivo» con valor de futuro se dice con presente: *domani vado a Roma*, *stasera ceno fuori*.","«Tengo que trabajar» = *devo lavorare*.","«Sé nadar» = *so nuotare* (capacidad aprendida, no *posso*)."],"ex":[{"t":"gap","q":"Cosa ___ (fare) stasera?","a":[["fai"]],"x":""},{"t":"gap","q":"Io ___ (andare) al cinema con Sara.","a":[["vado"]],"x":""},{"t":"gap","q":"Loro ___ (venire) alla festa?","a":[["vengono"]],"x":""},{"t":"gap","q":"Scusi, ___ (potere) ripetere?","a":[["può"]],"x":"Con Lei: 3.ª persona."},{"t":"gap","q":"Noi ___ (dovere) partire presto.","a":[["dobbiamo"]],"x":""},{"t":"gap","q":"Io non ___ (sapere) nuotare.","a":[["so"]],"x":""},{"t":"gap","q":"Voi ___ (volere) un caffè?","a":[["volete"]],"x":""},{"t":"gap","q":"Il sabato io ___ (uscire) con gli amici.","a":[["esco"]],"x":""},{"t":"mc","q":"«Tengo que trabajar» es...","o":["Ho che lavorare","Devo lavorare","Ho lavorare"],"a":1,"x":"Obligación = dovere + infinitivo."},{"t":"mc","q":"«¿Qué tiempo hace?» es...","o":["Che tempo fa?","Che tempo è?","Che tempo ha?"],"a":0,"x":"El tiempo atmosférico usa fare."},{"t":"table","title":"Verbos irregulares","cols":["Persona","andare","fare","volere"],"rows":[{"l":"io","c":[["vado"],["faccio"],["voglio"]]},{"l":"tu","c":[["vai"],["fai"],["vuoi"]]},{"l":"lui / lei","c":[["va"],["fa"],["vuole"]]},{"l":"noi","c":[["andiamo"],["facciamo"],["vogliamo"]]},{"l":"voi","c":[["andate"],["fate"],["volete"]]},{"l":"loro","c":[["vanno"],["fanno"],["vogliono"]]}]},{"t":"order","es":"¿Puedes venir mañana?","a":"Puoi venire domani?"},{"t":"tr","es":"Mañana voy a Florencia.","a":["Domani vado a Firenze","Vado a Firenze domani"]}]},{"id":"a2-1","lvl":"A2","title":"Preposiciones articuladas","sub":"al, del, nel, sul, dal...","body":"*di, a, da, in, su* se funden con el artículo:\n\n|+|il|lo|l'|la|i|gli|le\n|di|del|dello|dell'|della|dei|degli|delle\n|a|al|allo|all'|alla|ai|agli|alle\n|da|dal|dallo|dall'|dalla|dai|dagli|dalle\n|in|nel|nello|nell'|nella|nei|negli|nelle\n|su|sul|sullo|sull'|sulla|sui|sugli|sulle\n\n*con, per, tra* no se funden.\n\n**Partitivo**: *del pane* (pan, algo de pan), *dei biscotti* (unas galletas), *delle mele*.\n\nCon lugares genéricos no hay artículo (*in cucina, in centro*); cuando se especifican, sí: *nella cucina di mia madre*.","err":["«Voy al médico» = *vado dal medico*: con personas se usa da.","«Vengo del aeropuerto» = *vengo dall'aeroporto*: procedencia con da."],"ex":[{"t":"gap","q":"Il libro è ___ (su + il) tavolo.","a":[["sul"]],"x":""},{"t":"gap","q":"Vado ___ (a + il) supermercato.","a":[["al"]],"x":""},{"t":"gap","q":"Domani vado ___ (da + il) dentista.","a":[["dal"]],"x":""},{"t":"gap","q":"Le chiavi sono ___ (in + la) borsa.","a":[["nella"]],"x":""},{"t":"gap","q":"È la macchina ___ (di + lo) zio di Marco.","a":[["dello"]],"x":""},{"t":"gap","q":"Parlo ___ (a + gli) studenti.","a":[["agli"]],"x":""},{"t":"gap","q":"Vorrei ___ (di + il) pane.","a":[["del"]],"x":"Partitivo: del = algo de."},{"t":"gap","q":"I bambini giocano ___ (in + il) giardino.","a":[["nel"]],"x":""},{"t":"mc","q":"«Vengo del aeropuerto» es...","o":["Vengo dell'aeroporto","Vengo dall'aeroporto","Vengo al aeroporto"],"a":1,"x":"Procedencia = da."},{"t":"mc","q":"«Voy al médico» es...","o":["Vado al medico","Vado dal medico","Vado nel medico"],"a":1,"x":"A casa o consulta de una persona: da."},{"t":"table","title":"Preposiciones articuladas","cols":["Prep. + art.","Forma"],"rows":[{"l":"a + il","c":[["al"]]},{"l":"di + la","c":[["della"]]},{"l":"in + gli","c":[["negli"]]},{"l":"su + le","c":[["sulle"]]},{"l":"da + l'","c":[["dall'"]]},{"l":"in + i","c":[["nei"]]}]},{"t":"order","es":"Las tazas están en el armario.","a":"Le tazze sono nell'armadio."},{"t":"tr","es":"Vuelvo del trabajo a las seis.","a":["Torno dal lavoro alle sei"]}]},{"id":"a2-2","lvl":"A2","title":"Passato prossimo con avere","sub":"El pasado de todos los días","body":"Se forma con **avere** en presente + **participio**: *ho mangiato, hai visto, abbiamo fatto*.\n\nParticipios regulares: **-are → -ato**, **-ere → -uto**, **-ire → -ito** (*parlato, venduto, dormito*).\n\n|Infinitivo|Participio|Infinitivo|Participio\n|fare|fatto|scrivere|scritto\n|dire|detto|leggere|letto\n|vedere|visto|aprire|aperto\n|prendere|preso|chiudere|chiuso\n|mettere|messo|bere|bevuto\n|chiedere|chiesto|rispondere|risposto\n|perdere|perso|spendere|speso\n\n**Uso**: en el italiano hablado (sobre todo en el centro y norte) el passato prossimo sustituye al indefinido español: «Ayer comí pasta» = *Ieri ho mangiato la pasta*.\n\nCon los pronombres *lo, la, li, le* el participio concuerda: *La pizza? L'ho mangiata.*","err":["No uses el passato remoto (*mangiai*) para hablar de ayer: suena literario.","Participios irregulares: *leggere → letto*, no *leggiuto*."],"ex":[{"t":"gap","q":"Ieri ___ ___ (io, mangiare) una pizza.","a":[["ho"],["mangiato"]],"x":""},{"t":"gap","q":"Cosa ___ ___ (tu, fare) nel weekend?","a":[["hai"],["fatto"]],"x":""},{"t":"gap","q":"Noi ___ ___ (vedere) un bel film.","a":[["abbiamo"],["visto"]],"x":""},{"t":"gap","q":"Marco ___ ___ (scrivere) una mail al capo.","a":[["ha"],["scritto"]],"x":""},{"t":"gap","q":"Voi ___ ___ (prendere) il treno delle otto?","a":[["avete"],["preso"]],"x":""},{"t":"gap","q":"Loro non ___ ___ (dire) niente.","a":[["hanno"],["detto"]],"x":""},{"t":"mc","q":"«Ayer leí un libro» es...","o":["Ieri lessi un libro","Ieri ho letto un libro","Ieri ho leggiuto un libro"],"a":1,"x":"Passato prossimo + participio irregular letto."},{"t":"mc","q":"Participio de «aprire»","o":["aprito","aperto","apruto"],"a":1,"x":"aprire → aperto."},{"t":"table","title":"Participios irregulares","cols":["Infinitivo","Participio"],"rows":[{"l":"fare","c":[["fatto"]]},{"l":"vedere","c":[["visto"]]},{"l":"mettere","c":[["messo"]]},{"l":"bere","c":[["bevuto"]]},{"l":"chiudere","c":[["chiuso"]]},{"l":"chiedere","c":[["chiesto"]]}]},{"t":"order","es":"¿Has entendido la lección?","a":"Hai capito la lezione?"},{"t":"tr","es":"Ayer compré un regalo para mi madre.","a":["Ieri ho comprato un regalo per mia madre","Ho comprato un regalo per mia madre ieri"]}]},{"id":"a2-3","lvl":"A2","title":"Passato prossimo con essere","sub":"Movimiento, cambio de estado y concordancia","body":"Usan **essere** como auxiliar:\n- verbos de movimiento y permanencia: *andare, venire, arrivare, partire, uscire, entrare, tornare, restare, rimanere, stare*\n- cambios de estado: *nascere, morire, diventare, crescere*\n- *essere* (*sono stato*), *piacere*, *costare*, *succedere*, *sembrare*\n- todos los reflexivos: *mi sono alzato*\n\nCon essere, el participio **concuerda con el sujeto**: *Sara è andata, i ragazzi sono arrivati, le ragazze sono uscite*.\n\nAlgunos verbos cambian de auxiliar: con objeto directo llevan avere (*ho finito il lavoro*), sin él llevan essere (*il film è finito*). Igual: *cominciare, passare, salire, scendere*.","err":["En español todo va con «haber»: *ho andato* es incorrecto, se dice *sono andato/a*.","Olvidar la concordancia: una mujer dice *sono arrivata*."],"ex":[{"t":"gap","q":"Ieri Sara ___ ___ (andare) al mare.","a":[["è"],["andata"]],"x":""},{"t":"gap","q":"Noi ___ ___ (arrivare) tardi. (chicos)","a":[["siamo"],["arrivati"]],"x":""},{"t":"gap","q":"A che ora ___ ___ (uscire), Marco?","a":[["sei"],["uscito"]],"x":""},{"t":"gap","q":"Le mie amiche ___ ___ (partire) per Parigi.","a":[["sono"],["partite"]],"x":""},{"t":"gap","q":"Io (Laura) ___ ___ (nascere) a Siviglia.","a":[["sono"],["nata"]],"x":""},{"t":"gap","q":"Il film ___ ___ (finire) a mezzanotte.","a":[["è"],["finito"]],"x":""},{"t":"gap","q":"Io ___ ___ (finire) il lavoro alle sei.","a":[["ho"],["finito"]],"x":"Con objeto directo, finire va con avere."},{"t":"mc","q":"«He estado en Roma» (hombre) es...","o":["Ho stato a Roma","Sono stato a Roma","Ho essuto a Roma"],"a":1,"x":"essere y stare: sono stato/a."},{"t":"mc","q":"«Il film mi ___ piaciuto»","o":["ha","è","ho"],"a":1,"x":"piacere va con essere."},{"t":"table","title":"Concordancia con essere","cols":["Sujeto","andare"],"rows":[{"l":"io (Marco)","c":[["sono andato"]]},{"l":"io (Giulia)","c":[["sono andata"]]},{"l":"noi (chicos)","c":[["siamo andati"]]},{"l":"loro (chicas)","c":[["sono andate"]]},{"l":"lei","c":[["è andata"]]},{"l":"voi (grupo mixto)","c":[["siete andati"]]}]},{"t":"order","es":"¿A qué hora habéis vuelto?","a":"A che ora siete tornati?"},{"t":"tr","es":"Mis padres han llegado hoy.","a":["I miei genitori sono arrivati oggi","Oggi sono arrivati i miei genitori"]}]},{"id":"a2-4","lvl":"A2","title":"Verbos reflexivos","sub":"mi alzo, ti svegli, ci vediamo","body":"|Persona|alzarsi\n|io|mi alzo\n|tu|ti alzi\n|lui / lei|si alza\n|noi|ci alziamo\n|voi|vi alzate\n|loro|si alzano\n\nCon verbos modales hay dos posiciones: *mi devo alzare* = *devo alzarmi*.\n\nEn el passato prossimo van con **essere** y concuerdan: *mi sono alzato/a, ci siamo divertiti*.\n\nTambién expresan reciprocidad: *ci vediamo* (nos vemos), *si sposano* (se casan).\n\n> No coinciden siempre con el español: «quedarse» = *restare / rimanere* (sin si); «irse» = *andare via* o *andarsene*.","err":["*Mi ho lavato* es incorrecto: reflexivo = essere, *mi sono lavato*.","«Me quedo en casa» = *resto a casa*, no *mi resto*."],"ex":[{"t":"gap","q":"La mattina io ___ ___ (svegliarsi) alle sette.","a":[["mi"],["sveglio"]],"x":""},{"t":"gap","q":"A che ora ___ ___ (tu, alzarsi)?","a":[["ti"],["alzi"]],"x":""},{"t":"gap","q":"Noi ___ ___ (divertirsi) molto alle feste.","a":[["ci"],["divertiamo"]],"x":""},{"t":"gap","q":"Ieri sera Giulia ___ ___ ___ (arrabbiarsi).","a":[["si"],["è"],["arrabbiata"]],"x":""},{"t":"gap","q":"Domani devo ___ (alzarsi) presto.","a":[["alzarmi"]],"x":""},{"t":"gap","q":"Voi ___ ___ (chiamarsi) Luca e Paolo?","a":[["vi"],["chiamate"]],"x":""},{"t":"mc","q":"«Me he lavado» (hombre) es...","o":["Mi sono lavato","Mi ho lavato","Ho lavato me"],"a":0,"x":"Reflexivos con essere."},{"t":"mc","q":"«Me quedo en casa» es...","o":["Mi resto a casa","Resto a casa","Mi rimango a casa"],"a":1,"x":"Quedarse = restare / rimanere, sin pronombre."},{"t":"table","title":"Presente de svegliarsi","cols":["Persona","Forma"],"rows":[{"l":"io","c":[["mi sveglio"]]},{"l":"tu","c":[["ti svegli"]]},{"l":"lui / lei","c":[["si sveglia"]]},{"l":"noi","c":[["ci svegliamo"]]},{"l":"voi","c":[["vi svegliate"]]},{"l":"loro","c":[["si svegliano"]]}]},{"t":"order","es":"Nos vemos mañana en el bar.","a":"Ci vediamo domani al bar."},{"t":"tr","es":"Me he divertido mucho (mujer).","a":["Mi sono divertita molto","Mi sono divertita tanto"]}]},{"id":"a2-5","lvl":"A2","title":"Posesivos","sub":"il mio, la tua, i nostri... con artículo","body":"|Poseedor|masc. sing.|fem. sing.|masc. pl.|fem. pl.\n|io|il mio|la mia|i miei|le mie\n|tu|il tuo|la tua|i tuoi|le tue\n|lui / lei / Lei|il suo|la sua|i suoi|le sue\n|noi|il nostro|la nostra|i nostri|le nostre\n|voi|il vostro|la vostra|i vostri|le vostre\n|loro|il loro|la loro|i loro|le loro\n\nA diferencia del español, el posesivo **lleva artículo**: *il mio libro, la tua casa*.\n\nExcepción: familiares en **singular** y sin adjetivos van sin artículo: *mia madre, tuo fratello*. Pero: *i miei fratelli, la mia sorellina, la loro madre* (*loro* siempre con artículo).\n\nComo en español, concuerda con lo poseído: *Marco e la sua macchina*, *Sara e il suo cane*.","err":["*Mio libro* sin artículo es incorrecto.","*La mia madre* también: familiar singular, sin artículo."],"ex":[{"t":"gap","q":"Questa è ___ ___ macchina. (mi)","a":[["la"],["mia"]],"x":""},{"t":"gap","q":"___ ___ amici sono simpatici. (tus)","a":[["i"],["tuoi"]],"x":""},{"t":"gap","q":"___ madre è insegnante. (mi)","a":[["mia"]],"x":"Familiar en singular: sin artículo."},{"t":"gap","q":"Marco ama ___ ___ ragazza. (su)","a":[["la"],["sua"]],"x":""},{"t":"gap","q":"Sara vive con ___ ___ cane. (su)","a":[["il"],["suo"]],"x":"Concuerda con cane (masculino)."},{"t":"gap","q":"___ ___ casa è grande. (su, de ellos)","a":[["la"],["loro"]],"x":""},{"t":"gap","q":"Dove sono ___ ___ chiavi? (mis)","a":[["le"],["mie"]],"x":""},{"t":"mc","q":"«Mis hermanos» es...","o":["miei fratelli","i miei fratelli","le mie fratelli"],"a":1,"x":"En plural, los familiares llevan artículo."},{"t":"mc","q":"«Su hermana» (de ellos) es...","o":["loro sorella","la loro sorella","sua sorella"],"a":1,"x":"loro siempre lleva artículo."},{"t":"table","title":"Posesivos","cols":["Poseedor","m. sing.","f. sing.","m. pl.","f. pl."],"rows":[{"l":"io","c":[["mio"],["mia"],["miei"],["mie"]]},{"l":"tu","c":[["tuo"],["tua"],["tuoi"],["tue"]]},{"l":"lui / lei","c":[["suo"],["sua"],["suoi"],["sue"]]},{"l":"noi","c":[["nostro"],["nostra"],["nostri"],["nostre"]]}]},{"t":"order","es":"Nuestro piso está en el centro.","a":"Il nostro appartamento è in centro."},{"t":"tr","es":"Mi padre trabaja en un banco.","a":["Mio padre lavora in una banca","Mio padre lavora in banca"]}]},{"id":"a2-6","lvl":"A2","title":"Imperfetto","sub":"Descripciones y costumbres del pasado","body":"|Persona|parlare|leggere|dormire|essere\n|io|parlavo|leggevo|dormivo|ero\n|tu|parlavi|leggevi|dormivi|eri\n|lui / lei|parlava|leggeva|dormiva|era\n|noi|parlavamo|leggevamo|dormivamo|eravamo\n|voi|parlavate|leggevate|dormivate|eravate\n|loro|parlavano|leggevano|dormivano|erano\n\nIrregulares: *fare → facevo*, *dire → dicevo*, *bere → bevevo*.\n\nSe usa **igual que el imperfecto español**: costumbres (*da piccolo giocavo a calcio*), descripciones (*era alta*), acciones en curso interrumpidas por otra (*mentre cucinavo, è arrivato Marco*).\n\nPara acciones terminadas: passato prossimo. *Ieri ho letto un libro* (acabado) / *Leggevo quando hai chiamato* (en curso).","err":["Es de los tiempos más fáciles para hispanohablantes: el reparto con el passato prossimo es casi idéntico al de imperfecto / indefinido.","3.ª plural: *parlàvano*, con el acento como en «hablaban»."],"ex":[{"t":"gap","q":"Da piccolo ___ (io, giocare) sempre a calcio.","a":[["giocavo"]],"x":""},{"t":"gap","q":"Mia nonna ___ (essere) molto alta.","a":[["era"]],"x":""},{"t":"gap","q":"Mentre ___ (noi, mangiare), è squillato il telefono.","a":[["mangiavamo"]],"x":""},{"t":"gap","q":"Ogni estate ___ (loro, andare) al mare.","a":[["andavano"]],"x":""},{"t":"gap","q":"Che cosa ___ (tu, fare) quando ti ho chiamato?","a":[["facevi"]],"x":""},{"t":"gap","q":"Ieri ___ (fare) freddo.","a":[["faceva"]],"x":""},{"t":"gap","q":"Quando ___ (io, avere) dieci anni, abitavo a Lima.","a":[["avevo"]],"x":""},{"t":"mc","q":"«Ayer leí un libro entero»","o":["leggevo","ho letto","leggeva"],"a":1,"x":"Acción concluida → passato prossimo."},{"t":"mc","q":"«De niño era muy tímido»","o":["sono stato","ero","fui"],"a":1,"x":"Descripción en el pasado → imperfetto."},{"t":"table","title":"Imperfetto","cols":["Persona","essere","fare"],"rows":[{"l":"io","c":[["ero"],["facevo"]]},{"l":"tu","c":[["eri"],["facevi"]]},{"l":"lui / lei","c":[["era"],["faceva"]]},{"l":"noi","c":[["eravamo"],["facevamo"]]},{"l":"voi","c":[["eravate"],["facevate"]]},{"l":"loro","c":[["erano"],["facevano"]]}]},{"t":"order","es":"Cuando era pequeña vivía en Turín.","a":"Quando ero piccola abitavo a Torino."},{"t":"tr","es":"Mientras dormía, ha llamado Luca.","a":["Mentre dormivo, ha chiamato Luca","Mentre dormivo ha chiamato Luca"]}]},{"id":"a2-7","lvl":"A2","title":"Pronombres de objeto directo e indirecto","sub":"lo, la, li, le · gli, le","body":"|Persona|Directo|Indirecto\n|io|mi|mi\n|tu|ti|ti\n|lui|lo|gli\n|lei / Lei|la / La|le / Le\n|noi|ci|ci\n|voi|vi|vi\n|loro (m.)|li|gli\n|loro (f.)|le|gli\n\nVan delante del verbo conjugado. Con infinitivo se unen al final: *voglio vederlo* = *lo voglio vedere*.\n\n**Gli** = a él y, en el habla, también a ellos/ellas. **Le** = a ella (y a usted, *Le*). Así, «le digo» (a Marco) = *gli dico*.\n\nEn el passato prossimo, *lo, la, li, le* hacen concordar el participio: *L'ho vista, li ho comprati*. Los indirectos no.\n\n**Piacere** funciona como «gustar»: *mi piace, ti piace, gli piace, le piace, ci piace, vi piace, gli piace*.","err":["«Le digo» a un hombre es *gli dico*, no *le dico*.","No hay leísmo: «a Marco lo veo» = *lo vedo*."],"ex":[{"t":"gap","q":"Vedi Marco stasera? Sì, ___ vedo alle nove.","a":[["lo"]],"x":""},{"t":"gap","q":"Conosci Giulia? Sì, ___ conosco bene.","a":[["la"]],"x":""},{"t":"gap","q":"Hai comprato i biglietti? Sì, ___ ho comprati.","a":[["li"]],"x":""},{"t":"gap","q":"Telefono a Luca e ___ dico tutto.","a":[["gli"]],"x":"A él → gli."},{"t":"gap","q":"Scrivo a Sara e ___ mando le foto.","a":[["le"]],"x":"A ella → le."},{"t":"gap","q":"Hai visto le ragazze? Sì, ___ ho viste ieri.","a":[["le"]],"x":""},{"t":"gap","q":"A Marco ___ piace il calcio.","a":[["gli"]],"x":""},{"t":"mc","q":"«Les escribo» (a mis padres)","o":["Le scrivo","Gli scrivo","Li scrivo"],"a":1,"x":"En el habla, gli = a ellos."},{"t":"mc","q":"«Quiero verla»","o":["Voglio vederla","Voglio la vedere","Voglio vedere la"],"a":0,"x":"Con infinitivo, el pronombre va al final."},{"t":"table","title":"Pronombres","cols":["Persona","Directo","Indirecto"],"rows":[{"l":"io","c":[["mi"],["mi"]]},{"l":"tu","c":[["ti"],["ti"]]},{"l":"lui","c":[["lo"],["gli"]]},{"l":"lei","c":[["la"],["le"]]},{"l":"noi","c":[["ci"],["ci"]]},{"l":"loro (m.)","c":[["li"],["gli"]]}]},{"t":"order","es":"Te llamo mañana.","a":"Ti chiamo domani."},{"t":"tr","es":"¿La pizza? La he comido toda.","a":["La pizza? L'ho mangiata tutta","La pizza l'ho mangiata tutta"]}]},{"id":"a2-8","lvl":"A2","title":"Futuro semplice","sub":"Planes, promesas y suposiciones","body":"Los verbos en -are y -ere comparten las terminaciones con **-er-**:\n\n|Persona|parlare|prendere|dormire\n|io|parlerò|prenderò|dormirò\n|tu|parlerai|prenderai|dormirai\n|lui / lei|parlerà|prenderà|dormirà\n|noi|parleremo|prenderemo|dormiremo\n|voi|parlerete|prenderete|dormirete\n|loro|parleranno|prenderanno|dormiranno\n\nIrregulares: *essere → sarò, avere → avrò, andare → andrò, fare → farò, potere → potrò, dovere → dovrò, sapere → saprò, vedere → vedrò, venire → verrò, volere → vorrò, bere → berrò, rimanere → rimarrò*.\n\nOrtografía: *cercherò, pagherò* (con h); *comincerò, mangerò* (sin i).\n\nUsos: futuro (*l'anno prossimo andrò in Sicilia*) y **suposición**: *sarà stanco* (estará cansado). Tras *quando* y *se* con valor futuro, el italiano también usa futuro: *ti scriverò quando arriverò*.","err":["«Voy a + infinitivo» = presente o futuro, nunca *vado a* + infinitivo con valor de futuro.","*Mangierò* lleva una i de más: es *mangerò*."],"ex":[{"t":"gap","q":"Domani ___ (io, chiamare) il medico.","a":[["chiamerò"]],"x":""},{"t":"gap","q":"L'anno prossimo ___ (noi, andare) in Sicilia.","a":[["andremo"]],"x":""},{"t":"gap","q":"Tu ___ (venire) alla festa sabato?","a":[["verrai"]],"x":""},{"t":"gap","q":"Quando ___ (loro, finire) i lavori?","a":[["finiranno"]],"x":""},{"t":"gap","q":"Che ore sono? ___ (essere) le dieci, più o meno.","a":[["saranno"]],"x":"Futuro de suposición."},{"t":"gap","q":"Domani ___ (io, mangiare) di meno!","a":[["mangerò"]],"x":"-giare pierde la i."},{"t":"gap","q":"Ti ___ (io, pagare) il caffè.","a":[["pagherò"]],"x":""},{"t":"mc","q":"«Tendré que trabajar»","o":["Avrò da lavorare","Dovrò lavorare","Doverò lavorare"],"a":1,"x":"dovere → dovrò."},{"t":"mc","q":"«Marco no ha venido. Estará enfermo.»","o":["Sarà malato","Starà malato","È malato sicuro"],"a":0,"x":"Futuro de probabilidad."},{"t":"table","title":"Futuro irregular","cols":["Infinitivo","io","loro"],"rows":[{"l":"essere","c":[["sarò"],["saranno"]]},{"l":"avere","c":[["avrò"],["avranno"]]},{"l":"fare","c":[["farò"],["faranno"]]},{"l":"andare","c":[["andrò"],["andranno"]]},{"l":"volere","c":[["vorrò"],["vorranno"]]},{"l":"venire","c":[["verrò"],["verranno"]]}]},{"t":"order","es":"¿Qué harás este verano?","a":"Cosa farai quest'estate?"},{"t":"tr","es":"Te escribiré cuando llegue.","a":["Ti scriverò quando arriverò","Ti scriverò quando arrivo"]}]},{"id":"a2-9","lvl":"A2","title":"Comparativos y superlativos","sub":"più... di, meno... che, bellissimo","body":"**Más / menos ... que**:\n- **più / meno ... di** ante sustantivos y pronombres: *Marco è più alto di Luca*, *di me*.\n- **più / meno ... che** al comparar dos adjetivos, verbos, o cuando hay preposición: *è più bello che utile*, *è più facile parlare che scrivere*, *fa più caldo a Roma che a Milano*.\n\n**Igualdad**: *(così) ... come* o *(tanto) ... quanto*: *è alto come suo padre*.\n\n**Superlativo**: *il più bello della classe* (relativo); *bellissimo* o *molto bello* (absoluto).\n\n|Positivo|Comparativo|Superlativo\n|buono|migliore|ottimo\n|cattivo|peggiore|pessimo\n|grande|maggiore|massimo\n|piccolo|minore|minimo\n|bene (adv.)|meglio|benissimo\n|male (adv.)|peggio|malissimo","err":["«Mejor» adverbio = *meglio* (*sto meglio*); adjetivo = *migliore* (*il ristorante migliore*).","«Que» tras comparativo no es siempre *che*: con sustantivos y pronombres es *di*."],"ex":[{"t":"gap","q":"Roma è più grande ___ Firenze.","a":[["di"]],"x":""},{"t":"gap","q":"Luca è ___ alto di me. (más)","a":[["più"]],"x":""},{"t":"gap","q":"È più facile parlare ___ scrivere.","a":[["che"]],"x":"Dos verbos: che."},{"t":"gap","q":"Questo vino è ___ . (buonísimo)","a":[["buonissimo"]],"x":""},{"t":"gap","q":"Sara è la ragazza più simpatica ___ classe.","a":[["della"]],"x":""},{"t":"gap","q":"Oggi sto ___ di ieri. (mejor)","a":[["meglio"]],"x":"Adverbio: meglio."},{"t":"gap","q":"È il ___ ristorante della città. (mejor)","a":[["migliore"]],"x":""},{"t":"mc","q":"«Hay más turistas en Venecia que en Bolonia»","o":["...a Venezia di a Bologna","...a Venezia che a Bologna","...a Venezia come a Bologna"],"a":1,"x":"Con preposición delante: che."},{"t":"mc","q":"«Es tan alto como su padre»","o":["alto come suo padre","alto che suo padre","alto di suo padre"],"a":0,"x":"Igualdad: come / quanto."},{"t":"table","title":"Comparativos irregulares","cols":["Positivo","Comparativo","Superlativo"],"rows":[{"l":"buono","c":[["migliore"],["ottimo"]]},{"l":"cattivo","c":[["peggiore"],["pessimo"]]},{"l":"grande","c":[["maggiore"],["massimo"]]},{"l":"piccolo","c":[["minore"],["minimo"]]}]},{"t":"order","es":"Este café es el mejor de Roma.","a":"Questo caffè è il migliore di Roma."},{"t":"tr","es":"Mi hermana es menos alta que yo.","a":["Mia sorella è meno alta di me"]}]},{"id":"b1-1","lvl":"B1","title":"Condizionale presente","sub":"Cortesía, deseos, consejos e hipótesis","body":"Misma raíz que el futuro + **-ei, -esti, -ebbe, -emmo, -este, -ebbero**.\n\n|Persona|parlare|essere|avere|volere\n|io|parlerei|sarei|avrei|vorrei\n|tu|parleresti|saresti|avresti|vorresti\n|lui / lei|parlerebbe|sarebbe|avrebbe|vorrebbe\n|noi|parleremmo|saremmo|avremmo|vorremmo\n|voi|parlereste|sareste|avreste|vorreste\n|loro|parlerebbero|sarebbero|avrebbero|vorrebbero\n\nUsos:\n- cortesía: *vorrei un caffè*, *potrebbe aiutarmi?*\n- deseos: *mi piacerebbe vivere a Roma*\n- consejos: *dovresti riposare*\n- noticias no confirmadas (prensa): *il ministro si sarebbe dimesso*\n\nEl **condizionale passato** (*avrei voluto, sarei venuto*) expresa lo que no ocurrió y, como verás en B2, también el futuro visto desde el pasado.","err":["La terminación española «-ía» corresponde a **-ei**: «querría» = *vorrei*.","*noi* lleva doble m: *andremmo* (condicional) frente a *andremo* (futuro)."],"ex":[{"t":"gap","q":"___ (io, volere) un tavolo per due.","a":[["vorrei"]],"x":""},{"t":"gap","q":"Mi ___ (piacere) visitare Napoli.","a":[["piacerebbe"]],"x":""},{"t":"gap","q":"Al tuo posto, ___ (io, parlare) con lui.","a":[["parlerei"]],"x":""},{"t":"gap","q":"___ (tu, potere) aiutarmi?","a":[["potresti"]],"x":""},{"t":"gap","q":"Voi ___ (dovere) dormire di più.","a":[["dovreste"]],"x":""},{"t":"gap","q":"Loro ___ (venire) volentieri, ma hanno da fare.","a":[["verrebbero"]],"x":""},{"t":"gap","q":"Noi ___ (andare) in vacanza, ma non abbiamo soldi.","a":[["andremmo"]],"x":"Doble m en noi."},{"t":"mc","q":"«Deberías descansar»","o":["Dovresti riposare","Doveresti riposare","Dovrai riposare"],"a":0,"x":"dovere → dovr-."},{"t":"mc","q":"Noticia sin confirmar: «El ministro habría dimitido»","o":["si è dimesso","si sarebbe dimesso","si dimette"],"a":1,"x":"Condicional periodístico."},{"t":"table","title":"Condizionale","cols":["Persona","essere","avere","volere"],"rows":[{"l":"io","c":[["sarei"],["avrei"],["vorrei"]]},{"l":"tu","c":[["saresti"],["avresti"],["vorresti"]]},{"l":"lui / lei","c":[["sarebbe"],["avrebbe"],["vorrebbe"]]},{"l":"noi","c":[["saremmo"],["avremmo"],["vorremmo"]]},{"l":"voi","c":[["sareste"],["avreste"],["vorreste"]]},{"l":"loro","c":[["sarebbero"],["avrebbero"],["vorrebbero"]]}]},{"t":"order","es":"¿Te gustaría venir al cine?","a":"Ti piacerebbe venire al cinema?"},{"t":"tr","es":"Podríamos cenar fuera esta noche.","a":["Potremmo cenare fuori stasera","Stasera potremmo cenare fuori"]}]},{"id":"b1-2","lvl":"B1","title":"Imperativo","sub":"Órdenes, consejos e instrucciones (tu, Lei, voi)","body":"|Infinitivo|tu|Lei|noi|voi\n|parlare|parla!|parli!|parliamo!|parlate!\n|prendere|prendi!|prenda!|prendiamo!|prendete!\n|sentire|senti!|senta!|sentiamo!|sentite!\n|finire|finisci!|finisca!|finiamo!|finite!\n\nIrregulares de tu: *va' (vai), fa' (fai), da' (dai), sta' (stai), di'*; *essere → sii*, *avere → abbi*. Con **Lei** se usa el congiuntivo: *venga, faccia, vada, scusi*.\n\n**Negativo de tu** = *non* + infinitivo: *non parlare!, non preoccuparti!* Las demás personas: *non* + la forma (*non parlate!*).\n\nPronombres: se **unen** con tu, noi, voi (*chiamami, fallo, andiamoci*); con los monosílabos se dobla la consonante: *dimmi, fammi, dammi, stammi bene*. Con Lei van **delante**: *mi scusi, si accomodi*.","err":["«No hables» (tú) = *non parlare*, no *non parli*.","«Siéntese» = *si sieda* (formal), «siéntate» = *siediti*."],"ex":[{"t":"gap","q":"Marco, ___ (aspettare) un attimo!","a":[["aspetta"]],"x":""},{"t":"gap","q":"___ (tu, prendere) l'ombrello, piove!","a":[["prendi"]],"x":""},{"t":"gap","q":"Non ___ (tu, preoccuparsi)!","a":[["preoccuparti"]],"x":"Negativo de tu: non + infinitivo."},{"t":"gap","q":"Signora, ___ (venire) pure avanti.","a":[["venga"]],"x":"Lei: forma del congiuntivo."},{"t":"gap","q":"___ (tu, dire + mi) la verità!","a":[["dimmi"]],"x":""},{"t":"gap","q":"Ragazzi, ___ (fare) silenzio!","a":[["fate"]],"x":""},{"t":"gap","q":"Per favore, ___ (Lei, scusare) il ritardo.","a":[["scusi"]],"x":""},{"t":"mc","q":"«¡No lo toques!» (tú)","o":["Non toccarlo!","Non lo tocchi!","Non toccalo!"],"a":0,"x":"non + infinitivo."},{"t":"mc","q":"«Siéntese» (Lei)","o":["Si siede","Si sieda","Siediti"],"a":1,"x":"Formal: congiuntivo."},{"t":"table","title":"Imperativo","cols":["Infinitivo","tu","Lei","voi"],"rows":[{"l":"parlare","c":[["parla"],["parli"],["parlate"]]},{"l":"prendere","c":[["prendi"],["prenda"],["prendete"]]},{"l":"sentire","c":[["senti"],["senta"],["sentite"]]},{"l":"andare","c":[["va'","vai"],["vada"],["andate"]]},{"l":"fare","c":[["fa'","fai"],["faccia"],["fate"]]}]},{"t":"order","es":"Llámame esta noche.","a":"Chiamami stasera."},{"t":"tr","es":"¡Vamos al mar!","a":["Andiamo al mare"]}]},{"id":"b1-3","lvl":"B1","title":"Pronombres combinados","sub":"me lo, te la, glielo, ce ne...","body":"Cuando se juntan un indirecto y un directo (o *ne*), el indirecto va primero y cambia la -i por **-e**:\n\n|Indirecto|+ lo|+ la|+ li|+ le|+ ne\n|mi|me lo|me la|me li|me le|me ne\n|ti|te lo|te la|te li|te le|te ne\n|gli / le|glielo|gliela|glieli|gliele|gliene\n|ci|ce lo|ce la|ce li|ce le|ce ne\n|vi|ve lo|ve la|ve li|ve le|ve ne\n\n**Glie-** sirve para él, ella, usted y ellos, y se escribe junto: el «se lo» español = *glielo*.\n\nPosición: delante del verbo conjugado, unido al infinitivo y al imperativo: *voglio dirtelo, dammelo*.\n\nEn el passato prossimo el participio concuerda con el directo: *Le chiavi? Gliele ho date.*","err":["«Se lo digo» (a ella) = *glielo dico*, nunca *le lo* ni *se lo*.","Con *ho*: *gliel'ho detto* (se apostrofa)."],"ex":[{"t":"gap","q":"Mi presti la penna? Sì, ___ ___ presto.","a":[["te"],["la"]],"x":""},{"t":"gap","q":"Hai dato il libro a Marco? Sì, ___ ho dato ieri.","a":[["gliel'","glielo"]],"x":""},{"t":"gap","q":"Ci porti il vino? Sì, ___ ___ porto.","a":[["ve"],["lo"]],"x":""},{"t":"gap","q":"Racconto la storia a Sara: ___ racconto.","a":[["gliela"]],"x":""},{"t":"gap","q":"Mi dici il segreto? Non posso ___ . (dire + ti + lo)","a":[["dirtelo"]],"x":""},{"t":"gap","q":"Quante mele vuoi? ___ ___ do tre. (a ti, de ellas)","a":[["te"],["ne"]],"x":""},{"t":"mc","q":"«Se lo digo» (a ella)","o":["Le lo dico","Glielo dico","Se lo dico"],"a":1,"x":"gli / le + lo = glielo."},{"t":"mc","q":"«Dámelo» (tú)","o":["Dammelo","Dàmelo","Dalmelo"],"a":0,"x":"da' + me + lo, con doble m."},{"t":"table","title":"Combinaciones","cols":["Pronombres","Forma"],"rows":[{"l":"mi + lo","c":[["me lo"]]},{"l":"ti + la","c":[["te la"]]},{"l":"gli + li","c":[["glieli"]]},{"l":"ci + le","c":[["ce le"]]},{"l":"vi + ne","c":[["ve ne"]]},{"l":"le + lo","c":[["glielo"]]}]},{"t":"order","es":"Te lo explico mañana.","a":"Te lo spiego domani."},{"t":"tr","es":"¿Las llaves? Ya se las he dado (a él).","a":["Le chiavi? Gliele ho già date","Le chiavi gliele ho già date"]}]},{"id":"b1-4","lvl":"B1","title":"Ci y ne","sub":"Dos palabras pequeñas que están en todas partes","body":"**Ci** sustituye un lugar o algo introducido por *a*, *in*, *su*: *Vai a Roma? Sì, ci vado.* *Pensi al viaggio? Sì, ci penso.*\n\nExpresiones con ci: *volerci* (hacer falta / tardar: *ci vuole un'ora, ci vogliono due ore*), *metterci* (tardar alguien: *ci metto mezz'ora*), *entrarci* (tener que ver: *non c'entra*), *farcela* (lograrlo: *ce la faccio*).\n\n**Ne** sustituye una cantidad o algo introducido por *di*: *Quanti caffè bevi? Ne bevo tre.* *Che ne pensi?* *Ne parliamo domani.*\n\nVerbos con ne: *andarsene* (irse: *me ne vado*), *fregarsene* (pasar de algo).\n\nEn el passato prossimo, *ne* de cantidad hace concordar el participio: *Ne ho mangiate due* (mele).","err":["«Hace falta / se tarda» en plural = *ci vogliono* (*ci vogliono tre ore*).","En español a menudo no se dice nada: «¿Tienes hijos? Tengo dos» → *Ne ho due*. En italiano *ne* es obligatorio."],"ex":[{"t":"gap","q":"Vai a Roma? Sì, ___ vado sabato.","a":[["ci"]],"x":""},{"t":"gap","q":"Quanti figli hai? ___ ho due.","a":[["ne"]],"x":""},{"t":"gap","q":"Per arrivare in centro ___ vuole mezz'ora.","a":[["ci"]],"x":""},{"t":"gap","q":"Che ___ pensi di questo film?","a":[["ne"]],"x":""},{"t":"gap","q":"È tardi, me ___ vado.","a":[["ne"]],"x":""},{"t":"gap","q":"Quanto tempo ___ metti per andare al lavoro?","a":[["ci"]],"x":""},{"t":"gap","q":"Hai comprato delle mele? Sì, ne ho ___ quattro.","a":[["comprate"]],"x":"Con ne de cantidad, el participio concuerda."},{"t":"mc","q":"«Se tardan dos horas»","o":["Ci vuole due ore","Ci vogliono due ore","Ne vogliono due ore"],"a":1,"x":"Plural: ci vogliono."},{"t":"mc","q":"«Esto no tiene nada que ver»","o":["Non c'entra niente","Non ne entra niente","Non ci entra niente"],"a":0,"x":"entrarci = tener que ver."},{"t":"table","title":"¿Ci o ne?","cols":["Frase","Pronombre"],"rows":[{"l":"Penso al viaggio → ___ penso","c":[["ci"]]},{"l":"Parlo del viaggio → ___ parlo","c":[["ne"]]},{"l":"Vado al mare → ___ vado","c":[["ci"]]},{"l":"Ho tre cani → ___ ho tre","c":[["ne"]]},{"l":"Credo ai fantasmi → ___ credo","c":[["ci"]]}]},{"t":"order","es":"¿Qué piensas de ello?","a":"Che ne pensi?"},{"t":"tr","es":"Me voy a casa.","a":["Me ne vado a casa","Vado a casa"]}]},{"id":"b1-5","lvl":"B1","title":"Trapassato prossimo","sub":"El «había hecho» italiano","body":"Imperfetto de **avere / essere** + participio: *avevo mangiato, ero uscito/a*. Funciona como el pluscuamperfecto español: una acción anterior a otra del pasado.\n\n*Quando sono arrivato, il treno era già partito.*\n\n|Persona|mangiare|partire\n|io|avevo mangiato|ero partito/a\n|tu|avevi mangiato|eri partito/a\n|lui / lei|aveva mangiato|era partito/a\n|noi|avevamo mangiato|eravamo partiti/e\n|voi|avevate mangiato|eravate partiti/e\n|loro|avevano mangiato|erano partiti/e\n\nLas reglas del auxiliar y de la concordancia son las mismas que en el passato prossimo.","err":["*Aveva andato* es incorrecto: verbos de movimiento → *era andato*."],"ex":[{"t":"gap","q":"Quando sono arrivato, il film ___ già ___ (cominciare).","a":[["era"],["cominciato"]],"x":""},{"t":"gap","q":"Non avevo fame perché ___ già ___ (mangiare).","a":[["avevo"],["mangiato"]],"x":""},{"t":"gap","q":"Lei mi ha detto che ___ ___ (finire) il lavoro.","a":[["aveva"],["finito"]],"x":""},{"t":"gap","q":"Siamo arrivati tardi: gli altri ___ già ___ (uscire).","a":[["erano"],["usciti"]],"x":""},{"t":"gap","q":"Non ___ mai ___ (vedere) il mare prima di quel viaggio. (io)","a":[["avevo"],["visto"]],"x":""},{"t":"mc","q":"«Ya se había ido»","o":["Era già andato via","Aveva già andato via","È già andato via"],"a":0,"x":"andare → essere."},{"t":"mc","q":"«Nunca había estado en Italia» (mujer)","o":["Non ero mai stata in Italia","Non avevo mai stata in Italia","Non ero mai stato in Italia"],"a":0,"x":"essere + concordancia femenina."},{"t":"table","title":"Trapassato","cols":["Persona","mangiare","partire (m.)"],"rows":[{"l":"io","c":[["avevo mangiato"],["ero partito"]]},{"l":"tu","c":[["avevi mangiato"],["eri partito"]]},{"l":"lui","c":[["aveva mangiato"],["era partito"]]},{"l":"noi","c":[["avevamo mangiato"],["eravamo partiti"]]},{"l":"loro","c":[["avevano mangiato"],["erano partiti"]]}]},{"t":"order","es":"Habíamos reservado una mesa.","a":"Avevamo prenotato un tavolo."},{"t":"tr","es":"Cuando llamé, ya había salido (él).","a":["Quando ho chiamato, era già uscito","Quando ho chiamato era già uscito"]}]},{"id":"b1-6","lvl":"B1","title":"Congiuntivo presente","sub":"Opinar, desear, dudar","body":"|Persona|parlare|prendere|capire\n|che io|parli|prenda|capisca\n|che tu|parli|prenda|capisca\n|che lui / lei|parli|prenda|capisca\n|che noi|parliamo|prendiamo|capiamo\n|che voi|parliate|prendiate|capiate\n|che loro|parlino|prendano|capiscano\n\nLas tres personas del singular son iguales: por eso a menudo se añade el pronombre (*credo che tu abbia ragione*).\n\nIrregulares: *essere → sia, avere → abbia, fare → faccia, andare → vada, venire → venga, potere → possa, volere → voglia, dovere → debba, sapere → sappia, dire → dica, stare → stia, dare → dia, uscire → esca*.\n\n**Cuándo**: tras verbos de **opinión** (*penso che, credo che, mi sembra che*), deseo (*voglio che, spero che*), expresiones impersonales (*è importante che, bisogna che*) y conjunciones como *benché, sebbene, affinché, prima che, purché, a meno che*.\n\n> La gran diferencia: «creo que **es**» → *credo che **sia***. En italiano la opinión pide congiuntivo. Pero *secondo me* va con indicativo: *secondo me è vero*.","err":["*Penso che è* es muy frecuente entre italianos, pero en registro cuidado se dice *penso che sia*.","*Sapere che* (certeza) va con indicativo: *so che è vero*."],"ex":[{"t":"gap","q":"Penso che Marco ___ (essere) a casa.","a":[["sia"]],"x":"Opinión → congiuntivo."},{"t":"gap","q":"Spero che tu ___ (stare) meglio.","a":[["stia"]],"x":""},{"t":"gap","q":"Voglio che voi ___ (venire) alla festa.","a":[["veniate"]],"x":""},{"t":"gap","q":"Credo che loro ___ (avere) ragione.","a":[["abbiano"]],"x":""},{"t":"gap","q":"È importante che tu ___ (capire) bene.","a":[["capisca"]],"x":""},{"t":"gap","q":"Benché ___ (piovere), esco lo stesso.","a":[["piova"]],"x":""},{"t":"gap","q":"Secondo me, Luca ___ (essere) stanco.","a":[["è"]],"x":"Con «secondo me», indicativo."},{"t":"mc","q":"«Creo que tienes razón»","o":["Credo che hai ragione","Credo che ragione abbia","Credo che tu abbia ragione"],"a":2,"x":"credere che + congiuntivo."},{"t":"mc","q":"¿Cuál NO lleva congiuntivo?","o":["Penso che...","So che...","Spero che..."],"a":1,"x":"sapere = certeza → indicativo."},{"t":"table","title":"Congiuntivo presente","cols":["Infinitivo","che io","che loro"],"rows":[{"l":"essere","c":[["sia"],["siano"]]},{"l":"avere","c":[["abbia"],["abbiano"]]},{"l":"fare","c":[["faccia"],["facciano"]]},{"l":"andare","c":[["vada"],["vadano"]]},{"l":"potere","c":[["possa"],["possano"]]},{"l":"sapere","c":[["sappia"],["sappiano"]]}]},{"t":"order","es":"Espero que vengas pronto.","a":"Spero che tu venga presto."},{"t":"tr","es":"No creo que sea fácil.","a":["Non credo che sia facile","Non penso che sia facile"]}]},{"id":"b1-7","lvl":"B1","title":"Pronombres relativos","sub":"che, cui, il quale, chi, quello che","body":"- **che**: sujeto u objeto directo, invariable: *la ragazza che parla*, *il libro che leggo*.\n- **cui**: detrás de preposición: *la persona con cui parlo*, *la città in cui vivo*, *il motivo per cui ti chiamo*.\n- **il / la quale, i / le quali**: alternativa formal a *che* y *cui*, útil para evitar ambigüedades: *la sorella di Marco, la quale...*\n- **il cui** = cuyo: *l'autore il cui libro ho letto*.\n- **chi** = quien, el que (sin antecedente): *chi cerca, trova*.\n- **quello che / ciò che** = lo que: *fai quello che vuoi*.","err":["«Con el que» no es *con il che*: es *con cui*.","«Lo que» no es *lo che*: es *quello che* o *ciò che*."],"ex":[{"t":"gap","q":"Il ragazzo ___ hai conosciuto è mio cugino.","a":[["che"]],"x":""},{"t":"gap","q":"La città in ___ abito è piccola.","a":[["cui"]],"x":""},{"t":"gap","q":"Non capisco ___ ___ dici. (lo que)","a":[["quello"],["che"]],"x":""},{"t":"gap","q":"Il motivo per ___ ti chiamo è importante.","a":[["cui"]],"x":""},{"t":"gap","q":"___ cerca, trova. (quien)","a":[["chi"]],"x":""},{"t":"gap","q":"È una persona di ___ mi fido.","a":[["cui"]],"x":""},{"t":"gap","q":"La signora con ___ parlavo è la mia vicina.","a":[["cui","la quale"]],"x":""},{"t":"mc","q":"«El amigo con el que viajé»","o":["L'amico con che ho viaggiato","L'amico con cui ho viaggiato","L'amico con il che ho viaggiato"],"a":1,"x":"Tras preposición: cui."},{"t":"mc","q":"«Lo que me gusta es el mar»","o":["Quello che mi piace è il mare","Lo che mi piace è il mare","Che mi piace è il mare"],"a":0,"x":"«Lo que» = quello che."},{"t":"table","title":"¿Che o cui?","cols":["Frase","Relativo"],"rows":[{"l":"Il film ___ ho visto","c":[["che"]]},{"l":"Il bar in ___ lavoro","c":[["cui"]]},{"l":"La ragazza ___ canta","c":[["che"]]},{"l":"Il collega a ___ ho scritto","c":[["cui"]]},{"l":"Il libro di ___ parlo","c":[["cui"]]}]},{"t":"order","es":"La casa en la que vivo es vieja.","a":"La casa in cui vivo è vecchia."},{"t":"tr","es":"Haz lo que quieras.","a":["Fai quello che vuoi","Fai ciò che vuoi","Fai come vuoi"]}]},{"id":"b1-8","lvl":"B1","title":"Passato remoto (reconocimiento)","sub":"El pasado de los libros y de la historia","body":"Se usa en literatura, en la narración histórica y, en el habla, en buena parte del sur de Italia. El objetivo aquí es **reconocerlo** al leer.\n\n|Persona|parlare|credere|dormire\n|io|parlai|credei / credetti|dormii\n|tu|parlasti|credesti|dormisti\n|lui / lei|parlò|credé / credette|dormì\n|noi|parlammo|credemmo|dormimmo\n|voi|parlaste|credeste|dormiste\n|loro|parlarono|crederono / credettero|dormirono\n\nMuchos verbos son irregulares solo en *io, lui, loro*: *fare → feci, fece, fecero*; *dire → dissi, disse, dissero*; *vedere → vidi, vide, videro*; *venire → venni, venne, vennero*; *scrivere → scrissi, scrisse*; *prendere → presi, prese*; *nascere → nacqui, nacque*; *vivere → vissi, visse*.\n\n*essere*: fui, fosti, fu, fummo, foste, furono · *avere*: ebbi, avesti, ebbe, avemmo, aveste, ebbero.","err":["Para contar lo que hiciste ayer, usa passato prossimo; el remoto en la conversación suena literario en el centro-norte."],"ex":[{"t":"mc","q":"«Dante nacque a Firenze». ¿Infinitivo de «nacque»?","o":["nascondere","nascere","notare"],"a":1,"x":"nacque → nascere."},{"t":"mc","q":"«Ebbero tre figli». ¿Infinitivo?","o":["essere","avere","entrare"],"a":1,"x":"ebbero → avere."},{"t":"mc","q":"«Fu un grande scrittore» equivale a...","o":["è stato","era stato","sarà"],"a":0,"x":"En el habla: passato prossimo."},{"t":"gap","q":"Garibaldi ___ (arrivare) in Sicilia nel 1860.","a":[["arrivò"]],"x":""},{"t":"gap","q":"I romani ___ (costruire) molte strade.","a":[["costruirono"]],"x":""},{"t":"gap","q":"Leonardo ___ (dipingere) la Gioconda.","a":[["dipinse"]],"x":""},{"t":"gap","q":"Quella sera Marco ___ (dire) la verità.","a":[["disse"]],"x":""},{"t":"gap","q":"Io ___ (essere) molto felice quel giorno.","a":[["fui"]],"x":""},{"t":"table","title":"Passato remoto","cols":["Infinitivo","io","lui / lei"],"rows":[{"l":"essere","c":[["fui"],["fu"]]},{"l":"avere","c":[["ebbi"],["ebbe"]]},{"l":"fare","c":[["feci"],["fece"]]},{"l":"vedere","c":[["vidi"],["vide"]]},{"l":"venire","c":[["venni"],["venne"]]},{"l":"dire","c":[["dissi"],["disse"]]}]},{"t":"order","es":"Él escribió una carta.","a":"Lui scrisse una lettera."},{"t":"tr","es":"Ellos vivieron en Roma (passato remoto).","a":["Vissero a Roma","Loro vissero a Roma"]}]},{"id":"b2-1","lvl":"B2","title":"Congiuntivo imperfetto y trapassato","sub":"Pensavo che fosse... · Magari!","body":"|Persona|parlare|prendere|dormire|essere\n|che io|parlassi|prendessi|dormissi|fossi\n|che tu|parlassi|prendessi|dormissi|fossi\n|che lui / lei|parlasse|prendesse|dormisse|fosse\n|che noi|parlassimo|prendessimo|dormissimo|fossimo\n|che voi|parlaste|prendeste|dormiste|foste\n|che loro|parlassero|prendessero|dormissero|fossero\n\nIrregulares: *dare → dessi, stare → stessi, fare → facessi, dire → dicessi, bere → bevessi*.\n\n**Trapassato**: *avessi / fossi* + participio: *credevo che fosse già partito*.\n\nUsos: cuando el verbo principal está en pasado o condicional (*pensavo che fosse...*, *vorrei che tu venissi*), tras *come se* (*parla come se sapesse tutto*) y en deseos con *magari* (*magari fosse vero!*).","err":["El español tiene «-ra» y «-se»; el italiano solo **-ssi**: «si yo fuera» = *se io fossi*.","*Vorrei che vieni* es incorrecto: condicional + congiuntivo imperfetto, *vorrei che venissi*."],"ex":[{"t":"gap","q":"Pensavo che tu ___ (essere) a casa.","a":[["fossi"]],"x":""},{"t":"gap","q":"Vorrei che voi ___ (venire) con noi.","a":[["veniste"]],"x":""},{"t":"gap","q":"Era necessario che loro ___ (capire).","a":[["capissero"]],"x":""},{"t":"gap","q":"Mi parlava come se ___ (sapere) tutto. (lui)","a":[["sapesse"]],"x":""},{"t":"gap","q":"Magari ___ (fare) bel tempo domani!","a":[["facesse"]],"x":""},{"t":"gap","q":"Credevo che Sara ___ già ___ (partire).","a":[["fosse"],["partita"]],"x":""},{"t":"gap","q":"Non sapevo che voi ___ ___ (comprare) casa.","a":[["aveste"],["comprato"]],"x":""},{"t":"mc","q":"«Quería que me ayudaras»","o":["Volevo che mi aiutavi","Volevo che mi aiutassi","Volevo che mi aiuteresti"],"a":1,"x":"Pasado + deseo → congiuntivo imperfetto."},{"t":"mc","q":"«Ojalá estuvieras aquí»","o":["Magari fossi qui","Magari eri qui","Magari saresti qui"],"a":0,"x":"Magari + congiuntivo imperfetto."},{"t":"table","title":"Congiuntivo imperfetto","cols":["Persona","essere","avere","fare"],"rows":[{"l":"io","c":[["fossi"],["avessi"],["facessi"]]},{"l":"tu","c":[["fossi"],["avessi"],["facessi"]]},{"l":"lui / lei","c":[["fosse"],["avesse"],["facesse"]]},{"l":"noi","c":[["fossimo"],["avessimo"],["facessimo"]]},{"l":"voi","c":[["foste"],["aveste"],["faceste"]]},{"l":"loro","c":[["fossero"],["avessero"],["facessero"]]}]},{"t":"order","es":"Pensaba que habías entendido.","a":"Pensavo che avessi capito."},{"t":"tr","es":"Me gustaría que dijeras la verdad.","a":["Vorrei che dicessi la verità","Mi piacerebbe che dicessi la verità"]}]},{"id":"b2-2","lvl":"B2","title":"Periodo ipotetico","sub":"Si tuviera..., si hubiera sabido...","body":"|Tipo|Condición (se...)|Consecuencia|Ejemplo\n|Real|presente|presente / futuro / imperativo|Se piove, resto a casa\n|Posible|cong. imperfetto|condizionale presente|Se avessi tempo, viaggerei\n|Irreal (pasado)|cong. trapassato|condizionale passato|Se avessi studiato, avrei superato l'esame\n\n**Mixto**: condición pasada con consecuencia presente: *se avessi studiato, ora avrei un lavoro migliore*.\n\nEn el habla informal se oye *se lo sapevo, venivo* (imperfetto + imperfetto): entiéndelo, pero no lo uses en un examen.\n\n> Regla de oro: **nunca condizionale después de «se»**. *Se avrei* es un error típico (también entre italianos).","err":["«Si tuviera» = *se avessi*, nunca *se avrei*.","«Si lo hubiera sabido, habría venido» = *se l'avessi saputo, sarei venuto*."],"ex":[{"t":"gap","q":"Se ___ (piovere), restiamo a casa.","a":[["piove"]],"x":""},{"t":"gap","q":"Se ___ (io, avere) più soldi, comprerei una casa al mare.","a":[["avessi"]],"x":""},{"t":"gap","q":"Se fossi in te, ___ (io, accettare) il lavoro.","a":[["accetterei"]],"x":""},{"t":"gap","q":"Se ___ ___ (io, sapere), ti avrei aiutato.","a":[["avessi"],["saputo"]],"x":""},{"t":"gap","q":"Se mi avessi chiamato, ___ ___ (io, venire).","a":[["sarei"],["venuto","venuta"]],"x":""},{"t":"gap","q":"Se tu ___ (essere) più paziente, andrebbe meglio.","a":[["fossi"]],"x":""},{"t":"gap","q":"Se finisci presto, ___ (tu, chiamare + mi)!","a":[["chiamami"]],"x":""},{"t":"mc","q":"«Si lo hubiera sabido, habría venido»","o":["Se l'avrei saputo, sarei venuto","Se l'avessi saputo, sarei venuto","Se lo sapessi, sarei venuto"],"a":1,"x":"Tipo III."},{"t":"mc","q":"¿Cuál es correcta?","o":["Se avrei tempo, verrei","Se avessi tempo, verrei","Se ho tempo, verrei"],"a":1,"x":"Nunca condizionale tras «se»."},{"t":"table","title":"Completa la hipótesis","cols":["Frase","Forma"],"rows":[{"l":"Se io ___ (potere), verrei","c":[["potessi"]]},{"l":"Se loro ___ (essere) qui, sarebbe meglio","c":[["fossero"]]},{"l":"Se avessi tempo, ___ (io, viaggiare)","c":[["viaggerei"]]},{"l":"Se ___ (noi, sapere), saremmo venuti","c":[["avessimo saputo"]]},{"l":"Se piove, ___ (io, restare) a casa","c":[["resto"]]}]},{"t":"order","es":"Si fuera rico, viajaría por todo el mundo.","a":"Se fossi ricco, viaggerei per tutto il mondo."},{"t":"tr","es":"Si tienes tiempo, llámame.","a":["Se hai tempo, chiamami","Se hai tempo chiamami"]}]},{"id":"b2-3","lvl":"B2","title":"Voz pasiva y si passivante","sub":"Se vende, se vive, va fatto","body":"**Pasiva con essere**: *essere* + participio (concuerda) + *da*: *La casa è stata costruita da mio nonno.*\n\n**Pasiva con venire** (solo tiempos simples, más dinámica): *La porta viene chiusa alle otto.*\n\n**Pasiva con andare** = obligación: *Il biglietto va timbrato* (el billete debe validarse).\n\n**Si passivante**: el verbo concuerda con el objeto: *si vende una casa / si vendono case*.\n\n**Si impersonale**: *si vive bene qui*; con adjetivos, plural: *si è felici*; con reflexivos, **ci si**: *ci si alza presto*.","err":["«Se buscan camareros» = *si cercano camerieri* (plural).","«Uno se levanta temprano» = *ci si alza presto*, no *si si alza*."],"ex":[{"t":"gap","q":"Il Colosseo ___ ___ ___ (costruire) dai Romani.","a":[["è"],["stato"],["costruito"]],"x":""},{"t":"gap","q":"In questo negozio si ___ (vendere) libri usati.","a":[["vendono"]],"x":""},{"t":"gap","q":"In Italia si ___ (mangiare) bene.","a":[["mangia"]],"x":""},{"t":"gap","q":"La lettera ___ scritta dal direttore. (venire, presente)","a":[["viene"]],"x":""},{"t":"gap","q":"Questo documento ___ firmato entro lunedì. (debe ser)","a":[["va"]],"x":"andare + participio = obligación."},{"t":"gap","q":"La domenica ci si ___ (alzare) tardi.","a":[["alza"]],"x":""},{"t":"gap","q":"Le case ___ state vendute in un mese.","a":[["sono"]],"x":""},{"t":"mc","q":"«Se buscan camareros»","o":["Si cerca camerieri","Si cercano camerieri","Si cercano ai camerieri"],"a":1,"x":"El verbo concuerda con el objeto plural."},{"t":"mc","q":"«Uno se divierte mucho aquí»","o":["Si si diverte molto qui","Ci si diverte molto qui","Uno si diverte molto qui"],"a":1,"x":"si + si → ci si."},{"t":"table","title":"Activa → pasiva","cols":["Activa","Verbo pasivo"],"rows":[{"l":"Marco scrive la lettera","c":[["è scritta"]]},{"l":"I turisti visitano Roma","c":[["è visitata"]]},{"l":"Il cuoco ha preparato la cena","c":[["è stata preparata"]]},{"l":"Hanno chiuso i negozi","c":[["sono stati chiusi"]]}]},{"t":"order","es":"El billete debe ser validado.","a":"Il biglietto va timbrato."},{"t":"tr","es":"Aquí se habla italiano.","a":["Qui si parla italiano","Si parla italiano qui"]}]},{"id":"b2-4","lvl":"B2","title":"Discurso indirecto","sub":"Ha detto che sarebbe venuto","body":"Cuando el verbo introductor está en pasado (*ha detto, disse, ha chiesto*), los tiempos retroceden:\n\n|Discurso directo|Discurso indirecto\n|presente: «Sono stanco»|imperfetto: disse che era stanco\n|passato prossimo: «Ho perso il treno»|trapassato: disse che aveva perso il treno\n|futuro: «Verrò»|condizionale passato: disse che sarebbe venuto\n|imperativo: «Chiamami!»|di + infinito: mi disse di chiamarlo\n|congiuntivo presente|congiuntivo imperfetto\n\nCambian también tiempo y lugar: *oggi → quel giorno, domani → il giorno dopo, ieri → il giorno prima, qui → lì, questo → quello*.\n\n> Diferencia clave: «dijo que **vendría**» (condicional simple en español) = *disse che **sarebbe venuto*** (condizionale passato en italiano).","err":["*Ha detto che verrebbe* es un calco del español: lo correcto es *sarebbe venuto*."],"ex":[{"t":"gap","q":"«Sono stanco» → Marco ha detto che ___ stanco.","a":[["era"]],"x":""},{"t":"gap","q":"«Ho perso il treno» → Ha detto che ___ ___ il treno.","a":[["aveva"],["perso"]],"x":""},{"t":"gap","q":"«Verrò domani» → Ha detto che ___ ___ il giorno dopo.","a":[["sarebbe"],["venuto"]],"x":"Futuro en el pasado = condizionale passato."},{"t":"gap","q":"«Chiamami!» → Mi ha detto ___ chiamarlo.","a":[["di"]],"x":""},{"t":"gap","q":"«Abito qui» → Ha detto che abitava ___ .","a":[["lì","là"]],"x":""},{"t":"gap","q":"«Ti scriverò» → Mi ha promesso che mi ___ ___ .","a":[["avrebbe"],["scritto"]],"x":""},{"t":"mc","q":"«Dijo que me llamaría»","o":["Ha detto che mi chiamerebbe","Ha detto che mi avrebbe chiamato","Ha detto che mi chiamerà"],"a":1,"x":"Futuro en el pasado."},{"t":"mc","q":"«Domani» en estilo indirecto pasado →","o":["ieri","il giorno dopo","oggi"],"a":1,"x":"domani → il giorno dopo."},{"t":"table","title":"Cambios de tiempo","cols":["Directo","Indirecto (pasado)"],"rows":[{"l":"presente","c":[["imperfetto"]]},{"l":"passato prossimo","c":[["trapassato prossimo"]]},{"l":"futuro","c":[["condizionale passato"]]},{"l":"imperativo","c":[["di + infinito"]]}]},{"t":"order","es":"Me preguntó si tenía hambre.","a":"Mi ha chiesto se avevo fame."},{"t":"tr","es":"Dijo que vendría a las ocho.","a":["Ha detto che sarebbe venuto alle otto","Ha detto che sarebbe venuta alle otto","Disse che sarebbe venuto alle otto"]}]},{"id":"b2-5","lvl":"B2","title":"Concordancia de tiempos","sub":"Qué congiuntivo usar en cada caso","body":"|Verbo principal|Acción simultánea|Acción anterior|Acción posterior\n|presente / futuro: *penso che*|cong. presente: sia|cong. passato: sia stato|cong. presente o futuro: sia / sarà\n|pasado: *pensavo che*|cong. imperfetto: fosse|cong. trapassato: fosse stato|condizionale passato: sarebbe stato\n|condicional: *vorrei che*|cong. imperfetto: fosse|cong. trapassato: fosse stato|—\n\n**Congiuntivo passato** = *abbia / sia* + participio: *credo che sia partito ieri*.","err":["«Esperaba que vinieras» = *speravo che venissi*, no *che venga*.","Futuro en el pasado sin congiuntivo: *pensavo che sarebbe piovuto*."],"ex":[{"t":"gap","q":"Credo che Luca ___ (partire) ieri.","a":[["sia partito"]],"x":""},{"t":"gap","q":"Credevo che Luca ___ (partire) il giorno prima.","a":[["fosse partito"]],"x":""},{"t":"gap","q":"Penso che domani ___ (piovere).","a":[["piova","pioverà"]],"x":""},{"t":"gap","q":"Pensavo che il giorno dopo ___ (piovere).","a":[["sarebbe piovuto"]],"x":""},{"t":"gap","q":"Vorrei che tu mi ___ (ascoltare).","a":[["ascoltassi"]],"x":""},{"t":"gap","q":"Era strano che nessuno ___ (rispondere) al telefono.","a":[["rispondesse"]],"x":""},{"t":"gap","q":"Sono contento che tu ___ (superare) l'esame ieri.","a":[["abbia superato"]],"x":""},{"t":"mc","q":"«Esperaba que vinieras»","o":["Speravo che venissi","Speravo che venga","Speravo che verresti"],"a":0,"x":"Pasado + simultaneidad → cong. imperfetto."},{"t":"mc","q":"«No sabía que te habías mudado»","o":["Non sapevo che ti fossi trasferito","Non sapevo che ti sei trasferito","Non sapevo che ti trasferisca"],"a":0,"x":"Anterioridad en el pasado → trapassato."},{"t":"table","title":"Consecutio","cols":["Principal","Simultánea","Anterior"],"rows":[{"l":"Penso che","c":[["sia"],["sia stato"]]},{"l":"Pensavo che","c":[["fosse"],["fosse stato"]]},{"l":"Penserei che","c":[["fosse"],["fosse stato"]]}]},{"t":"order","es":"Me alegro de que hayas venido.","a":"Sono contento che tu sia venuto."},{"t":"tr","es":"Pensaba que estabas enfermo.","a":["Pensavo che fossi malato","Pensavo che tu fossi malato"]}]},{"id":"b2-6","lvl":"B2","title":"Gerundio e infinitivo","sub":"Sto lavorando, dopo aver mangiato, continuo a...","body":"**Gerundio**: *-ando* (-are), *-endo* (-ere, -ire): *parlando, prendendo, dormendo*. Irregulares: *facendo, dicendo, bevendo*.\n- *stare + gerundio*: acción en curso: *sto lavorando*.\n- causa, modo o tiempo: *sbagliando s'impara*, *studiando ho capito*.\n- gerundio pasado: *avendo mangiato, essendo arrivato*.\n- los pronombres se unen: *guardandolo*.\n\n**Infinitivo**:\n- como sustantivo: *il mangiare sano*.\n- tras preposición: *prima di partire*; tras *dopo*, **infinito passato**: *dopo aver mangiato*.\n- verbos + **a**: *cominciare, continuare, provare, riuscire, imparare, aiutare*.\n- verbos + **di**: *finire, smettere, cercare, decidere, avere voglia, avere bisogno, pensare*.","err":["«Después de comer» = *dopo aver mangiato* (no *dopo mangiare*).","«Sigo pensando» = *continuo a pensare*: el italiano no usa «seguir + gerundio».","«Al llegar» = *arrivando* o *quando arrivo*, no *al arrivare*."],"ex":[{"t":"gap","q":"In questo momento ___ ___ . (io, stare + lavorare)","a":[["sto"],["lavorando"]],"x":""},{"t":"gap","q":"Dopo ___ ___ (mangiare), facciamo una passeggiata.","a":[["aver"],["mangiato"]],"x":"Infinito passato tras dopo."},{"t":"gap","q":"Ho smesso ___ fumare.","a":[["di"]],"x":""},{"t":"gap","q":"Continuo ___ studiare l'italiano.","a":[["a"]],"x":"continuare a + infinitivo."},{"t":"gap","q":"___ (sbagliare) s'impara.","a":[["sbagliando"]],"x":""},{"t":"gap","q":"Prima ___ uscire, chiudi la finestra.","a":[["di"]],"x":""},{"t":"gap","q":"Cerco ___ capire.","a":[["di"]],"x":""},{"t":"mc","q":"«Sigo pensando que tienes razón»","o":["Continuo pensando","Continuo a pensare","Seguo pensando"],"a":1,"x":"continuare a + infinitivo."},{"t":"mc","q":"«Después de llegar, llamé a mi madre»","o":["Dopo arrivare","Dopo essere arrivato","Dopo arrivando"],"a":1,"x":"dopo + infinito passato."},{"t":"table","title":"¿A o di?","cols":["Verbo","Preposición"],"rows":[{"l":"cominciare","c":[["a"]]},{"l":"finire","c":[["di"]]},{"l":"provare","c":[["a"]]},{"l":"decidere","c":[["di"]]},{"l":"riuscire","c":[["a"]]},{"l":"avere voglia","c":[["di"]]}]},{"t":"order","es":"Estamos viendo una película.","a":"Stiamo guardando un film."},{"t":"tr","es":"Leyendo se aprende mucho.","a":["Leggendo si impara molto","Leggendo s'impara molto"]}]}],"dialogs":[{"id":"festa","lvl":"A1","title":"Alla festa","who":"Sara","role":"conocida","reg":"tu","desc":"En una fiesta en casa de Marco, una chica se te acerca.","nodes":{"n1":{"it":"Ciao! Sei un amico di Marco?","es":"¡Hola! ¿Eres amigo/a de Marco?","o":[{"it":"Sì, ciao! Mi chiamo {nome}. E tu?","es":"¡Sí, hola! Me llamo {nome}. ¿Y tú?","next":"n2"},{"it":"Sì, siamo colleghi. Piacere, {nome}.","es":"Sí, somos compañeros de trabajo. Encantado/a, {nome}.","next":"n2"},{"it":"Buonasera signora, come sta?","es":"Buenas tardes señora, ¿cómo está?","bad":"En una fiesta entre gente joven se usa el tu. «Signora» y «come sta» suenan demasiado formales."}]},"n2":{"it":"Piacere, io sono Sara. Di dove sei? Non sei italian{o}, vero?","es":"Encantada, yo soy Sara. ¿De dónde eres? No eres italiano/a, ¿verdad?","o":[{"it":"No, sono spagnol{o}, di Madrid.","es":"No, soy español/a, de Madrid.","next":"n3"},{"it":"No, sono di Valencia, in Spagna.","es":"No, soy de Valencia, en España.","next":"n3"},{"it":"No, sono in Spagna.","es":"No, estoy en España.","bad":"«Sono in Spagna» significa que ahora estás en España. Para el origen: «sono di...»."}]},"n3":{"it":"Che bello! E cosa fai qui in Italia?","es":"¡Qué bien! ¿Y qué haces aquí en Italia?","o":[{"it":"Studio italiano e lavoro in un'azienda.","es":"Estudio italiano y trabajo en una empresa.","next":"n4"},{"it":"Sono qui per lavoro. Faccio l'ingegnere.","es":"Estoy aquí por trabajo. Soy ingeniero/a.","next":"n4"},{"it":"Ho qui per lavoro.","es":"(Tengo aquí por trabajo.)","bad":"«Estar aquí» se dice con essere: «sono qui»."}]},"n4":{"it":"Parli molto bene! Da quanto tempo studi italiano?","es":"¡Hablas muy bien! ¿Desde cuándo estudias italiano?","o":[{"it":"Grazie! Studio italiano da un anno.","es":"¡Gracias! Estudio italiano desde hace un año.","next":"n5"},{"it":"Da sei mesi, ma è difficile!","es":"Desde hace seis meses, ¡pero es difícil!","next":"n5"},{"it":"Studio italiano fa un anno.","es":"(Estudio italiano hace un año.)","bad":"«Desde hace» con presente es «da»: «studio da un anno»."}]},"n5":{"it":"Senti, vuoi qualcosa da bere? C'è vino, birra, succo...","es":"Oye, ¿quieres algo de beber? Hay vino, cerveza, zumo...","o":[{"it":"Sì, grazie, un bicchiere di vino rosso.","es":"Sí, gracias, una copa de vino tinto.","next":"n6"},{"it":"Volentieri, una birra, grazie.","es":"Con gusto, una cerveza, gracias.","next":"n6"}]},"n6":{"it":"Ecco a te! Allora, cin cin! Piacere di averti conosciut{o}.","es":"¡Aquí tienes! Bueno, ¡chin chin! Encantada de haberte conocido.","o":[{"it":"Cin cin! Piacere mio, Sara.","es":"¡Chin chin! El gusto es mío, Sara.","next":"n7"},{"it":"Altrettanto! A dopo!","es":"¡Igualmente! ¡Hasta luego!","next":"n7"}]},"n7":{"it":"Ci vediamo dopo, vado a salutare Marco. Ciao!","es":"Nos vemos luego, voy a saludar a Marco. ¡Chao!","o":[]}},"start":"n1","vocab":[["piacere","encantado/a"],["di dove sei?","¿de dónde eres?"],["da quanto tempo?","¿desde cuándo?"],["volentieri","con gusto"],["cin cin","chin chin"],["altrettanto","igualmente"]],"frasi":[["Piacere mio.","El gusto es mío."],["Ecco a te!","¡Aquí tienes!"],["Ci vediamo dopo.","Nos vemos luego."]]},{"id":"bar","lvl":"A1","title":"Al bar","who":"Il barista","role":"camarero","reg":"Lei","desc":"Por la mañana en un bar de Roma. Quieres desayunar.","nodes":{"n1":{"it":"Buongiorno! Cosa le preparo?","es":"¡Buenos días! ¿Qué le pongo?","o":[{"it":"Buongiorno! Un cappuccino e un cornetto, per favore.","es":"¡Buenos días! Un capuchino y un cruasán, por favor.","next":"n2"},{"it":"Vorrei un caffè macchiato, grazie.","es":"Quería un cortado, gracias.","next":"n2"},{"it":"Dammi un caffè.","es":"Dame un café.","bad":"Con el camarero se usa Lei y una petición cortés: «vorrei...» o «un caffè, per favore»."}]},"n2":{"it":"Certo. Il cornetto lo vuole vuoto, alla crema o alla marmellata?","es":"Claro. ¿El cruasán lo quiere vacío, de crema o de mermelada?","o":[{"it":"Alla crema, per favore.","es":"De crema, por favor.","next":"n3"},{"it":"Vuoto, grazie.","es":"Vacío, gracias.","next":"n3"}]},"n3":{"it":"Lo prende al banco o al tavolo?","es":"¿Lo toma en la barra o en la mesa?","o":[{"it":"Al banco, grazie.","es":"En la barra, gracias.","next":"n4"},{"it":"Al tavolo, fuori, se possibile.","es":"En la mesa, fuera, si es posible.","next":"n4"},{"it":"Lo prendo nel banco.","es":"(Lo tomo dentro del banco.)","bad":"«En la barra» = «al banco». Nota: en Italia en la mesa suele costar más."}]},"n4":{"it":"Ecco qua. Desidera altro?","es":"Aquí tiene. ¿Desea algo más?","o":[{"it":"No, basta così. Quant'è?","es":"No, nada más. ¿Cuánto es?","next":"n5"},{"it":"Anche un bicchiere d'acqua, per favore.","es":"También un vaso de agua, por favor.","next":"n4b"}]},"n4b":{"it":"Naturale o frizzante?","es":"¿Sin gas o con gas?","o":[{"it":"Naturale, grazie. Quant'è in tutto?","es":"Sin gas, gracias. ¿Cuánto es en total?","next":"n5"},{"it":"Frizzante. Quanto le devo?","es":"Con gas. ¿Cuánto le debo?","next":"n5"}]},"n5":{"it":"Sono tre euro e cinquanta.","es":"Son tres euros cincuenta.","o":[{"it":"Ecco a lei. Posso pagare con la carta?","es":"Aquí tiene. ¿Puedo pagar con tarjeta?","next":"n6"},{"it":"Ecco cinque euro.","es":"Aquí tiene cinco euros.","next":"n6"}]},"n6":{"it":"Certo, nessun problema. Grazie e buona giornata!","es":"Claro, ningún problema. ¡Gracias y que tenga un buen día!","o":[]}},"start":"n1","vocab":[["al banco","en la barra"],["vuoto","vacío (sin relleno)"],["desidera altro?","¿desea algo más?"],["basta così","nada más"],["quant'è?","¿cuánto es?"],["naturale / frizzante","sin gas / con gas"]],"frasi":[["Cosa le preparo?","¿Qué le pongo?"],["Quanto le devo?","¿Cuánto le debo?"],["Buona giornata!","¡Buen día!"]]},{"id":"taxi","lvl":"A1","title":"In taxi","who":"Franco","role":"taxista","reg":"Lei","desc":"Sales de la estación de Termini y coges un taxi.","nodes":{"n1":{"it":"Buonasera! Dove la porto?","es":"¡Buenas tardes! ¿Adónde le llevo?","o":[{"it":"Buonasera, all'hotel Navona, in via dei Coronari, per favore.","es":"Buenas tardes, al hotel Navona, en via dei Coronari, por favor.","next":"n2"},{"it":"A piazza Navona, per favore.","es":"A piazza Navona, por favor.","next":"n2"},{"it":"Voglio andare hotel.","es":"(Quiero ir hotel.)","bad":"Falta la preposición: «all'hotel». Y mejor con «per favore»."}]},"n2":{"it":"Va bene. Mette la valigia nel bagagliaio?","es":"Muy bien. ¿Mete la maleta en el maletero?","o":[{"it":"Sì, grazie. Quanto ci vuole?","es":"Sí, gracias. ¿Cuánto se tarda?","next":"n3"},{"it":"Sì. Quanto costa più o meno la corsa?","es":"Sí. ¿Cuánto cuesta más o menos el trayecto?","next":"n3b"}]},"n3":{"it":"Con questo traffico, una ventina di minuti.","es":"Con este tráfico, unos veinte minutos.","o":[{"it":"Perfetto. E quanto costa più o meno?","es":"Perfecto. ¿Y cuánto cuesta más o menos?","next":"n3b"}]},"n3b":{"it":"Dalla stazione al centro c'è la tariffa fissa: quindici euro.","es":"De la estación al centro hay tarifa fija: quince euros.","o":[{"it":"D'accordo. Posso pagare con la carta?","es":"De acuerdo. ¿Puedo pagar con tarjeta?","next":"n4"},{"it":"Va bene, ho i contanti.","es":"Vale, llevo efectivo.","next":"n4"}]},"n4":{"it":"È la prima volta a Roma?","es":"¿Es la primera vez en Roma?", r Ferri. Recuerda: ¡a él se le trata de usted!","o":[{"it":"D'accordo, grazie del consiglio!","es":"¡De acuerdo, gracias por el consejo!","next":"n6"}]},"n6":{"it":"Figurati! Benvenut{o} in squadra!","es":"¡No hay de qué! ¡Bienvenido/a al equipo!","o":[]}},"start":"n1","vocab":[["la pausa pranzo","la pausa para comer"],["la mensa","el comedor"],["la macchinetta del caffè","la máquina de café"],["il capo","el jefe"],["dare del Lei","tratar de usted"]],"frasi":[["Sono io!","¡Soy yo!"],["Figurati!","¡No hay de qué!"],["Benvenuto in squadra!","¡Bienvenido al equipo!"]]},{"id":"weekend","lvl":"A2","title":"Com'è andato il weekend?","who":"Marco","role":"amigo","reg":"tu","desc":"Lunes por la mañana. Tu amigo Marco te pregunta por el fin de semana.","nodes":{"n1":{"it":"Ehi! Com'è andato il weekend?","es":"¡Eh! ¿Qué tal el fin de semana?","o":[{"it":"Benissimo! Sono andat{o} al lago di Como.","es":"¡Genial! Fui al lago de Como.","next":"n2"},{"it":"Tranquillo. Sono rimast{o} a casa e ho visto una serie.","es":"Tranquilo. Me quedé en casa y vi una serie.","next":"n2b"},{"it":"Benissimo! Ho andato al lago di Como.","es":"¡Genial! Fui al lago de Como.","bad":"«Andare» forma el pasado con essere: «sono andato/a»."}]},"n2":{"it":"Che bello! Con chi sei andat{o}?","es":"¡Qué bien! ¿Con quién fuiste?","o":[{"it":"Con dei colleghi. Abbiamo preso il treno sabato mattina.","es":"Con unos compañeros. Cogimos el tren el sábado por la mañana.","next":"n3"},{"it":"Da sol{o}. Avevo bisogno di riposare.","es":"Solo/a. Necesitaba descansar.","next":"n3"}]},"n2b":{"it":"Quale serie hai visto?","es":"¿Qué serie viste?","o":[{"it":"Una serie italiana, molto bella. L'ho finita in due giorni!","es":"Una serie italiana, muy buena. ¡La terminé en dos días!","next":"n3c"},{"it":"Una serie italiana. L'ho finito in due giorni.","es":"... ¡La terminé en dos días!","bad":"«La serie» es femenino: «l'ho finita»."}]},"n3":{"it":"E cosa avete fatto?","es":"¿Y qué hicisteis?","o":[{"it":"Abbiamo fatto una gita in barca e abbiamo mangiato il pesce di lago.","es":"Hicimos una excursión en barco y comimos pescado de lago.","next":"n4"},{"it":"Ho camminato tanto e ho fatto molte foto.","es":"Caminé mucho e hice muchas fotos.","next":"n4"}]},"n3c":{"it":"Brav{o}, così impari l'italiano! E sabato sera sei uscit{o}?","es":"¡Bien hecho, así aprendes italiano! ¿Y el sábado por la noche saliste?","o":[{"it":"Sì, sono andat{o} a cena da un'amica.","es":"Sí, fui a cenar a casa de una amiga.","next":"n4"},{"it":"No, ero stanc{o} e sono andat{o} a letto presto.","es":"No, estaba cansado/a y me fui a la cama pronto.","next":"n4"}]},"n4":{"it":"Dai, che invidia! Io invece ho lavorato tutto il weekend.","es":"¡Venga, qué envidia! Yo, en cambio, trabajé todo el fin de semana.","o":[{"it":"Mi dispiace! La prossima volta vieni con me.","es":"¡Lo siento! La próxima vez vente conmigo.","next":"n5"},{"it":"Poverino! Allora stasera ti offro un aperitivo.","es":"¡Pobrecillo! Entonces esta noche te invito a un aperitivo.","next":"n5"}]},"n5":{"it":"Affare fatto! Ci vediamo alle sette al solito bar.","es":"¡Trato hecho! Nos vemos a las siete en el bar de siempre.","o":[]}},"start":"n1","vocab":[["com'è andato?","¿qué tal fue?"],["rimanere a casa","quedarse en casa"],["la gita in barca","la excursión en barco"],["che invidia!","¡qué envidia!"],["offrire","invitar"],["il solito bar","el bar de siempre"]],"frasi":[["Mi dispiace!","¡Lo siento!"],["Affare fatto!","¡Trato hecho!"],["La prossima volta...","La próxima vez..."]]},{"id":"hotel","lvl":"A2","title":"In albergo","who":"La receptionist","role":"recepcionista","reg":"Lei","desc":"Llegas a un hotel en Florencia con una reserva.","nodes":{"n1":{"it":"Buonasera e benvenut{o}! Ha una prenotazione?","es":"¡Buenas tardes y bienvenido/a! ¿Tiene reserva?","o":[{"it":"Sì, ho prenotato una camera doppia a nome {nome}.","es":"Sí, he reservado una habitación doble a nombre de {nome}.","next":"n2"},{"it":"Buonasera. Sì, per tre notti.","es":"Buenas tard
